<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Ball Rush - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #1a1a3e;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --accent2: #f7c948;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 420px;
            margin-top: 30px;
        }

        .option-card {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .option-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(45deg, #ff6b35, #f7c948); color: #0a0a1a; }
        .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 2px solid var(--border); }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
        }

        .code-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 5px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-score {
            font-size: 2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .timer-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
        }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="connection-screen" id="connectionScreen">
        <h1 class="game-title">⚽ Ball Rush</h1>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                <button class="btn btn-primary" onclick="createGame()">Crear Sala</button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="text-align:center;color:var(--text-secondary);">Esperando oponente...</p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                <input type="text" id="gameCode" placeholder="CÓDIGO" maxlength="6" oninput="this.value=this.value.toUpperCase()">
                <button class="btn btn-secondary" onclick="joinGame()">Unirse</button>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.5rem;">😊</span>
                <div>
                    <div id="yourName" style="font-size:0.8rem;">Tú</div>
                    <div class="player-score" id="yourScore">0</div>
                </div>
            </div>
            <div class="timer-text" id="timerText">60</div>
            <div style="display:flex;align-items:center;gap:10px;text-align:right;">
                <div>
                    <div id="opponentName" style="font-size:0.8rem;">Oponente</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
                <span style="font-size:1.5rem;">😎</span>
            </div>
        </div>
        <div class="game-canvas-container"><canvas id="canvas"></canvas></div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="margin-bottom:15px;font-size:2rem;"></h2>
            <div id="resultDetails" style="margin-bottom:25px;font-size:1.2rem;"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const BALL_R = 15;
        const PLAYER_R = 30;
        const GOAL_H = 40;
        const COLLISION_DIST = BALL_R + PLAYER_R;
        const KICK_SPEED = 12;
        const COOLDOWN = 300;
        
        let canvas, ctx, W, H;
        let gameRef, gameCode, myKey, isHost;
        let gameActive = false;
        let lastKickTime = 0;
        
        const my = { x: 0, y: 0, score: 0, name: '' };
        const opp = { x: 0, y: 0, score: 0, name: '' };
        const ball = { x: 0, y: 0, vx: 0, vy: 0 };
        
        function createGame() {
            my.name = document.getElementById('playerName').value || 'Jugador 1';
            isHost = true;
            myKey = 'host';
            gameCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            document.getElementById('yourName').textContent = my.name;
            
            gameRef = db.ref('games/' + gameCode);
            gameRef.set({
                host: { name: my.name, x: 0.5, y: 0.75, score: 0 },
                opponent: { name: '', x: 0.5, y: 0.25, score: 0, connected: false },
                ball: { x: 0.5, y: 0.5, vx: 5, vy: 3 },
                active: true,
                timeLeft: 60
            });
            
            // Escuchar TODO del oponente
            gameRef.child('opponent').on('value', snap => {
                const d = snap.val();
                if (d) {
                    if (d.name) {
                        opp.name = d.name;
                        document.getElementById('opponentName').textContent = d.name;
                    }
                    if (d.x !== undefined && d.x !== null) opp.x = d.x * W;
                    if (d.y !== undefined && d.y !== null) opp.y = d.y * H;
                    if (d.score !== undefined && d.score !== null) {
                        opp.score = d.score;
                        document.getElementById('opponentScore').textContent = d.score;
                    }
                    if (d.connected && !gameActive) startGame();
                }
            });
            
            gameRef.child('ball').on('value', snap => {
                const d = snap.val();
                if (d && gameActive) {
                    ball.x = d.x * W;
                    ball.y = d.y * H;
                    ball.vx = d.vx || 0;
                    ball.vy = d.vy || 0;
                }
            });
        }
        
        function joinGame() {
            my.name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const code = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!code) { alert('Ingresa el código'); return; }
            
            isHost = false;
            myKey = 'opponent';
            gameCode = code;
            document.getElementById('yourName').textContent = my.name;
            
            gameRef = db.ref('games/' + code);
            
            gameRef.once('value', snap => {
                if (!snap.exists()) { alert('Partida no encontrada'); return; }
                
                gameRef.child('opponent').update({
                    name: my.name, x: 0.5, y: 0.25, score: 0, connected: true
                });
                
                // Escuchar TODO del host
                gameRef.child('host').on('value', snap => {
                    const d = snap.val();
                    if (d) {
                        if (d.name) {
                            opp.name = d.name;
                            document.getElementById('opponentName').textContent = d.name;
                        }
                        if (d.x !== undefined && d.x !== null) opp.x = d.x * W;
                        if (d.y !== undefined && d.y !== null) opp.y = d.y * H;
                        if (d.score !== undefined && d.score !== null) {
                            opp.score = d.score;
                            document.getElementById('opponentScore').textContent = d.score;
                        }
                    }
                });
                
                gameRef.child('ball').on('value', snap => {
                    const d = snap.val();
                    if (d && gameActive) {
                        ball.x = d.x * W;
                        ball.y = d.y * H;
                        ball.vx = d.vx || 0;
                        ball.vy = d.vy || 0;
                    }
                });
                
                gameRef.child('timeLeft').on('value', snap => {
                    const val = snap.val();
                    if (val !== null && val !== undefined) {
                        document.getElementById('timerText').textContent = val;
                        if (val <= 0) endGame();
                    }
                });
                
                gameRef.child('active').on('value', snap => {
                    if (snap.val() === true && !gameActive) startGame();
                });
            });
        }
        
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            
            ball.x = W / 2;
            ball.y = H / 2;
            
            if (isHost) {
                my.x = W / 2;
                my.y = H * 0.75;
                ball.vx = 6;
                ball.vy = 4;
                
                gameRef.update({ active: true, timeLeft: 60, ball: { x: 0.5, y: 0.5, vx: 6, vy: 4 } });
                
                const timer = setInterval(() => {
                    if (!gameActive) { clearInterval(timer); return; }
                    timeLeft--;
                    document.getElementById('timerText').textContent = timeLeft;
                    gameRef.child('timeLeft').set(timeLeft);
                    if (timeLeft <= 0) { clearInterval(timer); endGame(); }
                }, 1000);
                
                // Física
                setInterval(() => {
                    if (!gameActive) return;
                    
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    
                    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
                    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
                    
                    if (ball.y < BALL_R) {
                        my.score++;
                        document.getElementById('yourScore').textContent = my.score;
                        gameRef.child('host/score').set(my.score);
                        resetBall();
                    }
                    
                    if (ball.y > H - BALL_R) {
                        opp.score++;
                        document.getElementById('opponentScore').textContent = opp.score;
                        gameRef.child('opponent/score').set(opp.score);
                        resetBall();
                    }
                    
                    gameRef.child('ball').update({
                        x: ball.x / W,
                        y: ball.y / H,
                        vx: ball.vx,
                        vy: ball.vy
                    });
                }, 30);
            } else {
                my.x = W / 2;
                my.y = H * 0.25;
            }
            
            gameActive = true;
            gameLoop();
        }
        
        function resetBall() {
            ball.x = W / 2;
            ball.y = H / 2;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * 6;
            ball.vy = (Math.random() > 0.5 ? 1 : -1) * 4;
            gameRef.child('ball').set({ x: 0.5, y: 0.5, vx: ball.vx, vy: ball.vy });
        }
        
        function checkAutoKick() {
            const now = Date.now();
            if (now - lastKickTime < COOLDOWN) return;
            
            const dx = my.x - ball.x;
            const dy = my.y - ball.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < COLLISION_DIST) {
                lastKickTime = now;
                
                // Calcular ángulo de rebote
                const angle = Math.atan2(dy, dx);
                
                // Velocidad constante
                const speed = KICK_SPEED;
                ball.vx = Math.cos(angle) * speed;
                ball.vy = Math.sin(angle) * speed;
                
                // Forzar dirección hacia el oponente
                if (isHost) {
                    ball.vy = -Math.abs(ball.vy);
                } else {
                    ball.vy = Math.abs(ball.vy);
                }
                
                // Separar la pelota
                const overlap = COLLISION_DIST - dist + 20;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                
                // Enviar a Firebase
                gameRef.child('ball').set({
                    x: ball.x / W,
                    y: ball.y / H,
                    vx: ball.vx,
                    vy: ball.vy
                });
            }
        }
        
        function gameLoop() {
            if (!gameActive) return;
            
            // Enviar posición
            gameRef.child(myKey + '/x').set(my.x / W);
            gameRef.child(myKey + '/y').set(my.y / H);
            
            // Auto-patada al contacto
            checkAutoKick();
            
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, W, H);
            
            const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
            bgGrad.addColorStop(0, '#1a1a3e');
            bgGrad.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, H/2);
            ctx.lineTo(W, H/2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.beginPath();
            ctx.arc(W/2, H/2, 60, 0, Math.PI*2);
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(255,68,68,0.6)';
            ctx.fillRect(0, 0, W, GOAL_H);
            ctx.fillStyle = 'rgba(0,255,136,0.6)';
            ctx.fillRect(0, H-GOAL_H, W, GOAL_H);
            
            const ballGrad = ctx.createRadialGradient(ball.x-3, ball.y-3, 0, ball.x, ball.y, BALL_R);
            ballGrad.addColorStop(0, '#ffffff');
            ballGrad.addColorStop(1, '#ffd700');
            ctx.fillStyle = ballGrad;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(my.x, my.y, PLAYER_R, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(opp.x, opp.y, PLAYER_R, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            W = container.clientWidth;
            H = container.clientHeight;
            canvas.width = W;
            canvas.height = H;
        }
        
        function endGame() {
            gameActive = false;
            const winner = my.score > opp.score ? 'Tú' : opp.score > my.score ? 'Oponente' : 'Empate';
            document.getElementById('resultTitle').textContent = winner === 'Empate' ? '🤝 Empate' : winner === 'Tú' ? '🏆 ¡Victoria!' : '😢 Derrota';
            document.getElementById('resultDetails').innerHTML = `Tú: ${my.score} - Oponente: ${opp.score}`;
            document.getElementById('resultModal').classList.add('active');
            if (isHost) gameRef.remove();
        }
        
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function move(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;
                
                x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, x));
                
                if (isHost) {
                    y = Math.max(H/2 + PLAYER_R, Math.min(H - GOAL_H - PLAYER_R, y));
                } else {
                    y = Math.max(GOAL_H + PLAYER_R, Math.min(H/2 - PLAYER_R, y));
                }
                
                my.x = x;
                my.y = y;
            }
            
            // Mouse
            canvas.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            canvas.addEventListener('mousedown', e => move(e.clientX, e.clientY));
            
            // Touch - mover directamente
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                move(touch.clientX, touch.clientY);
            }, { passive: false });
            
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                move(touch.clientX, touch.clientY);
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            window.addEventListener('resize', () => {
                if (gameActive) resizeCanvas();
            });
        });
    </script>
</body>
</html>
