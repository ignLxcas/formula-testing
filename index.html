<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Ball Rush - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .ball-animation {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px;
        }

        .option-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            color: #0a0a1a;
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .input-group {
            margin: 10px 0;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin: 10px 0;
        }

        .code-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .status-text {
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .game-screen.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .player-info.opponent {
            justify-content: flex-end;
        }

        .player-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
        }

        .player-avatar.you { border-color: var(--success); }
        .player-avatar.opponent { border-color: var(--danger); }

        .player-name {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .player-score {
            font-size: 1.2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .timer-display {
            text-align: center;
            padding: 0 15px;
        }

        .timer-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
        }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px 20px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 90%;
            width: 350px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .game-title { font-size: 2rem; }
            .ball-animation { font-size: 3rem; }
            .code-text { font-size: 1.5rem; }
            .player-avatar { width: 30px; height: 30px; font-size: 1rem; }
            .timer-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="connection-screen" id="connectionScreen">
        <div class="ball-animation">⚽</div>
        <h1 class="game-title">Ball Rush</h1>
        <p class="game-subtitle">¡Empuja la pelota hacia la portería!</p>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <div class="input-group">
                    <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                </div>
                <button class="btn btn-primary" onclick="createGame()">
                    Crear Sala
                </button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <p style="color: var(--text-secondary); font-size: 0.8rem;">Código:</p>
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p class="status-text" id="waitingText">Esperando oponente...</p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <div class="input-group">
                    <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                </div>
                <div class="input-group">
                    <input type="text" id="gameCode" placeholder="Código" maxlength="6" 
                           oninput="this.value = this.value.toUpperCase()">
                </div>
                <button class="btn btn-secondary" onclick="joinGame()">
                    Unirse
                </button>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar you">😊</div>
                <div>
                    <div class="player-name" id="yourName">Tú</div>
                    <div class="player-score" id="yourScore">0</div>
                </div>
            </div>
            
            <div class="timer-display">
                <div class="timer-text" id="timerText">60</div>
            </div>
            
            <div class="player-info opponent">
                <div style="text-align: right;">
                    <div class="player-name" id="opponentName">Oponente</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
                <div class="player-avatar opponent">😎</div>
            </div>
        </div>
        
        <div class="game-canvas-container">
            <canvas class="game-canvas" id="canvas"></canvas>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="font-size: 1.8rem; margin-bottom: 15px;"></h2>
            <div id="resultDetails" style="margin-bottom: 20px;"></div>
            <button class="btn btn-primary" onclick="location.reload()">
                Jugar de Nuevo
            </button>
        </div>
    </div>

    <!-- Usamos un servidor PeerJS público confiable -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        // ============ CONFIGURACIÓN ============
        const GAME_DURATION = 60;
        const BALL_RADIUS = 15;
        const PLAYER_RADIUS = 25;
        const GOAL_HEIGHT = 40;
        const BALL_SPEED = 5;
        const MAX_SPEED = 15;
        const FRICTION = 0.98;
        const PUSH_FORCE = 8;

        let peer = null;
        let connection = null;
        let isHost = false;
        let gameStarted = false;
        let gameLoopId = null;
        let timerInterval = null;
        let canvas, ctx;
        let gameWidth, gameHeight;
        let myId = null;
        let opponentId = null;
        let connected = false;

        const players = {
            you: { x: 0, y: 0, score: 0, name: 'Tú' },
            opponent: { x: 0, y: 0, score: 0, name: 'Oponente' }
        };

        const ball = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0
        };

        let timeLeft = GAME_DURATION;
        let particles = [];

        // ============ CONEXIÓN MEJORADA ============
        function createGame() {
            const name = document.getElementById('playerName').value || 'Jugador 1';
            players.you.name = name;
            isHost = true;
            
            const gameCode = generateCode();
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            
            // Usar un ID simple y único
            myId = `ballrush-${gameCode}-host-${Date.now()}`;
            
            initializePeer(myId);
        }

        function joinGame() {
            const name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const gameCode = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!gameCode || gameCode.length !== 6) {
                showNotification('Error', 'Ingresa un código válido', 'error');
                return;
            }
            
            players.you.name = name;
            isHost = false;
            
            // Conectar al host
            myId = `ballrush-${gameCode}-player-${Date.now()}`;
            
            initializePeer(myId, gameCode);
        }

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function initializePeer(id, gameCode = null) {
            // Configurar PeerJS con servidor público
            peer = new Peer(id, {
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', (peerId) => {
                console.log('Peer conectado:', peerId);
                
                if (!isHost && gameCode) {
                    // Buscar al host
                    connectToHost(gameCode);
                } else if (isHost) {
                    document.getElementById('waitingText').textContent = 
                        'Esperando oponente... Comparte el código';
                }
            });
            
            peer.on('connection', (conn) => {
                console.log('Conexión entrante de:', conn.peer);
                connection = conn;
                setupConnection();
                
                if (isHost) {
                    opponentId = conn.peer;
                    showNotification('¡Conectado!', 'Oponente encontrado', 'success');
                    startGame();
                }
            });
            
            peer.on('error', (error) => {
                console.error('Error PeerJS:', error);
                
                if (error.type === 'peer-unavailable') {
                    showNotification('Error', 'No se encontró la partida', 'error');
                } else if (error.type === 'network') {
                    showNotification('Error', 'Problema de red', 'error');
                } else {
                    showNotification('Error', error.type, 'error');
                }
            });
        }

        function connectToHost(gameCode) {
            // Intentar diferentes IDs de host
            const attempts = [
                `ballrush-${gameCode}-host`,
                `ballrush-${gameCode}-host-${Date.now()}`,
                `ballrush-${gameCode}`
            ];
            
            let attemptIndex = 0;
            
            function tryConnect() {
                if (attemptIndex >= attempts.length) {
                    showNotification('Error', 'No se pudo conectar', 'error');
                    return;
                }
                
                const hostId = attempts[attemptIndex];
                console.log('Intentando conectar a:', hostId);
                
                const conn = peer.connect(hostId, { 
                    reliable: true,
                    metadata: { name: players.you.name }
                });
                
                conn.on('open', () => {
                    console.log('Conectado al host:', hostId);
                    connection = conn;
                    setupConnection();
                    opponentId = hostId;
                    showNotification('¡Conectado!', 'Unido a la partida', 'success');
                    startGame();
                });
                
                conn.on('error', (error) => {
                    console.log('Error conectando a', hostId, error);
                    attemptIndex++;
                    setTimeout(tryConnect, 2000);
                });
            }
            
            tryConnect();
        }

        function setupConnection() {
            connection.on('open', () => {
                connected = true;
                console.log('Canal de datos abierto');
            });
            
            connection.on('data', (data) => {
                handleData(data);
            });
            
            connection.on('close', () => {
                connected = false;
                showNotification('Desconectado', 'Oponente se fue', 'error');
                endGame(true);
            });
            
            connection.on('error', (error) => {
                console.error('Error en conexión:', error);
            });
        }

        function handleData(data) {
            if (!data || !data.type) return;
            
            switch(data.type) {
                case 'position':
                    players.opponent.x = data.x;
                    players.opponent.y = data.y;
                    break;
                    
                case 'ballUpdate':
                    ball.x = data.x;
                    ball.y = data.y;
                    ball.vx = data.vx;
                    ball.vy = data.vy;
                    break;
                    
                case 'score':
                    players.opponent.score = data.score;
                    updateUI();
                    break;
                    
                case 'goal':
                    showNotification('¡GOL!', data.scorer + ' anotó', 'info');
                    break;
                    
                case 'gameStart':
                    gameStarted = true;
                    break;
            }
        }

        function sendData(data) {
            if (connection && connection.open && connected) {
                try {
                    connection.send(data);
                } catch (error) {
                    console.error('Error enviando datos:', error);
                }
            }
        }

        // ============ FÍSICA DE LA PELOTA MEJORADA ============
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            
            // Posiciones iniciales
            players.you.x = gameWidth / 2;
            players.you.y = gameHeight - 80;
            players.opponent.x = gameWidth / 2;
            players.opponent.y = 80;
            
            resetBall();
            
            gameStarted = true;
            timeLeft = GAME_DURATION;
            updateUI();
            
            if (isHost) {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerText').textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        endGame(false);
                    }
                }, 1000);
            }
            
            sendData({ type: 'gameStart' });
            gameLoop();
        }

        function resetBall() {
            ball.x = gameWidth / 2;
            ball.y = gameHeight / 2;
            ball.vx = (Math.random() - 0.5) * 4;
            ball.vy = (Math.random() - 0.5) * 4;
        }

        function updateBall() {
            // Aplicar fricción
            ball.vx *= FRICTION;
            ball.vy *= FRICTION;
            
            // Limitar velocidad máxima
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            if (speed > MAX_SPEED) {
                ball.vx = (ball.vx / speed) * MAX_SPEED;
                ball.vy = (ball.vy / speed) * MAX_SPEED;
            }
            
            // Actualizar posición
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // Rebote en paredes laterales
            if (ball.x < BALL_RADIUS) {
                ball.x = BALL_RADIUS;
                ball.vx = Math.abs(ball.vx) * 0.8;
            }
            if (ball.x > gameWidth - BALL_RADIUS) {
                ball.x = gameWidth - BALL_RADIUS;
                ball.vx = -Math.abs(ball.vx) * 0.8;
            }
            
            // Goles
            if (ball.y - BALL_RADIUS < 0) {
                // Gol para el jugador local (abajo)
                if (isHost) {
                    players.you.score++;
                    updateUI();
                    sendData({ type: 'score', score: players.you.score });
                    sendData({ type: 'goal', scorer: players.you.name });
                }
                spawnParticles(ball.x, 30, '#00ff88');
                resetBall();
            }
            
            if (ball.y + BALL_RADIUS > gameHeight) {
                // Gol para el oponente (arriba)
                if (isHost) {
                    players.opponent.score++;
                    updateUI();
                    sendData({ type: 'score', score: players.opponent.score });
                    sendData({ type: 'goal', scorer: players.opponent.name });
                }
                spawnParticles(ball.x, gameHeight - 30, '#ff4444');
                resetBall();
            }
            
            // Enviar posición de la pelota
            if (isHost) {
                sendData({
                    type: 'ballUpdate',
                    x: ball.x,
                    y: ball.y,
                    vx: ball.vx,
                    vy: ball.vy
                });
            }
        }

        function checkBallCollision() {
            // Distancia entre jugador y pelota
            const dx = players.you.x - ball.x;
            const dy = players.you.y - ball.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < PLAYER_RADIUS + BALL_RADIUS) {
                // Calcular dirección del empuje
                const angle = Math.atan2(dy, dx);
                
                // Empujar la pelota
                ball.vx += Math.cos(angle) * PUSH_FORCE;
                ball.vy += Math.sin(angle) * PUSH_FORCE;
                
                // Separar la pelota del jugador
                const overlap = PLAYER_RADIUS + BALL_RADIUS - distance;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                
                // Partículas
                spawnParticles(ball.x, ball.y, '#ffd700');
                
                // Si no soy host, enviar actualización de pelota
                if (!isHost) {
                    sendData({
                        type: 'ballUpdate',
                        x: ball.x,
                        y: ball.y,
                        vx: ball.vx,
                        vy: ball.vy
                    });
                }
            }
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.vy += 0.2;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function gameLoop() {
            if (!gameStarted) return;
            
            // Enviar posición del jugador
            sendData({
                type: 'position',
                x: players.you.x,
                y: players.you.y
            });
            
            // Verificar colisión
            checkBallCollision();
            
            // Actualizar pelota (solo host)
            if (isHost) {
                updateBall();
            }
            
            updateParticles();
            render();
            
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function render() {
            ctx.clearRect(0, 0, gameWidth, gameHeight);
            
            // Fondo
            ctx.fillStyle = '#1a1a3e';
            ctx.fillRect(0, 0, gameWidth, gameHeight);
            
            // Línea central
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, gameHeight / 2);
            ctx.lineTo(gameWidth, gameHeight / 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Círculo central
            ctx.strokeStyle = '#2a2a4e';
            ctx.beginPath();
            ctx.arc(gameWidth / 2, gameHeight / 2, 60, 0, Math.PI * 2);
            ctx.stroke();
            
            // Porterías
            ctx.fillStyle = 'rgba(255, 68, 68, 0.5)';
            ctx.fillRect(0, 0, gameWidth, GOAL_HEIGHT);
            
            ctx.fillStyle = 'rgba(0, 255, 136, 0.5)';
            ctx.fillRect(0, gameHeight - GOAL_HEIGHT, gameWidth, GOAL_HEIGHT);
            
            // Partículas
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Pelota
            const gradient = ctx.createRadialGradient(
                ball.x - 5, ball.y - 5, 0,
                ball.x, ball.y, BALL_RADIUS
            );
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#ffd700');
            
            ctx.fillStyle = gradient;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Jugador local
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(players.you.x, players.you.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Oponente
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(players.opponent.x, players.opponent.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function updateUI() {
            document.getElementById('yourName').textContent = players.you.name;
            document.getElementById('opponentName').textContent = players.opponent.name;
            document.getElementById('yourScore').textContent = players.you.score;
            document.getElementById('opponentScore').textContent = players.opponent.score;
        }

        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            gameWidth = container.clientWidth;
            gameHeight = container.clientHeight;
            
            canvas.width = gameWidth;
            canvas.height = gameHeight;
            
            // Ajustar posiciones si es necesario
            if (ball.x === 0 && ball.y === 0) {
                resetBall();
            }
        }

        function endGame(disconnected = false) {
            gameStarted = false;
            
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (timerInterval) clearInterval(timerInterval);
            
            if (disconnected) {
                showResult('👋 Oponente desconectado', 'La partida ha terminado');
            } else {
                const winner = players.you.score > players.opponent.score ? 
                    players.you.name : 
                    players.opponent.score > players.you.score ? 
                    players.opponent.name : 'Empate';
                
                const title = winner === 'Empate' ? '🤝 ¡Empate!' : 
                    winner === players.you.name ? '🏆 ¡Victoria!' : '😢 ¡Derrota!';
                
                const details = `
                    ${players.you.name}: ${players.you.score} goles
                    <br>
                    ${players.opponent.name}: ${players.opponent.score} goles
                `;
                
                showResult(title, details);
            }
        }

        function showResult(title, details) {
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultDetails').innerHTML = details;
            document.getElementById('resultModal').classList.add('active');
        }

        function showNotification(title, message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.borderColor = type === 'error' ? '#ff4444' : 
                                          type === 'success' ? '#00ff88' : '#4488ff';
            notification.innerHTML = `
                <h3>${title}</h3>
                <p>${message}</p>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // ============ CONTROLES ============
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function updatePosition(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                players.you.x = clientX - rect.left;
                players.you.y = clientY - rect.top;
                
                // Mantener dentro de los límites
                players.you.x = Math.max(PLAYER_RADIUS, Math.min(gameWidth - PLAYER_RADIUS, players.you.x));
                players.you.y = Math.max(PLAYER_RADIUS, Math.min(gameHeight - PLAYER_RADIUS, players.you.y));
            }
            
            canvas.addEventListener('mousemove', (e) => {
                updatePosition(e.clientX, e.clientY);
            });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                updatePosition(touch.clientX, touch.clientY);
            }, { passive: false });
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                updatePosition(touch.clientX, touch.clientY);
            }, { passive: false });
        }

        // ============ INICIALIZACIÓN ============
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            
            window.addEventListener('resize', () => {
                if (gameStarted) {
                    resizeCanvas();
                }
            });
        });
    </script>
</body>
</html>
