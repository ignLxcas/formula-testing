<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Mundial de Penales - Leaderboard Global</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #1a1a3e;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --accent2: #f7c948;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .world-cup-banner {
            font-size: 2rem;
            margin: 10px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
            margin-top: 30px;
        }

        .option-card {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .option-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(45deg, #ff6b35, #f7c948); color: #0a0a1a; }
        .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 2px solid var(--border); }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-score {
            font-size: 2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .phase-indicator {
            font-size: 1.2rem;
            color: var(--accent2);
            font-weight: bold;
            text-align: center;
        }

        .penalty-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .goal-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            z-index: 1000;
            animation: goalCelebration 1.5s ease-out;
            pointer-events: none;
        }

        @keyframes goalCelebration {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        .leaderboard {
            margin: 20px 0;
            text-align: left;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: var(--bg-primary);
            border-radius: 8px;
        }

        .leaderboard-entry.top1 { background: rgba(255, 215, 0, 0.2); border: 1px solid var(--gold); }
        .leaderboard-entry.top2 { background: rgba(192, 192, 192, 0.2); border: 1px solid #c0c0c0; }
        .leaderboard-entry.top3 { background: rgba(205, 127, 50, 0.2); border: 1px solid #cd7f32; }
    </style>
</head>
<body>
    <div class="menu-screen" id="menuScreen">
        <h1 class="game-title">⚽ Mundial de Penales</h1>
        <div class="world-cup-banner">🏆🌍🏆</div>
        
        <div class="menu-options">
            <div class="option-card">
                <div class="option-title">🎮 Nuevo Juego</div>
                <input type="text" id="playerName" placeholder="Tu nombre" maxlength="20">
                <button class="btn btn-primary" onclick="startNewGame()">Jugar Mundial</button>
            </div>
            
            <div class="option-card">
                <div class="option-title">🏆 Leaderboard Global</div>
                <div id="leaderboardContainer">
                    <p style="text-align:center;color:var(--text-secondary);">Cargando...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <span style="font-size:1.5rem;">😊</span>
                <div id="playerDisplayName" style="font-size:0.8rem;">Jugador</div>
                <div class="player-score" id="playerScore">0</div>
            </div>
            <div style="text-align:center;">
                <div class="phase-indicator" id="phaseIndicator">FASE DE GRUPOS</div>
                <div class="penalty-counter" id="penaltyCounter">Penal 1 de 5</div>
            </div>
            <div class="player-info">
                <span style="font-size:1.5rem;">🧤</span>
                <div style="font-size:0.8rem;">Arquero IA</div>
                <div class="player-score" id="goalkeeperScore">0</div>
            </div>
        </div>
        <div class="game-canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="margin-bottom:15px;font-size:2rem;"></h2>
            <div id="resultDetails" style="margin-bottom:25px;font-size:1.2rem;"></div>
            <div id="statsDetails" style="margin-bottom:20px;font-size:1rem;color:var(--accent2);"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Constantes del juego
        const BALL_R = 15;
        const GOAL_H = 60;
        const KICK_SPEED = 15;
        const PENALTIES_PER_PHASE = 5;
        const TOTAL_PHASES = 5;
        const GOALKEEPER_SPEED = 3;
        
        // Variables de estado
        let canvas, ctx, W, H;
        let gameActive = false;
        let currentPhase = 1;
        let penaltyNumber = 0;
        let playerName = '';
        let playerGoals = 0;
        let playerShots = 0;
        let totalGoals = 0;
        let totalShots = 0;
        let phaseGoals = 0;
        let phaseShots = 0;
        
        // Objetos del juego
        const ball = { x: 0, y: 0, vx: 0, vy: 0, isActive: false };
        const goalkeeper = { x: 0, y: 0, targetX: 0, diving: false, diveDirection: 0 };
        const shooter = { x: 0, y: 0 };
        
        // Sistema de audio
        const AudioSystem = {
            context: null,
            init() {
                if (!this.context) {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playGoal() {
                this.init();
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, this.context.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.1 + 0.3);
                    osc.start(this.context.currentTime + i * 0.1);
                    osc.stop(this.context.currentTime + i * 0.1 + 0.3);
                });
            },
            playSave() {
                this.init();
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                osc.connect(gain);
                gain.connect(this.context.destination);
                osc.frequency.setValueAtTime(300, this.context.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.context.currentTime + 0.3);
                osc.type = 'square';
                gain.gain.setValueAtTime(0.3, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.3);
                osc.start();
                osc.stop(this.context.currentTime + 0.3);
            },
            playVictory() {
                this.init();
                const notes = [523, 523, 523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'triangle';
                    gain.gain.setValueAtTime(0.25, this.context.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.15 + 0.4);
                    osc.start(this.context.currentTime + i * 0.15);
                    osc.stop(this.context.currentTime + i * 0.15 + 0.4);
                });
            },
            playWhistle() {
                this.init();
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                osc.connect(gain);
                gain.connect(this.context.destination);
                osc.frequency.value = 2000;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.2, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.5);
                osc.start();
                osc.stop(this.context.currentTime + 0.5);
            }
        };
        
        // Cargar leaderboard global
        function loadLeaderboard() {
            const leaderboardRef = db.ref('leaderboard');
            leaderboardRef.orderByChild('score').limitToLast(10).on('value', snap => {
                const container = document.getElementById('leaderboardContainer');
                container.innerHTML = '';
                
                if (!snap.exists()) {
                    container.innerHTML = '<p style="text-align:center;color:var(--text-secondary);">No hay jugadores todavía</p>';
                    return;
                }
                
                const leaderboard = [];
                snap.forEach(child => {
                    leaderboard.push({
                        name: child.val().name,
                        score: child.val().score,
                        goals: child.val().goals,
                        shots: child.val().shots
                    });
                });
                
                leaderboard.reverse(); // Ordenar de mayor a menor
                
                leaderboard.forEach((entry, index) => {
                    const div = document.createElement('div');
                    div.className = 'leaderboard-entry';
                    if (index === 0) div.classList.add('top1');
                    if (index === 1) div.classList.add('top2');
                    if (index === 2) div.classList.add('top3');
                    
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    div.innerHTML = `
                        <span>${medal} ${entry.name}</span>
                        <span>${entry.score} pts (${entry.goals}/${entry.shots})</span>
                    `;
                    container.appendChild(div);
                });
            });
        }
        
        // Guardar estadísticas en el leaderboard
        function saveStats() {
            if (!playerName) return;
            
            const score = (totalGoals * 10) - ((totalShots - totalGoals) * 2);
            const playerRef = db.ref('leaderboard/' + playerName.replace(/[.#$\[\]]/g, '_'));
            
            playerRef.once('value', snap => {
                if (snap.exists()) {
                    // Actualizar estadísticas existentes
                    const data = snap.val();
                    playerRef.update({
                        score: data.score + score,
                        goals: data.goals + totalGoals,
                        shots: data.shots + totalShots,
                        gamesPlayed: (data.gamesPlayed || 0) + 1
                    });
                } else {
                    // Crear nueva entrada
                    playerRef.set({
                        name: playerName,
                        score: score,
                        goals: totalGoals,
                        shots: totalShots,
                        gamesPlayed: 1
                    });
                }
            });
        }
        
        function startNewGame() {
            playerName = document.getElementById('playerName').value || 'Jugador Anónimo';
            document.getElementById('playerDisplayName').textContent = playerName;
            
            // Resetear estadísticas
            playerGoals = 0;
            playerShots = 0;
            totalGoals = 0;
            totalShots = 0;
            phaseGoals = 0;
            phaseShots = 0;
            currentPhase = 1;
            penaltyNumber = 0;
            
            // Cambiar pantalla
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            // Inicializar canvas
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            
            // Posiciones iniciales
            shooter.x = W / 2;
            shooter.y = H * 0.75;
            goalkeeper.x = W / 2;
            goalkeeper.y = H * 0.1;
            resetBall();
            
            updatePhaseDisplay();
            gameActive = true;
            
            AudioSystem.playWhistle();
            gameLoop();
        }
        
        function updatePhaseDisplay() {
            const phases = ['FASE DE GRUPOS', 'OCTAVOS DE FINAL', 'CUARTOS DE FINAL', 'SEMIFINAL', 'FINAL'];
            document.getElementById('phaseIndicator').textContent = phases[currentPhase - 1] || 'FASE DE GRUPOS';
            document.getElementById('penaltyCounter').textContent = `Penal ${penaltyNumber + 1} de ${PENALTIES_PER_PHASE}`;
        }
        
        function resetBall() {
            ball.x = shooter.x;
            ball.y = shooter.y;
            ball.vx = 0;
            ball.vy = 0;
            ball.isActive = false;
            goalkeeper.diving = false;
            goalkeeper.targetX = W / 2 + (Math.random() - 0.5) * W * 0.4;
        }
        
        function shootPenalty(targetX, targetY) {
            if (!ball.isActive && gameActive) {
                ball.isActive = true;
                playerShots++;
                totalShots++;
                phaseShots++;
                
                // Calcular dirección del disparo
                const dx = targetX - ball.x;
                const dy = targetY - ball.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                ball.vx = (dx / dist) * KICK_SPEED;
                ball.vy = (dy / dist) * KICK_SPEED;
                
                // El arquero intenta adivinar la dirección
                const guess = Math.random();
                if (guess < 0.35) {
                    goalkeeper.targetX = W * 0.25;
                } else if (guess < 0.7) {
                    goalkeeper.targetX = W * 0.75;
                } else {
                    goalkeeper.targetX = W * 0.5;
                }
                
                goalkeeper.diving = true;
            }
        }
        
        function checkGoal() {
            if (!ball.isActive) return;
            
            // Verificar si la pelota entró al arco
            if (ball.y < GOAL_H && ball.vy < 0) {
                const dx = ball.x - goalkeeper.x;
                const dy = ball.y - goalkeeper.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 45) {
                    // ¡Atajada!
                    AudioSystem.playSave();
                    showAnimation('🧤');
                } else {
                    // ¡GOL!
                    AudioSystem.playGoal();
                    showAnimation('⚽');
                    
                    playerGoals++;
                    totalGoals++;
                    phaseGoals++;
                    document.getElementById('playerScore').textContent = playerGoals;
                }
                
                penaltyNumber++;
                if (penaltyNumber >= PENALTIES_PER_PHASE) {
                    nextPhase();
                } else {
                    updatePhaseDisplay();
                }
                
                setTimeout(() => resetBall(), 500);
            }
        }
        
        function nextPhase() {
            currentPhase++;
            penaltyNumber = 0;
            phaseGoals = 0;
            phaseShots = 0;
            
            if (currentPhase > TOTAL_PHASES) {
                endGame();
                return;
            }
            
            AudioSystem.playWhistle();
            updatePhaseDisplay();
            setTimeout(() => resetBall(), 1000);
        }
        
        function showAnimation(emoji) {
            const anim = document.createElement('div');
            anim.className = 'goal-animation';
            anim.textContent = emoji;
            document.body.appendChild(anim);
            setTimeout(() => anim.remove(), 1500);
        }
        
        function gameLoop() {
            if (!gameActive) return;
            
            // Actualizar física de la pelota
            if (ball.isActive) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                // Rebote en paredes laterales
                if (ball.x < BALL_R || ball.x > W - BALL_R) {
                    ball.vx = -ball.vx;
                }
                
                // Verificar gol o atajada
                checkGoal();
                
                // Si la pelota se va muy lejos, resetear
                if (ball.y < -100 || ball.y > H + 100) {
                    resetBall();
                }
            }
            
            // Mover arquero
            if (goalkeeper.diving) {
                const dx = goalkeeper.targetX - goalkeeper.x;
                if (Math.abs(dx) > 2) {
                    goalkeeper.x += dx * 0.08;
                } else {
                    goalkeeper.diving = false;
                }
            } else {
                // Movimiento aleatorio del arquero
                if (Math.random() < 0.02) {
                    goalkeeper.targetX = W * (0.2 + Math.random() * 0.6);
                }
                const dx = goalkeeper.targetX - goalkeeper.x;
                if (Math.abs(dx) > 1) {
                    goalkeeper.x += dx * 0.02;
                }
            }
            
            // Limitar arquero al área
            goalkeeper.x = Math.max(W * 0.2, Math.min(W * 0.8, goalkeeper.x));
            
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, W, H);
            
            // Fondo
            const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
            bgGrad.addColorStop(0, '#1a1a3e');
            bgGrad.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            // Campo
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, H/2);
            ctx.lineTo(W, H/2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Área penal
            ctx.strokeStyle = '#4a4a6e';
            ctx.strokeRect(W*0.1, 0, W*0.8, H*0.3);
            ctx.strokeRect(W*0.2, 0, W*0.6, H*0.15);
            
            // Arco
            ctx.fillStyle = 'rgba(255,68,68,0.8)';
            ctx.fillRect(W*0.2, 0, W*0.6, GOAL_H);
            
            // Arquero
            ctx.fillStyle = '#ffaa00';
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(goalkeeper.x, goalkeeper.y, 35, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Pelota
            if (ball.isActive || !ball.isActive) {
                const ballGrad = ctx.createRadialGradient(ball.x-3, ball.y-3, 0, ball.x, ball.y, BALL_R);
                ballGrad.addColorStop(0, '#ffffff');
                ballGrad.addColorStop(1, '#ffd700');
                ctx.fillStyle = ballGrad;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            // Jugador
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(shooter.x, shooter.y, 30, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            W = container.clientWidth;
            H = container.clientHeight;
            canvas.width = W;
            canvas.height = H;
            
            if (shooter.x === 0) {
                shooter.x = W / 2;
                shooter.y = H * 0.75;
                goalkeeper.x = W / 2;
                goalkeeper.y = H * 0.1;
                resetBall();
            }
        }
        
        function endGame() {
            gameActive = false;
            
            if (playerGoals >= 3) {
                AudioSystem.playVictory();
            }
            
            saveStats();
            
            const phases = ['Fase de Grupos', 'Octavos', 'Cuartos', 'Semifinal', 'Final'];
            document.getElementById('resultTitle').textContent = 
                playerGoals >= 3 ? '🏆 ¡Campeón!' : '😢 Eliminado';
            
            document.getElementById('resultDetails').innerHTML = 
                `Goles: ${playerGoals} | Tiros: ${playerShots} | Efectividad: ${playerShots > 0 ? Math.round((playerGoals/playerShots)*100) : 0}%`;
            
            document.getElementById('statsDetails').textContent = 
                `Completado hasta: ${phases[currentPhase - 2] || 'Fase de Grupos'}`;
            
            document.getElementById('resultModal').classList.add('active');
        }
        
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function move(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;
                
                x = Math.max(30, Math.min(W - 30, x));
                y = Math.max(H*0.6, Math.min(H - 30, y));
                
                shooter.x = x;
                shooter.y = y;
                
                if (!ball.isActive) {
                    ball.x = x;
                    ball.y = y;
                }
            }
            
            function shoot(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const targetX = clientX - rect.left;
                const targetY = clientY - rect.top;
                shootPenalty(targetX, targetY);
            }
            
            // Mouse
            canvas.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            canvas.addEventListener('click', e => shoot(e.clientX, e.clientY));
            
            // Touch
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const touch = e.touches[0];
                move(touch.clientX, touch.clientY);
            }, { passive: false });
            
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.touches[0];
                move(touch.clientX, touch.clientY);
            }, { passive: false });
            
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                if (e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    shoot(touch.clientX, touch.clientY);
                }
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            loadLeaderboard();
            
            window.addEventListener('resize', () => {
                if (gameActive) resizeCanvas();
            });
            
            // Inicializar sistema de audio al primer click
            document.addEventListener('click', () => AudioSystem.init(), { once: true });
        });
    </script>
</body>
</html>
