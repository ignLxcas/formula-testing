<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏆 Mundial de Penales 2026</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #1a1a3e;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --accent2: #f7c948;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
            --pitch-green: #0d5c2e;
            --pitch-dark: #0a4a24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }
        .screen.active { display: flex; }

        .menu-screen {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
        }

        .world-cup-banner {
            font-size: 3rem;
            margin: 10px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-top: 30px;
        }

        .option-card {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .option-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { 
            background: linear-gradient(45deg, #ff6b35, #f7c948); 
            color: #0a0a1a;
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
        }
        .btn-secondary { 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            border: 2px solid var(--border);
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border-bottom: 2px solid var(--border);
            z-index: 10;
            position: sticky;
            top: 0;
        }

        .team-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .team-flag {
            font-size: 2.5rem;
        }

        .team-name {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .team-score {
            font-size: 2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .match-info {
            text-align: center;
        }

        .match-indicator {
            font-size: 1.2rem;
            color: var(--accent2);
            font-weight: bold;
        }

        .penalty-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            background: linear-gradient(180deg, #0a4a24 0%, #0d5c2e 100%);
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .fixture-screen {
            padding: 20px;
            align-items: center;
        }

        .fixture-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }

        .fixture-round {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 20px;
        }

        .fixture-round-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent2);
            text-align: center;
            margin-bottom: 15px;
        }

        .fixture-match {
            background: var(--bg-primary);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .fixture-match.active {
            border: 2px solid var(--gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .fixture-match.played {
            opacity: 0.7;
        }

        .fixture-team {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
        }

        .fixture-team:last-child {
            justify-content: flex-end;
        }

        .fixture-score {
            font-weight: bold;
            color: var(--gold);
            margin: 0 10px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .goal-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            z-index: 1000;
            animation: goalCelebration 1.5s ease-out;
            pointer-events: none;
        }

        @keyframes goalCelebration {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        .target-zone {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px dashed var(--gold);
            border-radius: 50%;
            pointer-events: none;
            animation: zonePulse 0.8s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        @keyframes zonePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        .leaderboard {
            margin: 20px 0;
            text-align: left;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: var(--bg-primary);
            border-radius: 8px;
        }

        .leaderboard-entry.top1 { background: rgba(255, 215, 0, 0.2); border: 1px solid var(--gold); }
        .leaderboard-entry.top2 { background: rgba(192, 192, 192, 0.2); border: 1px solid #c0c0c0; }
        .leaderboard-entry.top3 { background: rgba(205, 127, 50, 0.2); border: 1px solid #cd7f32; }

        .country-select {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .country-option {
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            background: var(--bg-primary);
        }

        .country-option:hover {
            border-color: var(--gold);
            transform: scale(1.05);
        }

        .country-option.selected {
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- Pantalla de Menú -->
    <div class="screen menu-screen active" id="menuScreen">
        <h1 class="game-title">🏆 Mundial de Penales 2026</h1>

        // Fases del mundial
        const WORLD_CUP_PHASES = [
            { name: 'Dieciseisavos de Final', matches: 16 },

        // Objetos del juego
        const goalkeeper = { x: 0, y: 0, direction: 1, speed: GOALKEEPER_SPEED };
        let shotInProgress = false;
        
        // Sistema de audio
        const AudioSystem = {
            context: null,
            init() {
                if (!this.context) {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playGoal() {
                this.init();
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, this.context.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.1 + 0.3);
                    osc.start(this.context.currentTime + i * 0.1);
                    osc.stop(this.context.currentTime + i * 0.1 + 0.3);
                });
            },
            playSave() {
                this.init();
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                osc.connect(gain);
                gain.connect(this.context.destination);
                osc.frequency.setValueAtTime(300, this.context.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.context.currentTime + 0.3);
                osc.type = 'square';
                gain.gain.setValueAtTime(0.3, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.3);
                osc.start();
                osc.stop(this.context.currentTime + 0.3);
            },
            playVictory() {
                this.init();
                const notes = [523, 523, 523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'triangle';
                    gain.gain.setValueAtTime(0.25, this.context.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.15 + 0.4);
                    osc.start(this.context.currentTime + i * 0.15);
                    osc.stop(this.context.currentTime + i * 0.15 + 0.4);
                });
            },
            playWhistle() {
                this.init();
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                osc.connect(gain);
                gain.connect(this.context.destination);
                osc.frequency.value = 2000;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.2, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.5);
                osc.start();
                osc.stop(this.context.currentTime + 0.5);
            },
            playElimination() {
                this.init();
                const notes = [400, 300, 200, 100];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.2, this.context.currentTime + i * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.2 + 0.4);
                    osc.start(this.context.currentTime + i * 0.2);
                    osc.stop(this.context.currentTime + i * 0.2 + 0.4);
                });
            }
        };
        
        // Inicializar selección de países
        function initializeCountrySelect() {
            const container = document.getElementById('countrySelect');
            COUNTRIES.forEach(country => {
                const div = document.createElement('div');
                div.className = 'country-option';
                div.innerHTML = `${country.flag}<br><small>${country.name}</small>`;
                div.onclick = () => selectCountry(country, div);
                container.appendChild(div);
            });
        }
        
        function selectCountry(country, element) {
            playerCountry = country;
            document.querySelectorAll('.country-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }
        
        // Generar fixture
        function generateFixture() {
            fixtureData = [];
            const shuffledCountries = [...COUNTRIES].sort(() => Math.random() - 0.5);
            
            WORLD_CUP_PHASES.forEach((phase, phaseIndex) => {
                const matches = [];
                const teamsForPhase = phaseIndex === 0 ? shuffledCountries : [];
                
                for (let i = 0; i < phase.matches; i++) {
                    if (phaseIndex === 0) {
                        matches.push({
                            team1: teamsForPhase[i * 2],
                            team2: teamsForPhase[i * 2 + 1],
                            score1: null,
                            score2: null
                        });
                    } else {
                        matches.push({
                            team1: null,
                            team2: null,
                            score1: null,
                            score2: null
                        });
                    }
                }
                
                fixtureData.push({
                    phase: phase,
                    matches: matches
                });
            });
        }
        
        function showFixture() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('fixtureScreen').classList.add('active');
            renderFixture();
        }
        
        function showGameScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
        }
        
        function renderFixture() {
            const container = document.getElementById('fixtureContainer');
            container.innerHTML = '';
            
            fixtureData.forEach((round, roundIndex) => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'fixture-round';
                roundDiv.innerHTML = `<div class="fixture-round-title">${round.phase.name}</div>`;
                
                round.matches.forEach((match, matchIndex) => {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'fixture-match';
                    
                    if (roundIndex === currentPhaseIndex && matchIndex === penaltyNumber) {
                        matchDiv.classList.add('active');
                    }
                    
                    if (match.score1 !== null) {
                        matchDiv.classList.add('played');
                    }
                    
                    const team1Name = match.team1 ? match.team1.name : 'Por definir';
                    const team2Name = match.team2 ? match.team2.name : 'Por definir';
                    const team1Flag = match.team1 ? match.team1.flag : '❓';
                    const team2Flag = match.team2 ? match.team2.flag : '❓';
                    
                    matchDiv.innerHTML = `
                        <div class="fixture-team">
                            <span>${team1Flag}</span>
                            <span>${team1Name}</span>
                        </div>
                        <div class="fixture-score">
                            ${match.score1 !== null ? `${match.score1} - ${match.score2}` : 'vs'}
                        </div>
                        <div class="fixture-team">
                            <span>${team2Name}</span>
                            <span>${team2Flag}</span>
                        </div>
                    `;
                    
                    roundDiv.appendChild(matchDiv);
                });
                
                container.appendChild(roundDiv);
            });
        }
        
        // Cargar leaderboard
        function loadLeaderboard() {
            const leaderboardRef = db.ref('leaderboard');
            leaderboardRef.orderByChild('score').limitToLast(10).on('value', snap => {
                const container = document.getElementById('leaderboardContainer');
                container.innerHTML = '';
                
                if (!snap.exists()) {
                    container.innerHTML = '<p style="text-align:center;color:var(--text-secondary);">No hay jugadores todavía</p>';
                    return;
                }
                
                const leaderboard = [];
                snap.forEach(child => {
                    leaderboard.push({
                        name: child.val().name,
                        score: child.val().score,
                        goals: child.val().goals,
                        shots: child.val().shots,
                        phase: child.val().phase,
                        country: child.val().country
                    });
                });
                
                leaderboard.reverse();
                
                leaderboard.forEach((entry, index) => {
                    const div = document.createElement('div');
                    div.className = 'leaderboard-entry';
                    if (index === 0) div.classList.add('top1');
                    if (index === 1) div.classList.add('top2');
                    if (index === 2) div.classList.add('top3');
                    
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    const flag = entry.country ? entry.country.flag : '🏳️';
                    div.innerHTML = `
                        <span>${medal} ${flag} ${entry.name}</span>
                        <span>${entry.score} pts</span>
                    `;
                    container.appendChild(div);
                });
            });
        }
        
        // Guardar estadísticas
        function saveStats() {
            if (!playerName) return;
            
            const score = (totalGoals * 15) + (currentPhaseIndex * 50);
            const playerRef = db.ref('leaderboard/' + playerName.replace(/[.#$\[\]]/g, '_'));
            
            playerRef.once('value', snap => {
                if (snap.exists()) {
                    const data = snap.val();
                    playerRef.update({
                        score: data.score + score,
                        goals: data.goals + totalGoals,
                        shots: data.shots + totalShots,
                        gamesPlayed: (data.gamesPlayed || 0) + 1,
                        bestPhase: Math.max(data.bestPhase || 0, currentPhaseIndex),
                        country: playerCountry
                    });
                } else {
                    playerRef.set({
                        name: playerName,
                        score: score,
                        goals: totalGoals,
                        shots: totalShots,
                        gamesPlayed: 1,
                        bestPhase: currentPhaseIndex,
                        phase: WORLD_CUP_PHASES[currentPhaseIndex]?.name || 'Eliminado',
                        country: playerCountry
                    });
                }
            });
        }
        
        function startNewGame() {
            playerName = document.getElementById('playerName').value || 'Jugador Anónimo';
            
            if (!playerCountry) {
                alert('Por favor selecciona un país');
                return;
            }
            
            document.getElementById('playerDisplayName').textContent = playerCountry.name;
            document.getElementById('playerFlag').textContent = playerCountry.flag;
            
            // Resetear estadísticas
            playerGoals = 0;
            opponentGoals = 0;
            totalGoals = 0;
            totalShots = 0;
            currentPhaseIndex = 0;
            penaltyNumber = 0;
            shotInProgress = false;
            
            // Generar fixture
            generateFixture();
            
            // Cambiar pantalla
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            
            // Inicializar canvas
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            
            // Posición inicial del arquero
            goalkeeper.x = W / 2;
            goalkeeper.y = GOAL_H / 2;
            goalkeeper.direction = 1;
            goalkeeper.speed = GOALKEEPER_SPEED;
            
            updateMatchDisplay();
            selectRandomTargetZone();
            gameActive = true;
            
            AudioSystem.playWhistle();
            gameLoop();
        }
        
        function updateMatchDisplay() {
            const phase = WORLD_CUP_PHASES[currentPhaseIndex];
            document.getElementById('matchIndicator').textContent = phase.name;
            document.getElementById('penaltyCounter').textContent = `Penal ${penaltyNumber + 1} de ${PENALTIES_PER_MATCH}`;
            document.getElementById('playerScore').textContent = playerGoals;
            document.getElementById('opponentScore').textContent = opponentGoals;
            
            // Actualizar oponente
            if (fixtureData[currentPhaseIndex]) {
                const currentMatch = fixtureData[currentPhaseIndex].matches[0];
                if (currentMatch && currentMatch.team2) {
                    document.getElementById('opponentName').textContent = currentMatch.team2.name;
                    document.getElementById('opponentFlag').textContent = currentMatch.team2.flag;
                } else {
                    document.getElementById('opponentName').textContent = 'Arquero IA';
                    document.getElementById('opponentFlag').textContent = '🧤';
                }
            }
        }
        
        function selectRandomTargetZone() {
            const zone = TARGET_ZONES[Math.floor(Math.random() * TARGET_ZONES.length)];
            currentTargetZone = {
                x: W * zone.x,
                y: GOAL_H * zone.y,
                name: zone.name
            };
            
            showTargetZone();
        }
        
        function showTargetZone() {
            const oldZone = document.querySelector('.target-zone');
            if (oldZone) oldZone.remove();
            
            const container = document.getElementById('gameCanvasContainer');
            const zone = document.createElement('div');
            zone.className = 'target-zone';
            zone.style.left = currentTargetZone.x - 30 + 'px';
            zone.style.top = currentTargetZone.y - 30 + 'px';
            container.appendChild(zone);
        }
        
        function shootPenalty(targetX, targetY) {
            if (shotInProgress || !gameActive || !currentTargetZone) return;
            
            shotInProgress = true;
            totalShots++;
            
            const dx = targetX - currentTargetZone.x;
            const dy = targetY - currentTargetZone.y;
            const distToTarget = Math.sqrt(dx*dx + dy*dy);
            
            const goalieDx = targetX - goalkeeper.x;
            const goalieDy = targetY - goalkeeper.y;
            const distToGoalie = Math.sqrt(goalieDx*goalieDx + goalieDy*goalieDy);
            
            if (distToGoalie < GOALKEEPER_RADIUS + 15) {
                // ¡Atajada!
                setTimeout(() => {
                    AudioSystem.playSave();
                    showAnimation('🧤');
                    opponentGoals++;
                    document.getElementById('opponentScore').textContent = opponentGoals;
                    
                    penaltyNumber++;
                    if (penaltyNumber >= PENALTIES_PER_MATCH) {
                        evaluateMatchResult();
                    } else {
                        updateMatchDisplay();
                        selectRandomTargetZone();
                    }
                    
                    shotInProgress = false;
                }, 500);
            } else if (distToTarget < 50) {
                // ¡GOL perfecto!
                setTimeout(() => {
                    AudioSystem.playGoal();
                    showAnimation('⚽');
                    playerGoals++;
                    totalGoals++;
                    document.getElementById('playerScore').textContent = playerGoals;
                    
                    penaltyNumber++;
                    if (penaltyNumber >= PENALTIES_PER_MATCH) {
                        evaluateMatchResult();
                    } else {
                        updateMatchDisplay();
                        selectRandomTargetZone();
                    }
                    
                    shotInProgress = false;
                }, 500);
            } else {
                // Tiro desviado
                setTimeout(() => {
                    showAnimation('❌');
                    
                    penaltyNumber++;
                    if (penaltyNumber >= PENALTIES_PER_MATCH) {
                        evaluateMatchResult();
                    } else {
                        updateMatchDisplay();
                        selectRandomTargetZone();
                    }
                    
                    shotInProgress = false;
                }, 500);
            }
            
            const oldZone = document.querySelector('.target-zone');
            if (oldZone) oldZone.remove();
        }
        
        function evaluateMatchResult() {
            if (playerGoals > opponentGoals) {
                // Ganaste el partido
                if (fixtureData[currentPhaseIndex]) {
                    const match = fixtureData[currentPhaseIndex].matches[0];
                    match.score1 = playerGoals;
                    match.score2 = opponentGoals;
                    match.team1 = playerCountry;
                }
                
                currentPhaseIndex++;
                
                if (currentPhaseIndex >= WORLD_CUP_PHASES.length) {
                    endGame(true);
                } else {
                    playerGoals = 0;
                    opponentGoals = 0;
                    penaltyNumber = 0;
                    
                    goalkeeper.speed += 2;
                    
                    AudioSystem.playVictory();
                    showAnimation('🏆');
                    
                    setTimeout(() => {
                        updateMatchDisplay();
                        selectRandomTargetZone();
                    }, 1000);
                }
            } else {
                endGame(false);
            }
        }
        
        function endGame(won) {
            gameActive = false;
            
            if (won) {
                AudioSystem.playVictory();
                showAnimation('🏆👑');
            } else {
                AudioSystem.playElimination();
            }
            
            saveStats();
            
            const accuracy = totalShots > 0 ? Math.round((totalGoals / totalShots) * 100) : 0;
            
            if (won) {
                document.getElementById('resultTitle').textContent = '🏆 ¡CAMPEÓN DEL MUNDO!';
                document.getElementById('resultDetails').innerHTML = 
                    `${playerCountry.flag} ${playerCountry.name} ha ganado el mundial!<br>` +
                    `Goles: ${totalGoals} | Efectividad: ${accuracy}%`;
            } else {
                document.getElementById('resultTitle').textContent = '😢 ELIMINADO';
                document.getElementById('resultDetails').innerHTML = 
                    `${playerCountry.flag} ${playerCountry.name} eliminado en ${WORLD_CUP_PHASES[currentPhaseIndex].name}<br>` +
                    `Marcador: ${playerGoals} - ${opponentGoals}<br>` +
                    `Goles totales: ${totalGoals} | Efectividad: ${accuracy}%`;
            }
            
            document.getElementById('statsDetails').textContent = 
                `Puntuación: ${(totalGoals * 15) + (currentPhaseIndex * 50)} puntos`;
            
            document.getElementById('resultModal').classList.add('active');
        }
        
        function showAnimation(emoji) {
            const anim = document.createElement('div');
            anim.className = 'goal-animation';
            anim.textContent = emoji;
            document.body.appendChild(anim);
            setTimeout(() => anim.remove(), 1500);
        }
        
        function gameLoop() {
            if (!gameActive) return;
            
            // Mover arquero
            goalkeeper.x += goalkeeper.direction * goalkeeper.speed;
            
            // Rebotar en los límites del arco
            if (goalkeeper.x <= W * 0.2 + GOALKEEPER_RADIUS) {
                goalkeeper.x = W * 0.2 + GOALKEEPER_RADIUS;
                goalkeeper.direction = 1;
            } else if (goalkeeper.x >= W * 0.8 - GOALKEEPER_RADIUS) {
                goalkeeper.x = W * 0.8 - GOALKEEPER_RADIUS;
                goalkeeper.direction = -1;
            }
            
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, W, H);
            
            // Fondo del campo
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#0a4a24');
            bgGrad.addColorStop(1, '#0d5c2e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            // Líneas del campo
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, H/2);
            ctx.lineTo(W, H/2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Círculo central
            ctx.beginPath();
            ctx.arc(W/2, H/2, 50, 0, Math.PI*2);
            ctx.stroke();
            
            // Área penal
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.strokeRect(W*0.1, 0, W*0.8, H*0.35);
            ctx.strokeRect(W*0.2, 0, W*0.6, H*0.15);
            
            // Arco con mejor diseño
            const goalGrad = ctx.createLinearGradient(0, 0, 0, GOAL_H);
            goalGrad.addColorStop(0, '#f0f0f0');
            goalGrad.addColorStop(1, '#d0d0d0');
            ctx.fillStyle = goalGrad;
            ctx.fillRect(W*0.2, 0, W*0.6, GOAL_H);
            
            // Marco del arco
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(W*0.2, 0, W*0.6, GOAL_H);
            
            // Red del arco
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(W*0.2 + (W*0.6/9)*i, 0);
                ctx.lineTo(W*0.2 + (W*0.6/9)*i, GOAL_H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(W*0.2, (GOAL_H/9)*i);
                ctx.lineTo(W*0.8, (GOAL_H/9)*i);
                ctx.stroke();
            }
            
            // Arquero con mejor diseño
            const goalieGrad = ctx.createRadialGradient(
                goalkeeper.x - 10, goalkeeper.y - 10, 0,
                goalkeeper.x, goalkeeper.y, GOALKEEPER_RADIUS
            );
            goalieGrad.addColorStop(0, '#ffd700');
            goalieGrad.addColorStop(1, '#ff6b00');
            ctx.fillStyle = goalieGrad;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(goalkeeper.x, goalkeeper.y, GOALKEEPER_RADIUS, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Guantes del arquero
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(goalkeeper.x - 15, goalkeeper.y - 10, 8, 0, Math.PI*2);
            ctx.arc(goalkeeper.x + 15, goalkeeper.y - 10, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Texto de instrucción
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`🎯 Zona: ${currentTargetZone?.name || ''}`, W/2, H - 80);
            ctx.fillText('Haz click en la zona dorada para marcar', W/2, H - 50);
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            W = container.clientWidth;
            H = container.clientHeight;
            canvas.width = W;
            canvas.height = H;
            
            if (goalkeeper.x === 0) {
                goalkeeper.x = W / 2;
                goalkeeper.y = GOAL_H / 2;
            }
            
            if (currentTargetZone) {
                showTargetZone();
            }
        }
        
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function handleClick(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                
                if (y < GOAL_H && x > W * 0.2 && x < W * 0.8) {
                    shootPenalty(x, y);
                }
            }
            
            canvas.addEventListener('click', e => handleClick(e.clientX, e.clientY));
            
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                if (e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    handleClick(touch.clientX, touch.clientY);
                }
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            initializeCountrySelect();
            setupControls();
            loadLeaderboard();
            
            window.addEventListener('resize', () => {
                if (gameActive) resizeCanvas();
            });
            
            document.addEventListener('click', () => AudioSystem.init(), { once: true });
        });
    </script>
</body>
</html>
