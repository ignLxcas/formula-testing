<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Private Stories Viewer</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #1a1a2e;
            --accent: #e1306c;
            --accent2: #833ab4;
            --gold: #ffd700;
            --success: #00ff88;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a3e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .story-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .story-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(225, 48, 108, 0.3);
        }

        .story-card img, .story-card video {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        .story-info {
            padding: 15px;
            background: var(--bg-card);
        }

        .story-highlight {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .story-date {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .video-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .highlight-section {
            margin-bottom: 40px;
        }

        .highlight-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--gold);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Instagram Stories Viewer</h1>
            <p>Viendo historias destacadas de perfil privado</p>
        </div>

        <div id="status" class="loading">
            <div class="spinner"></div>
            <p>Cargando historias...</p>
        </div>

        <div id="content"></div>
    </div>

    <script>
        // Configuración con la cookie proporcionada
        const CONFIG = {
            SESSION_ID: '27046907152:H3ysC7PUY7zdWA:27:AYi4Afj-2B8e3bblmxK8Qnnbnl4g__e0IafwtRa2NBE',
            HIGHLIGHT_IDS: [
                '18299348608198590',
                '17952049419030602'
            ],
            HEADERS: {
                'Cookie': 'sessionid=27046907152:H3ysC7PUY7zdWA:27:AYi4Afj-2B8e3bblmxK8Qnnbnl4g__e0IafwtRa2NBE',
                'x-ig-app-id': '936619743392459',
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'Accept': '*/*',
                'Accept-Language': 'es-ES,es;q=0.9,en;q=0.8',
                'Referer': 'https://www.instagram.com/',
                'X-Requested-With': 'XMLHttpRequest',
                'x-csrftoken': 'AYi4Afj-2B8e3bblmxK8Qnnbnl4g__e0IafwtRa2NBE'
            }
        };

        // Función para obtener las historias de un highlight
        async function fetchHighlightStories(highlightId) {
            try {
                const response = await fetch(
                    `https://www.instagram.com/api/v1/feed/reels_media/?reel_ids=${highlightId}`,
                    {
                        method: 'GET',
                        headers: CONFIG.HEADERS,
                        credentials: 'include'
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                return data.reels?.[highlightId]?.items || [];
                
            } catch (error) {
                console.error(`Error fetching highlight ${highlightId}:`, error);
                return [];
            }
        }

        // Función para obtener información del highlight
        async function fetchHighlightInfo(highlightId) {
            try {
                const response = await fetch(
                    `https://www.instagram.com/api/v1/highlights/${highlightId}/reels/`,
                    {
                        method: 'GET',
                        headers: CONFIG.HEADERS,
                        credentials: 'include'
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                return {
                    title: data.title || `Highlight ${highlightId}`,
                    cover: data.cover_media?.cropped_image_version?.url || 
                           data.cover_media?.image_versions2?.candidates?.[0]?.url || ''
                };
                
            } catch (error) {
                console.error(`Error fetching info for ${highlightId}:`, error);
                return {
                    title: `Highlight ${highlightId}`,
                    cover: ''
                };
            }
        }

        // Función para procesar las historias
        function processStories(items) {
            return items.map(item => ({
                id: item.pk,
                takenAt: item.taken_at,
                isVideo: !!item.video_versions,
                imageUrl: item.image_versions2?.candidates?.[0]?.url || '',
                videoUrl: item.video_versions?.[0]?.url || '',
                mediaType: item.media_type,
                likeCount: item.like_count || 0,
                commentCount: item.comment_count || 0
            }));
        }

        // Función para formatear fecha
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Función principal para cargar todas las historias
        async function loadAllStories() {
            const statusElement = document.getElementById('status');
            const contentElement = document.getElementById('content');
            
            statusElement.innerHTML = `
                <div class="spinner"></div>
                <p>Cargando historias destacadas...</p>
            `;

            let allHighlights = [];
            let totalStories = 0;

            for (const highlightId of CONFIG.HIGHLIGHT_IDS) {
                try {
                    // Obtener información del highlight
                    const info = await fetchHighlightInfo(highlightId);
                    
                    // Obtener las historias
                    const stories = await fetchHighlightStories(highlightId);
                    const processedStories = processStories(stories);
                    
                    totalStories += processedStories.length;
                    
                    allHighlights.push({
                        id: highlightId,
                        title: info.title,
                        cover: info.cover,
                        stories: processedStories
                    });
                    
                    // Actualizar estado
                    statusElement.innerHTML = `
                        <div class="spinner"></div>
                        <p>Cargando... ${allHighlights.length}/${CONFIG.HIGHLIGHT_IDS.length} highlights</p>
                    `;
                    
                    // Esperar entre requests
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                } catch (error) {
                    console.error(`Error processing highlight ${highlightId}:`, error);
                }
            }

            // Mostrar resultados
            if (totalStories > 0) {
                statusElement.innerHTML = `
                    <div class="success">
                        ✅ Se encontraron ${totalStories} historias en ${allHighlights.length} highlights
                    </div>
                `;
                
                displayStories(allHighlights);
            } else {
                statusElement.innerHTML = `
                    <div class="error">
                        ❌ No se pudieron cargar las historias. Verifica que:
                        <br>• La sesión esté activa
                        <br>• Tengas acceso al perfil
                        <br>• Los IDs sean correctos
                    </div>
                `;
            }
        }

        // Función para mostrar las historias
        function displayStories(highlights) {
            const contentElement = document.getElementById('content');
            
            contentElement.innerHTML = highlights.map(highlight => {
                if (highlight.stories.length === 0) return '';
                
                return `
                    <div class="highlight-section">
                        <h2 class="highlight-title">
                            ${highlight.cover ? 
                                `<img src="${highlight.cover}" style="width: 40px; height: 40px; border-radius: 50%; vertical-align: middle; margin-right: 10px;">` : 
                                '📁 '}
                            ${highlight.title || 'Sin título'}
                            <span style="font-size: 0.9rem; color: var(--text-secondary); margin-left: 10px;">
                                (${highlight.stories.length} historias)
                            </span>
                        </h2>
                        
                        <div class="stories-grid">
                            ${highlight.stories.map(story => `
                                <div class="story-card">
                                    ${story.isVideo ? `
                                        <video controls autoplay muted loop>
                                            <source src="${story.videoUrl}" type="video/mp4">
                                            Tu navegador no soporta videos
                                        </video>
                                        <div class="video-badge">🎥 Video</div>
                                    ` : `
                                        <img src="${story.imageUrl}" alt="Historia" loading="lazy">
                                    `}
                                    
                                    <div class="story-info">
                                        <div class="story-highlight">📸 ${highlight.title}</div>
                                        <div class="story-date">📅 ${formatDate(story.takenAt)}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Función para descargar todas las historias
        function downloadAllStories() {
            const allStories = [];
            
            document.querySelectorAll('.story-card img, .story-card video source').forEach((element, index) => {
                const url = element.src || element.getAttribute('src');
                if (url) {
                    allStories.push({
                        url: url,
                        index: index + 1
                    });
                }
            });
            
            // Crear archivo JSON con las URLs
            const dataStr = JSON.stringify(allStories, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            
            const link = document.createElement('a');
            link.href = dataUri;
            link.download = 'instagram_stories.json';
            link.click();
            
            console.log('📥 URLs de historias guardadas:', allStories.length);
        }

        // Cargar historias al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadAllStories();
            
            // Agregar botón de descarga
            setTimeout(() => {
                const header = document.querySelector('.header');
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = '📥 Descargar URLs';
                downloadBtn.style.cssText = `
                    background: linear-gradient(45deg, #f09433, #e6683c);
                    color: white;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 25px;
                    cursor: pointer;
                    font-size: 1rem;
                    font-weight: bold;
                    margin-top: 15px;
                    transition: transform 0.2s;
                `;
                downloadBtn.onmouseover = () => downloadBtn.style.transform = 'scale(1.05)';
                downloadBtn.onmouseout = () => downloadBtn.style.transform = 'scale(1)';
                downloadBtn.onclick = downloadAllStories;
                header.appendChild(downloadBtn);
            }, 1000);
        });
    </script>
</body>
</html>
