<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Ball Rush - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --border: #2a2a4e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px;
        }

        .option-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(45deg, #ff6b35, #f7c948); color: #0a0a1a; }
        .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 2px solid var(--border); }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin: 10px 0;
        }

        .code-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-card);
        }

        .player-score { font-size: 2rem; color: var(--gold); font-weight: bold; }
        .timer-text { font-size: 1.5rem; font-weight: bold; color: var(--gold); }

        .game-canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="connection-screen" id="connectionScreen">
        <h1 class="game-title">⚽ Ball Rush</h1>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                <button class="btn btn-primary" onclick="createGame()">Crear Sala</button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="text-align:center;">Esperando oponente...</p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                <input type="text" id="gameCode" placeholder="Código" maxlength="6" oninput="this.value=this.value.toUpperCase()">
                <button class="btn btn-secondary" onclick="joinGame()">Unirse</button>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.5rem;">😊</span>
                <div>
                    <div id="yourName" style="font-size:0.8rem;">Tú</div>
                    <div class="player-score" id="yourScore">0</div>
                </div>
            </div>
            <div class="timer-text" id="timerText">60</div>
            <div style="display:flex;align-items:center;gap:10px;text-align:right;">
                <div>
                    <div id="opponentName" style="font-size:0.8rem;">Oponente</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
                <span style="font-size:1.5rem;">😎</span>
            </div>
        </div>
        <div class="game-canvas-container"><canvas id="canvas"></canvas></div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="margin-bottom:15px;"></h2>
            <div id="resultDetails" style="margin-bottom:20px;"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const BALL_R = 12;
        const PLAYER_R = 25;
        const GOAL_H = 40;
        const COLLISION_DIST = BALL_R + PLAYER_R; // Distancia exacta de colisión
        
        let canvas, ctx, W, H;
        let gameRef, gameCode, myKey, isHost;
        let gameActive = false;
        
        const my = { x: 0, y: 0, score: 0, name: '' };
        const opp = { x: 0, y: 0, score: 0, name: '' };
        const ball = { x: 0, y: 0, vx: 0, vy: 0 };
        
        function createGame() {
            my.name = document.getElementById('playerName').value || 'Jugador 1';
            isHost = true;
            myKey = 'host';
            gameCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            document.getElementById('yourName').textContent = my.name;
            
            gameRef = db.ref('games/' + gameCode);
            gameRef.set({
                host: { name: my.name, x: 0.5, y: 0.75, score: 0 },
                opponent: { name: '', x: 0.5, y: 0.25, score: 0, connected: false },
                ball: { x: 0.5, y: 0.5, vx: 5, vy: 3 },
                active: true
            });
            
            // Escuchar oponente - SCORE ESPECÍFICO
            gameRef.child('opponent/score').on('value', snap => {
                const val = snap.val();
                if (val !== null && val !== undefined) {
                    opp.score = val;
                    document.getElementById('opponentScore').textContent = val;
                }
            });
            
            gameRef.child('opponent/name').on('value', snap => {
                const val = snap.val();
                if (val) {
                    opp.name = val;
                    document.getElementById('opponentName').textContent = val;
                }
            });
            
            gameRef.child('opponent/x').on('value', snap => {
                const val = snap.val();
                if (val !== null) opp.x = val * W;
            });
            
            gameRef.child('opponent/y').on('value', snap => {
                const val = snap.val();
                if (val !== null) opp.y = val * H;
            });
            
            gameRef.child('opponent/connected').on('value', snap => {
                if (snap.val() === true && !gameActive) startGame();
            });
            
            // Escuchar pelota
            gameRef.child('ball').on('value', snap => {
                const d = snap.val();
                if (d && gameActive) {
                    ball.x = d.x * W;
                    ball.y = d.y * H;
                    ball.vx = d.vx;
                    ball.vy = d.vy;
                }
            });
        }
        
        function joinGame() {
            my.name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const code = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!code) { alert('Ingresa el código'); return; }
            
            isHost = false;
            myKey = 'opponent';
            gameCode = code;
            document.getElementById('yourName').textContent = my.name;
            
            gameRef = db.ref('games/' + code);
            
            gameRef.once('value', snap => {
                if (!snap.exists()) { alert('Partida no encontrada'); return; }
                
                gameRef.child('opponent').update({
                    name: my.name, x: 0.5, y: 0.25, score: 0, connected: true
                });
                
                // Escuchar score del HOST
                gameRef.child('host/score').on('value', snap => {
                    const val = snap.val();
                    if (val !== null && val !== undefined) {
                        opp.score = val;
                        document.getElementById('opponentScore').textContent = val;
                    }
                });
                
                gameRef.child('host/name').on('value', snap => {
                    const val = snap.val();
                    if (val) {
                        opp.name = val;
                        document.getElementById('opponentName').textContent = val;
                    }
                });
                
                gameRef.child('host/x').on('value', snap => {
                    const val = snap.val();
                    if (val !== null) opp.x = val * W;
                });
                
                gameRef.child('host/y').on('value', snap => {
                    const val = snap.val();
                    if (val !== null) opp.y = val * H;
                });
                
                // Escuchar pelota
                gameRef.child('ball').on('value', snap => {
                    const d = snap.val();
                    if (d && gameActive) {
                        ball.x = d.x * W;
                        ball.y = d.y * H;
                        ball.vx = d.vx;
                        ball.vy = d.vy;
                    }
                });
                
                // Escuchar inicio
                gameRef.child('active').on('value', snap => {
                    if (snap.val() === true && !gameActive) startGame();
                });
            });
        }
        
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            
            ball.x = W / 2;
            ball.y = H / 2;
            
            if (isHost) {
                my.x = W / 2;
                my.y = H * 0.75;
                opp.x = W / 2;
                opp.y = H * 0.25;
                
                ball.vx = 7;
                ball.vy = 5;
                
                gameRef.update({ active: true, ball: { x: 0.5, y: 0.5, vx: 7, vy: 5 } });
                
                let time = 60;
                const timer = setInterval(() => {
                    if (!gameActive) { clearInterval(timer); return; }
                    time--;
                    document.getElementById('timerText').textContent = time;
                    if (time <= 0) { clearInterval(timer); endGame(); }
                }, 1000);
                
                // Física de la pelota
                setInterval(() => {
                    if (!gameActive) return;
                    
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    
                    // Rebote en paredes
                    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
                    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
                    
                    // Gol para host (arriba)
                    if (ball.y < BALL_R) {
                        my.score++;
                        document.getElementById('yourScore').textContent = my.score;
                        gameRef.child('host/score').set(my.score);
                        resetBall();
                    }
                    
                    // Gol para oponente (abajo)
                    if (ball.y > H - BALL_R) {
                        opp.score++;
                        document.getElementById('opponentScore').textContent = opp.score;
                        gameRef.child('opponent/score').set(opp.score);
                        resetBall();
                    }
                    
                    // Enviar pelota
                    gameRef.child('ball').update({
                        x: ball.x / W,
                        y: ball.y / H,
                        vx: ball.vx,
                        vy: ball.vy
                    });
                }, 30);
            } else {
                my.x = W / 2;
                my.y = H * 0.25;
                opp.x = W / 2;
                opp.y = H * 0.75;
            }
            
            gameActive = true;
            gameLoop();
        }
        
        function resetBall() {
            ball.x = W / 2;
            ball.y = H / 2;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * 7;
            ball.vy = (Math.random() > 0.5 ? 1 : -1) * 5;
            gameRef.child('ball').set({
                x: 0.5, y: 0.5,
                vx: ball.vx, vy: ball.vy
            });
        }
        
        function checkCollision() {
            // Verificar colisión SOLO con mi jugador
            const dx = my.x - ball.x;
            const dy = my.y - ball.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < COLLISION_DIST) {
                // Calcular ángulo de rebote
                const angle = Math.atan2(dy, dx);
                
                // Velocidad constante tipo tenis
                const speed = 10;
                ball.vx = Math.cos(angle) * speed;
                ball.vy = Math.sin(angle) * speed;
                
                // Separar la pelota FUERA del jugador
                const overlap = COLLISION_DIST - dist + 10;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                
                // Enviar inmediatamente
                gameRef.child('ball').set({
                    x: ball.x / W,
                    y: ball.y / H,
                    vx: ball.vx,
                    vy: ball.vy
                });
            }
            
            // Verificar colisión con oponente (solo host)
            if (isHost) {
                const dx2 = opp.x - ball.x;
                const dy2 = opp.y - ball.y;
                const dist2 = Math.sqrt(dx2*dx2 + dy2*dy2);
                
                if (dist2 < COLLISION_DIST) {
                    const angle = Math.atan2(dy2, dx2);
                    const speed = 10;
                    ball.vx = Math.cos(angle) * speed;
                    ball.vy = Math.sin(angle) * speed;
                    
                    const overlap = COLLISION_DIST - dist2 + 10;
                    ball.x += Math.cos(angle) * overlap;
                    ball.y += Math.sin(angle) * overlap;
                    
                    gameRef.child('ball').set({
                        x: ball.x / W,
                        y: ball.y / H,
                        vx: ball.vx,
                        vy: ball.vy
                    });
                }
            }
        }
        
        function gameLoop() {
            if (!gameActive) return;
            
            // Enviar mi posición
            gameRef.child(myKey + '/x').set(my.x / W);
            gameRef.child(myKey + '/y').set(my.y / H);
            
            checkCollision();
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#1a1a3e';
            ctx.fillRect(0, 0, W, H);
            
            // Línea central
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, H/2);
            ctx.lineTo(W, H/2);
            ctx.stroke();
            
            // Porterías
            ctx.fillStyle = 'rgba(255,68,68,0.5)';
            ctx.fillRect(0, 0, W, GOAL_H);
            ctx.fillStyle = 'rgba(0,255,136,0.5)';
            ctx.fillRect(0, H-GOAL_H, W, GOAL_H);
            
            // Pelota
            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Mi jugador
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(my.x, my.y, PLAYER_R, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Oponente
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(opp.x, opp.y, PLAYER_R, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            W = container.clientWidth;
            H = container.clientHeight;
            canvas.width = W;
            canvas.height = H;
        }
        
        function endGame() {
            gameActive = false;
            const winner = my.score > opp.score ? 'Tú' : opp.score > my.score ? 'Oponente' : 'Empate';
            document.getElementById('resultTitle').textContent = winner === 'Empate' ? '🤝 Empate' : winner === 'Tú' ? '🏆 ¡Victoria!' : '😢 Derrota';
            document.getElementById('resultDetails').innerHTML = `Tú: ${my.score} - Oponente: ${opp.score}`;
            document.getElementById('resultModal').classList.add('active');
            if (isHost) gameRef.remove();
        }
        
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function move(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;
                
                x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, x));
                
                if (isHost) {
                    y = Math.max(H/2 + PLAYER_R, Math.min(H - GOAL_H - PLAYER_R, y));
                } else {
                    y = Math.max(GOAL_H + PLAYER_R, Math.min(H/2 - PLAYER_R, y));
                }
                
                my.x = x;
                my.y = y;
            }
            
            canvas.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            canvas.addEventListener('mousedown', e => move(e.clientX, e.clientY));
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                move(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                move(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            window.addEventListener('resize', () => {
                if (gameActive) resizeCanvas();
            });
        });
    </script>
</body>
</html>
