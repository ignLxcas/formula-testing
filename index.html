<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Mundial de Penales - Eliminatorias</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #1a1a3e;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --accent2: #f7c948;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .world-cup-banner {
            font-size: 2rem;
            margin: 10px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
            margin-top: 30px;
        }

        .option-card {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .option-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(45deg, #ff6b35, #f7c948); color: #0a0a1a; }
        .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 2px solid var(--border); }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-score {
            font-size: 2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .match-info {
            text-align: center;
        }

        .match-indicator {
            font-size: 1.2rem;
            color: var(--accent2);
            font-weight: bold;
        }

        .penalty-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .goal-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            z-index: 1000;
            animation: goalCelebration 1.5s ease-out;
            pointer-events: none;
        }

        @keyframes goalCelebration {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        .leaderboard {
            margin: 20px 0;
            text-align: left;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: var(--bg-primary);
            border-radius: 8px;
        }

        .leaderboard-entry.top1 { background: rgba(255, 215, 0, 0.2); border: 1px solid var(--gold); }
        .leaderboard-entry.top2 { background: rgba(192, 192, 192, 0.2); border: 1px solid #c0c0c0; }
        .leaderboard-entry.top3 { background: rgba(205, 127, 50, 0.2); border: 1px solid #cd7f32; }

        .target-zone {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px dashed var(--gold);
            border-radius: 50%;
            pointer-events: none;
            animation: zonePulse 1s ease-in-out infinite;
        }

        @keyframes zonePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .elimination-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            z-index: 1500;
            animation: eliminationAnimation 2s ease-out;
            pointer-events: none;
        }

        @keyframes eliminationAnimation {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            25% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }
    </style>
</head>
<body>
    <div class="menu-screen" id="menuScreen">
        <h1 class="game-title">⚽ Mundial de Penales</h1>
        <div class="world-cup-banner">🏆🌍🏆</div>
        
        <div class="menu-options">
            <div class="option-card">
                <div class="option-title">🎮 Nuevo Mundial</div>
                <input type="text" id="playerName" placeholder="Tu nombre" maxlength="20">
                <button class="btn btn-primary" onclick="startNewGame()">Comenzar Mundial</button>
            </div>
            
            <div class="option-card">
                <div class="option-title">🏆 Leaderboard Global</div>
                <div id="leaderboardContainer">
                    <p style="text-align:center;color:var(--text-secondary);">Cargando...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <span style="font-size:1.5rem;">😊</span>
                <div id="playerDisplayName" style="font-size:0.8rem;">Jugador</div>
                <div class="player-score" id="playerScore">0</div>
            </div>
            <div class="match-info">
                <div class="match-indicator" id="matchIndicator">Octavos de Final</div>
                <div class="penalty-counter" id="penaltyCounter">Tanda de penales</div>
            </div>
            <div class="player-info">
                <span style="font-size:1.5rem;">🧤</span>
                <div style="font-size:0.8rem;">Arquero IA</div>
                <div class="player-score" id="opponentScore">0</div>
            </div>
        </div>
        <div class="game-canvas-container" id="gameCanvasContainer">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="margin-bottom:15px;font-size:2rem;"></h2>
            <div id="resultDetails" style="margin-bottom:25px;font-size:1.2rem;"></div>
            <div id="statsDetails" style="margin-bottom:20px;font-size:1rem;color:var(--accent2);"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Constantes del juego
        const GOAL_H = 200;
        const GOALKEEPER_RADIUS = 30;
        const GOALKEEPER_SPEED = 8;
        const PENALTIES_PER_MATCH = 5;
        
        // Zonas de tiro específicas
        const TARGET_ZONES = [
            { x: 0.2, y: 0.25, name: 'Esquina superior izquierda' },
            { x: 0.8, y: 0.25, name: 'Esquina superior derecha' },
            { x: 0.2, y: 0.75, name: 'Esquina inferior izquierda' },
            { x: 0.8, y: 0.75, name: 'Esquina inferior derecha' },
            { x: 0.5, y: 0.5, name: 'Centro del arco' }
        ];
        
        // Fases del mundial
        const WORLD_CUP_PHASES = [
            { name: 'Octavos de Final', matches: 1 },
            { name: 'Cuartos de Final', matches: 1 },
            { name: 'Semifinal', matches: 1 },
            { name: 'Final', matches: 1 },
            { name: 'Campeón', matches: 0 }
        ];
        
        // Variables de estado
        let canvas, ctx, W, H;
        let gameActive = false;
        let currentPhaseIndex = 0;
        let penaltyNumber = 0;
        let playerName = '';
        let playerGoals = 0;
        let opponentGoals = 0;
        let totalGoals = 0;
        let totalShots = 0;
        let currentTargetZone = null;
        
        // Objetos del juego
        const goalkeeper = { x: 0, y: 0, direction: 1, speed: GOALKEEPER_SPEED };
        let shotInProgress = false;
        
        // Sistema de audio
        const AudioSystem = {
            context: null,
            init() {
                if (!this.context) {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playGoal() {
                this.init();
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, this.context.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.1 + 0.3);
                    osc.start(this.context.currentTime + i * 0.1);
                    osc.stop(this.context.currentTime + i * 0.1 + 0.3);
                });
            },
            playSave() {
                this.init();
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                osc.connect(gain);
                gain.connect(this.context.destination);
                osc.frequency.setValueAtTime(300, this.context.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.context.currentTime + 0.3);
                osc.type = 'square';
                gain.gain.setValueAtTime(0.3, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.3);
                osc.start();
                osc.stop(this.context.currentTime + 0.3);
            },
            playVictory() {
                this.init();
                const notes = [523, 523, 523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'triangle';
                    gain.gain.setValueAtTime(0.25, this.context.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.15 + 0.4);
                    osc.start(this.context.currentTime + i * 0.15);
                    osc.stop(this.context.currentTime + i * 0.15 + 0.4);
                });
            },
            playWhistle() {
                this.init();
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                osc.connect(gain);
                gain.connect(this.context.destination);
                osc.frequency.value = 2000;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.2, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.5);
                osc.start();
                osc.stop(this.context.currentTime + 0.5);
            },
            playElimination() {
                this.init();
                const notes = [400, 300, 200, 100];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.2, this.context.currentTime + i * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.2 + 0.4);
                    osc.start(this.context.currentTime + i * 0.2);
                    osc.stop(this.context.currentTime + i * 0.2 + 0.4);
                });
            }
        };
        
        // Cargar leaderboard global
        function loadLeaderboard() {
            const leaderboardRef = db.ref('leaderboard');
            leaderboardRef.orderByChild('score').limitToLast(10).on('value', snap => {
                const container = document.getElementById('leaderboardContainer');
                container.innerHTML = '';
                
                if (!snap.exists()) {
                    container.innerHTML = '<p style="text-align:center;color:var(--text-secondary);">No hay jugadores todavía</p>';
                    return;
                }
                
                const leaderboard = [];
                snap.forEach(child => {
                    leaderboard.push({
                        name: child.val().name,
                        score: child.val().score,
                        goals: child.val().goals,
                        shots: child.val().shots,
                        phase: child.val().phase
                    });
                });
                
                leaderboard.reverse();
                
                leaderboard.forEach((entry, index) => {
                    const div = document.createElement('div');
                    div.className = 'leaderboard-entry';
                    if (index === 0) div.classList.add('top1');
                    if (index === 1) div.classList.add('top2');
                    if (index === 2) div.classList.add('top3');
                    
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    const accuracy = entry.shots > 0 ? Math.round((entry.goals / entry.shots) * 100) : 0;
                    div.innerHTML = `
                        <span>${medal} ${entry.name}</span>
                        <span>${entry.score} pts (${entry.phase})</span>
                    `;
                    container.appendChild(div);
                });
            });
        }
        
        // Guardar estadísticas en el leaderboard
        function saveStats() {
            if (!playerName) return;
            
            const score = (totalGoals * 15) + (currentPhaseIndex * 50);
            const playerRef = db.ref('leaderboard/' + playerName.replace(/[.#$\[\]]/g, '_'));
            
            playerRef.once('value', snap => {
                if (snap.exists()) {
                    const data = snap.val();
                    playerRef.update({
                        score: data.score + score,
                        goals: data.goals + totalGoals,
                        shots: data.shots + totalShots,
                        gamesPlayed: (data.gamesPlayed || 0) + 1,
                        bestPhase: Math.max(data.bestPhase || 0, currentPhaseIndex)
                    });
                } else {
                    playerRef.set({
                        name: playerName,
                        score: score,
                        goals: totalGoals,
                        shots: totalShots,
                        gamesPlayed: 1,
                        bestPhase: currentPhaseIndex,
                        phase: WORLD_CUP_PHASES[currentPhaseIndex]?.name || 'Eliminado'
                    });
                }
            });
        }
        
        function startNewGame() {
            playerName = document.getElementById('playerName').value || 'Jugador Anónimo';
            document.getElementById('playerDisplayName').textContent = playerName;
            
            // Resetear estadísticas
            playerGoals = 0;
            opponentGoals = 0;
            totalGoals = 0;
            totalShots = 0;
            currentPhaseIndex = 0;
            penaltyNumber = 0;
            shotInProgress = false;
            
            // Cambiar pantalla
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            // Inicializar canvas
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            
            // Posición inicial del arquero
            goalkeeper.x = W / 2;
            goalkeeper.y = GOAL_H / 2;
            goalkeeper.direction = 1;
            goalkeeper.speed = GOALKEEPER_SPEED;
            
            updateMatchDisplay();
            selectRandomTargetZone();
            gameActive = true;
            
            AudioSystem.playWhistle();
            gameLoop();
        }
        
        function updateMatchDisplay() {
            const phase = WORLD_CUP_PHASES[currentPhaseIndex];
            document.getElementById('matchIndicator').textContent = phase.name;
            document.getElementById('penaltyCounter').textContent = `Penal ${penaltyNumber + 1} de ${PENALTIES_PER_MATCH}`;
            document.getElementById('playerScore').textContent = playerGoals;
            document.getElementById('opponentScore').textContent = opponentGoals;
        }
        
        function selectRandomTargetZone() {
            const zone = TARGET_ZONES[Math.floor(Math.random() * TARGET_ZONES.length)];
            currentTargetZone = {
                x: W * zone.x,
                y: GOAL_H * zone.y,
                name: zone.name
            };
            
            // Mostrar la zona objetivo
            showTargetZone();
        }
        
        function showTargetZone() {
            // Remover zona anterior
            const oldZone = document.querySelector('.target-zone');
            if (oldZone) oldZone.remove();
            
            // Crear nueva zona
            const container = document.getElementById('gameCanvasContainer');
            const zone = document.createElement('div');
            zone.className = 'target-zone';
            zone.style.left = currentTargetZone.x - 30 + 'px';
            zone.style.top = currentTargetZone.y - 30 + 'px';
            container.appendChild(zone);
        }
        
        function shootPenalty(targetX, targetY) {
            if (shotInProgress || !gameActive || !currentTargetZone) return;
            
            shotInProgress = true;
            totalShots++;
            
            // Verificar si el tiro está cerca de la zona objetivo
            const dx = targetX - currentTargetZone.x;
            const dy = targetY - currentTargetZone.y;
            const distToTarget = Math.sqrt(dx*dx + dy*dy);
            
            // Verificar si el arquero está cerca del punto de tiro
            const goalieDx = targetX - goalkeeper.x;
            const goalieDy = targetY - goalkeeper.y;
            const distToGoalie = Math.sqrt(goalieDx*goalieDx + goalieDy*goalieDy);
            
            if (distToGoalie < GOALKEEPER_RADIUS + 15) {
                // ¡Atajada!
                setTimeout(() => {
                    AudioSystem.playSave();
                    showAnimation('🧤');
                    opponentGoals++;
                    document.getElementById('opponentScore').textContent = opponentGoals;
                    
                    penaltyNumber++;
                    if (penaltyNumber >= PENALTIES_PER_MATCH) {
                        evaluateMatchResult();
                    } else {
                        updateMatchDisplay();
                        selectRandomTargetZone();
                    }
                    
                    shotInProgress = false;
                }, 500);
            } else if (distToTarget < 50) {
                // ¡GOL perfecto!
                setTimeout(() => {
                    AudioSystem.playGoal();
                    showAnimation('⚽');
                    playerGoals++;
                    totalGoals++;
                    document.getElementById('playerScore').textContent = playerGoals;
                    
                    penaltyNumber++;
                    if (penaltyNumber >= PENALTIES_PER_MATCH) {
                        evaluateMatchResult();
                    } else {
                        updateMatchDisplay();
                        selectRandomTargetZone();
                    }
                    
                    shotInProgress = false;
                }, 500);
            } else {
                // Tiro desviado
                setTimeout(() => {
                    showAnimation('❌');
                    
                    penaltyNumber++;
                    if (penaltyNumber >= PENALTIES_PER_MATCH) {
                        evaluateMatchResult();
                    } else {
                        updateMatchDisplay();
                        selectRandomTargetZone();
                    }
                    
                    shotInProgress = false;
                }, 500);
            }
            
            // Remover la zona objetivo después del tiro
            const oldZone = document.querySelector('.target-zone');
            if (oldZone) oldZone.remove();
        }
        
        function evaluateMatchResult() {
            if (playerGoals > opponentGoals) {
                // Ganaste el partido
                currentPhaseIndex++;
                
                if (currentPhaseIndex >= WORLD_CUP_PHASES.length - 1) {
                    // Ganaste el mundial
                    endGame(true);
                } else {
                    // Avanzar a la siguiente fase
                    playerGoals = 0;
                    opponentGoals = 0;
                    penaltyNumber = 0;
                    
                    // Aumentar dificultad
                    goalkeeper.speed += 2;
                    
                    AudioSystem.playVictory();
                    showAnimation('🏆');
                    
                    setTimeout(() => {
                        updateMatchDisplay();
                        selectRandomTargetZone();
                    }, 1000);
                }
            } else {
                // Perdiste - Eliminado
                endGame(false);
            }
        }
        
        function endGame(won) {
            gameActive = false;
            
            if (won) {
                AudioSystem.playVictory();
                showAnimation('🏆👑');
            } else {
                AudioSystem.playElimination();
                showEliminationBanner();
            }
            
            saveStats();
            
            const accuracy = totalShots > 0 ? Math.round((totalGoals / totalShots) * 100) : 0;
            
            if (won) {
                document.getElementById('resultTitle').textContent = '🏆 ¡CAMPEÓN DEL MUNDO!';
                document.getElementById('resultDetails').innerHTML = 
                    `¡Has ganado el mundial!<br>` +
                    `Fases superadas: ${currentPhaseIndex}<br>` +
                    `Goles: ${totalGoals} | Efectividad: ${accuracy}%`;
            } else {
                document.getElementById('resultTitle').textContent = '😢 ELIMINADO';
                document.getElementById('resultDetails').innerHTML = 
                    `Eliminado en: ${WORLD_CUP_PHASES[currentPhaseIndex].name}<br>` +
                    `Marcador: ${playerGoals} - ${opponentGoals}<br>` +
                    `Goles totales: ${totalGoals} | Efectividad: ${accuracy}%`;
            }
            
            document.getElementById('statsDetails').textContent = 
                `Puntuación: ${(totalGoals * 15) + (currentPhaseIndex * 50)} puntos`;
            
            document.getElementById('resultModal').classList.add('active');
        }
        
        function showEliminationBanner() {
            const banner = document.createElement('div');
            banner.className = 'elimination-banner';
            banner.textContent = '❌ ELIMINADO ❌';
            document.body.appendChild(banner);
            setTimeout(() => banner.remove(), 2000);
        }
        
        function showAnimation(emoji) {
            const anim = document.createElement('div');
            anim.className = 'goal-animation';
            anim.textContent = emoji;
            document.body.appendChild(anim);
            setTimeout(() => anim.remove(), 1500);
        }
        
        function gameLoop() {
            if (!gameActive) return;
            
            // Mover arquero
            goalkeeper.x += goalkeeper.direction * goalkeeper.speed;
            
            // Rebotar en los límites del arco
            if (goalkeeper.x <= W * 0.2 + GOALKEEPER_RADIUS) {
                goalkeeper.x = W * 0.2 + GOALKEEPER_RADIUS;
                goalkeeper.direction = 1;
            } else if (goalkeeper.x >= W * 0.8 - GOALKEEPER_RADIUS) {
                goalkeeper.x = W * 0.8 - GOALKEEPER_RADIUS;
                goalkeeper.direction = -1;
            }
            
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, W, H);
            
            // Fondo
            const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
            bgGrad.addColorStop(0, '#1a1a3e');
            bgGrad.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            // Campo
            ctx.fillStyle = '#0d5c2e';
            ctx.fillRect(0, 0, W, H);
            
            // Líneas del campo
            ctx.strokeStyle = '#1a7a3e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, H/2);
            ctx.lineTo(W, H/2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Área penal
            ctx.strokeStyle = '#1a7a3e';
            ctx.strokeRect(W*0.1, 0, W*0.8, H*0.4);
            
            // Arco
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(W*0.2, 0, W*0.6, GOAL_H);
            
            // Red del arco
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(W*0.2 + (W*0.6/7)*i, 0);
                ctx.lineTo(W*0.2 + (W*0.6/7)*i, GOAL_H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(W*0.2, (GOAL_H/7)*i);
                ctx.lineTo(W*0.8, (GOAL_H/7)*i);
                ctx.stroke();
            }
            
            // Arquero
            const goalieGrad = ctx.createRadialGradient(
                goalkeeper.x - 10, goalkeeper.y - 10, 0,
                goalkeeper.x, goalkeeper.y, GOALKEEPER_RADIUS
            );
            goalieGrad.addColorStop(0, '#ffd700');
            goalieGrad.addColorStop(1, '#ff8c00');
            ctx.fillStyle = goalieGrad;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(goalkeeper.x, goalkeeper.y, GOALKEEPER_RADIUS, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Guantes del arquero
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(goalkeeper.x - 15, goalkeeper.y - 10, 8, 0, Math.PI*2);
            ctx.arc(goalkeeper.x + 15, goalkeeper.y - 10, 8, 0, Math.PI*2);
            ctx.fill();
            
            // Texto de instrucción
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`🎯 Zona objetivo: ${currentTargetZone?.name || ''}`, W/2, H - 80);
            ctx.fillText('Haz click en la zona dorada para marcar', W/2, H - 50);
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            W = container.clientWidth;
            H = container.clientHeight;
            canvas.width = W;
            canvas.height = H;
            
            if (goalkeeper.x === 0) {
                goalkeeper.x = W / 2;
                goalkeeper.y = GOAL_H / 2;
            }
            
            if (currentTargetZone) {
                currentTargetZone.x = W * (currentTargetZone.x / W);
                currentTargetZone.y = GOAL_H * (currentTargetZone.y / GOAL_H);
                showTargetZone();
            }
        }
        
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function handleClick(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                
                // Solo permitir clicks dentro del arco
                if (y < GOAL_H && x > W * 0.2 && x < W * 0.8) {
                    shootPenalty(x, y);
                }
            }
            
            // Mouse
            canvas.addEventListener('click', e => handleClick(e.clientX, e.clientY));
            
            // Touch
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                if (e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    handleClick(touch.clientX, touch.clientY);
                }
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            loadLeaderboard();
            
            window.addEventListener('resize', () => {
                if (gameActive) resizeCanvas();
            });
            
            // Inicializar sistema de audio al primer click
            document.addEventListener('click', () => AudioSystem.init(), { once: true });
        });
    </script>
</body>
</html>
