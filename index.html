<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏆 Arena Battle - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #1a1a2e;
            --bg-card-hover: #22223a;
            --accent: #e1306c;
            --accent2: #833ab4;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --warning: #ffaa00;
            --info: #4488ff;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a3e;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============ PANTALLA DE CONEXIÓN ============ */
        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .game-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .game-subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
            text-align: center;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s;
        }

        .option-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .option-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--accent), var(--accent2));
            color: white;
            box-shadow: 0 5px 20px rgba(225, 48, 108, 0.3);
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--info);
        }

        .input-group {
            margin: 15px 0;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(225, 48, 108, 0.2);
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
        }

        .code-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 5px;
        }

        /* ============ PANTALLA DE JUEGO ============ */
        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .game-screen.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .player-info.opponent {
            justify-content: flex-end;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
        }

        .player-avatar.you {
            border-color: var(--success);
        }

        .player-avatar.opponent {
            border-color: var(--danger);
        }

        .player-details {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .player-score {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .timer-display {
            text-align: center;
            padding: 0 20px;
        }

        .timer-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
        }

        .timer-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Power-ups */
        .powerup {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            animation: float 2s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Notificaciones */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 20px 30px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .notification.success { border-color: var(--success); }
        .notification.error { border-color: var(--danger); }
        .notification.info { border-color: var(--info); }

        .notification h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .notification p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Modales */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 90%;
            width: 400px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .game-title { font-size: 2rem; }
            .game-logo { font-size: 3rem; }
            .code-text { font-size: 2rem; letter-spacing: 3px; }
            .player-avatar { width: 35px; height: 35px; font-size: 1.2rem; }
            .timer-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Pantalla de Conexión -->
    <div class="connection-screen" id="connectionScreen">
        <div class="game-logo">🏆</div>
        <h1 class="game-title">Arena Battle</h1>
        <p class="game-subtitle">¡Compite contra tus amigos en tiempo real!</p>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <div class="input-group">
                    <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                </div>
                <button class="btn btn-primary" onclick="createGame()">
                    Crear Sala
                </button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <p style="color: var(--text-secondary); margin-bottom: 10px;">Comparte este código:</p>
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="color: var(--text-secondary); text-align: center;">
                        Esperando oponente...
                    </p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse a Partida</div>
                <div class="input-group">
                    <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                </div>
                <div class="input-group">
                    <input type="text" id="gameCode" placeholder="Código de 6 dígitos" maxlength="6" 
                           oninput="this.value = this.value.toUpperCase()">
                </div>
                <button class="btn btn-secondary" onclick="joinGame()">
                    Unirse
                </button>
            </div>
        </div>
    </div>

    <!-- Pantalla de Juego -->
    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar you">😊</div>
                <div class="player-details">
                    <div class="player-name" id="yourName">Tú</div>
                    <div class="player-score" id="yourScore">0 puntos</div>
                </div>
            </div>
            
            <div class="timer-display">
                <div class="timer-text" id="timerText">60</div>
                <div class="timer-label">SEGUNDOS</div>
            </div>
            
            <div class="player-info opponent">
                <div class="player-details">
                    <div class="player-name" id="opponentName">Oponente</div>
                    <div class="player-score" id="opponentScore">0 puntos</div>
                </div>
                <div class="player-avatar opponent">😎</div>
            </div>
        </div>
        
        <div class="game-canvas-container">
            <canvas class="game-canvas" id="canvas"></canvas>
        </div>
    </div>

    <!-- Modal de Resultado -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="font-size: 2rem; margin-bottom: 20px;"></h2>
            <div id="resultDetails" style="margin-bottom: 30px;"></div>
            <button class="btn btn-primary" onclick="location.reload()">
                Jugar de Nuevo
            </button>
        </div>
    </div>

    <!-- PeerJS desde CDN -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <script>
        // ============ CONFIGURACIÓN ============
        const GAME_DURATION = 60;
        const PLAYER_SIZE = 35;
        const TARGET_SIZE = 30;
        const POWERUP_SIZE = 25;
        const SPAWN_INTERVAL = 2000;
        const POWERUP_INTERVAL = 5000;

        // ============ ESTADO ============
        let peer = null;
        let connection = null;
        let isHost = false;
        let gameStarted = false;
        let gameLoopId = null;
        let timerInterval = null;
        let spawnInterval = null;
        let powerupInterval = null;
        let canvas, ctx;
        let gameWidth, gameHeight;

        const players = {
            you: { x: 0, y: 0, score: 0, name: 'Tú', speed: 1 },
            opponent: { x: 0, y: 0, score: 0, name: 'Oponente', speed: 1 }
        };

        const targets = [];
        const powerups = [];

        let timeLeft = GAME_DURATION;
        let myPlayerId = 'you';

        // ============ CONEXIÓN ============
        function createGame() {
            const name = document.getElementById('playerName').value || 'Jugador 1';
            players.you.name = name;
            isHost = true;
            
            const gameCode = generateCode();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            
            initializePeer(gameCode);
        }

        function joinGame() {
            const name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const gameCode = document.getElementById('gameCode').value.trim();
            
            if (!gameCode || gameCode.length !== 6) {
                showNotification('Código inválido', 'Ingresa un código de 6 dígitos', 'error');
                return;
            }
            
            players.you.name = name;
            isHost = false;
            
            initializePeer(gameCode);
        }

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function initializePeer(gameCode) {
            const peerId = `arena-${gameCode}-${isHost ? 'host' : 'player'}`;
            
            peer = new Peer(peerId, {
                debug: 1
            });
            
            peer.on('open', () => {
                if (!isHost) {
                    connectToHost(gameCode);
                }
            });
            
            peer.on('connection', (conn) => {
                connection = conn;
                setupConnection();
                showNotification('¡Oponente conectado!', 'La batalla comenzará...', 'success');
                startGame();
            });
            
            peer.on('error', (error) => {
                console.error('Error PeerJS:', error);
                if (error.type === 'unavailable-id') {
                    showNotification('Error de conexión', 'El código ya está en uso', 'error');
                } else {
                    showNotification('Error de conexión', error.type, 'error');
                }
            });
        }

        function connectToHost(gameCode) {
            const hostId = `arena-${gameCode}-host`;
            connection = peer.connect(hostId, { reliable: true });
            setupConnection();
        }

        function setupConnection() {
            connection.on('open', () => {
                showNotification('¡Conectado!', 'Preparando batalla...', 'success');
                if (!isHost) {
                    startGame();
                }
            });
            
            connection.on('data', handleData);
            
            connection.on('close', () => {
                showNotification('Oponente desconectado', 'Fin de la partida', 'error');
                endGame(true);
            });
        }

        function handleData(data) {
            switch(data.type) {
                case 'position':
                    players.opponent.x = data.x;
                    players.opponent.y = data.y;
                    break;
                    
                case 'score':
                    players.opponent.score = data.score;
                    updateUI();
                    break;
                    
                case 'targetSpawn':
                    targets.push({ x: data.x, y: data.y, id: data.id });
                    break;
                    
                case 'targetCaught':
                    removeTarget(data.id);
                    break;
                    
                case 'powerupSpawn':
                    powerups.push({ x: data.x, y: data.y, type: data.powerType });
                    break;
                    
                case 'powerupCollected':
                    removePowerup(data.x, data.y);
                    break;
                    
                case 'gameStart':
                    gameStarted = true;
                    break;
                    
                case 'gameEnd':
                    endGame(false, data.winner);
                    break;
            }
        }

        function sendData(data) {
            if (connection && connection.open) {
                connection.send(data);
            }
        }

        // ============ JUEGO ============
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            
            // Posiciones iniciales
            players.you.x = gameWidth / 4;
            players.you.y = gameHeight / 2;
            players.opponent.x = (gameWidth / 4) * 3;
            players.opponent.y = gameHeight / 2;
            
            gameStarted = true;
            timeLeft = GAME_DURATION;
            
            if (isHost) {
                startGameLogic();
            }
            
            sendData({ type: 'gameStart' });
            gameLoop();
        }

        function startGameLogic() {
            // Timer
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerText').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
            
            // Spawn de targets
            spawnInterval = setInterval(() => {
                spawnTarget();
            }, SPAWN_INTERVAL);
            
            // Spawn de power-ups
            powerupInterval = setInterval(() => {
                spawnPowerup();
            }, POWERUP_INTERVAL);
            
            spawnTarget();
        }

        function spawnTarget() {
            const target = {
                x: Math.random() * (gameWidth - 100) + 50,
                y: Math.random() * (gameHeight - 100) + 50,
                id: Date.now() + Math.random()
            };
            
            targets.push(target);
            
            sendData({
                type: 'targetSpawn',
                x: target.x,
                y: target.y,
                id: target.id
            });
        }

        function spawnPowerup() {
            const types = ['speed', 'double', 'freeze'];
            const powerup = {
                x: Math.random() * (gameWidth - 100) + 50,
                y: Math.random() * (gameHeight - 100) + 50,
                type: types[Math.floor(Math.random() * types.length)]
            };
            
            powerups.push(powerup);
            
            sendData({
                type: 'powerupSpawn',
                x: powerup.x,
                y: powerup.y,
                powerType: powerup.type
            });
        }

        function removeTarget(id) {
            const index = targets.findIndex(t => t.id === id);
            if (index !== -1) {
                targets.splice(index, 1);
            }
        }

        function removePowerup(x, y) {
            const index = powerups.findIndex(p => 
                Math.abs(p.x - x) < 50 && Math.abs(p.y - y) < 50
            );
            if (index !== -1) {
                powerups.splice(index, 1);
            }
        }

        function checkCollisions() {
            // Targets
            targets.forEach((target, index) => {
                const dx = players.you.x - target.x;
                const dy = players.you.y - target.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < (PLAYER_SIZE / 2 + TARGET_SIZE / 2)) {
                    players.you.score++;
                    updateUI();
                    
                    sendData({
                        type: 'targetCaught',
                        id: target.id
                    });
                    
                    sendData({
                        type: 'score',
                        score: players.you.score
                    });
                    
                    removeTarget(target.id);
                    
                    if (isHost) {
                        spawnTarget();
                    }
                }
            });
            
            // Power-ups
            powerups.forEach((powerup, index) => {
                const dx = players.you.x - powerup.x;
                const dy = players.you.y - powerup.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < (PLAYER_SIZE / 2 + POWERUP_SIZE / 2)) {
                    applyPowerup(powerup.type);
                    removePowerup(powerup.x, powerup.y);
                    
                    sendData({
                        type: 'powerupCollected',
                        x: powerup.x,
                        y: powerup.y
                    });
                }
            });
        }

        function applyPowerup(type) {
            switch(type) {
                case 'speed':
                    players.you.speed = 1.5;
                    setTimeout(() => { players.you.speed = 1; }, 5000);
                    showNotification('⚡ ¡Velocidad aumentada!', '5 segundos', 'info');
                    break;
                    
                case 'double':
                    players.you.score += 2;
                    updateUI();
                    showNotification('💎 ¡Puntos dobles!', '+2 puntos', 'success');
                    break;
                    
                case 'freeze':
                    sendData({ type: 'freezeOpponent' });
                    showNotification('❄️ ¡Oponente congelado!', '3 segundos', 'info');
                    break;
            }
        }

        function gameLoop() {
            if (!gameStarted) return;
            
            // Enviar posición
            sendData({
                type: 'position',
                x: players.you.x,
                y: players.you.y
            });
            
            checkCollisions();
            render();
            
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function render() {
            ctx.clearRect(0, 0, gameWidth, gameHeight);
            
            // Fondo
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, gameWidth, gameHeight);
            
            // Grid
            ctx.strokeStyle = '#2a2a3e';
            ctx.lineWidth = 1;
            for (let i = 0; i < gameWidth; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, gameHeight);
                ctx.stroke();
            }
            for (let i = 0; i < gameHeight; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(gameWidth, i);
                ctx.stroke();
            }
            
            // Targets
            targets.forEach(target => {
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(target.x, target.y, TARGET_SIZE / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            
            // Power-ups
            powerups.forEach(powerup => {
                ctx.fillStyle = powerup.type === 'speed' ? '#4488ff' : 
                                powerup.type === 'double' ? '#00ff88' : '#ffaa00';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 15;
                ctx.fillRect(
                    powerup.x - POWERUP_SIZE / 2,
                    powerup.y - POWERUP_SIZE / 2,
                    POWERUP_SIZE,
                    POWERUP_SIZE
                );
                ctx.shadowBlur = 0;
            });
            
            // Jugador local
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 20;
            ctx.fillRect(
                players.you.x - PLAYER_SIZE / 2,
                players.you.y - PLAYER_SIZE / 2,
                PLAYER_SIZE,
                PLAYER_SIZE
            );
            ctx.shadowBlur = 0;
            
            // Oponente
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 20;
            ctx.fillRect(
                players.opponent.x - PLAYER_SIZE / 2,
                players.opponent.y - PLAYER_SIZE / 2,
                PLAYER_SIZE,
                PLAYER_SIZE
            );
            ctx.shadowBlur = 0;
        }

        function updateUI() {
            document.getElementById('yourName').textContent = players.you.name;
            document.getElementById('opponentName').textContent = players.opponent.name;
            document.getElementById('yourScore').textContent = `${players.you.score} puntos`;
            document.getElementById('opponentScore').textContent = `${players.opponent.score} puntos`;
        }

        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            gameWidth = container.clientWidth;
            gameHeight = container.clientHeight;
            
            canvas.width = gameWidth;
            canvas.height = gameHeight;
        }

        function endGame(disconnected = false, winner = null) {
            gameStarted = false;
            
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (timerInterval) clearInterval(timerInterval);
            if (spawnInterval) clearInterval(spawnInterval);
            if (powerupInterval) clearInterval(powerupInterval);
            
            if (disconnected) {
                showResult('👋 Oponente desconectado', 'La partida ha terminado');
            } else {
                const winnerName = winner || 
                    (players.you.score > players.opponent.score ? players.you.name : 
                     players.opponent.score > players.you.score ? players.opponent.name : 'Empate');
                
                const resultTitle = winnerName === 'Empate' ? '🤝 ¡Empate!' : 
                    winnerName === players.you.name ? '🏆 ¡Victoria!' : '😢 ¡Derrota!';
                
                const resultDetails = `
                    ${players.you.name}: ${players.you.score} puntos
                    <br>
                    ${players.opponent.name}: ${players.opponent.score} puntos
                `;
                
                showResult(resultTitle, resultDetails);
            }
        }

        function showResult(title, details) {
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultDetails').innerHTML = details;
            document.getElementById('resultModal').classList.add('active');
        }

        function showNotification(title, message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <h3>${title}</h3>
                <p>${message}</p>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // ============ CONTROLES ============
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            // Mouse
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                players.you.x = e.clientX - rect.left;
                players.you.y = e.clientY - rect.top;
            });
            
            // Touch
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                players.you.x = touch.clientX - rect.left;
                players.you.y = touch.clientY - rect.top;
            });
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                players.you.x = touch.clientX - rect.left;
                players.you.y = touch.clientY - rect.top;
            });
        }

        // ============ INICIALIZACIÓN ============
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            
            window.addEventListener('resize', () => {
                if (gameStarted) {
                    resizeCanvas();
                }
            });
        });
    </script>
</body>
</html>
