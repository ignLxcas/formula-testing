<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏆 Mundial de Penales 2026</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #1a1a3e;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Pantallas */
        .screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }
        .screen.active { 
            display: flex; 
        }

        /* Menú principal */
        .menu-screen {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b35, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
            margin-bottom: 20px;
        }

        /* Botones */
        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn:active { 
            transform: scale(0.95); 
        }

        .btn-primary { 
            background: linear-gradient(45deg, #ff6b35, #f7c948); 
            color: #0a0a1a;
        }

        .btn-secondary { 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            border: 2px solid var(--border);
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 12px;
        }

        /* Selección de países */
        .country-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin: 15px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .country-option {
            padding: 15px 10px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            background: var(--bg-primary);
        }

        .country-option:hover {
            border-color: var(--gold);
            transform: scale(1.05);
        }

        .country-option.selected {
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .country-flag {
            font-size: 2rem;
            display: block;
        }

        .country-name {
            font-size: 0.7rem;
            margin-top: 5px;
        }

        /* Header del juego */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .team-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .team-flag {
            font-size: 2.5rem;
        }

        .team-name {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .team-score {
            font-size: 2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .match-info {
            text-align: center;
        }

        .match-phase {
            font-size: 1.2rem;
            color: var(--accent2);
            font-weight: bold;
        }

        .penalty-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Canvas del juego */
        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Zona objetivo */
        .target-zone {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px dashed var(--gold);
            border-radius: 50%;
            pointer-events: none;
            animation: zonePulse 0.8s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        @keyframes zonePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Animaciones */
        .goal-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            z-index: 1000;
            animation: goalCelebration 1.5s ease-out;
            pointer-events: none;
        }

        @keyframes goalCelebration {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active { 
            display: flex; 
        }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 90%;
        }

        /* Leaderboard */
        .leaderboard {
            margin: 20px 0;
            text-align: left;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: var(--bg-primary);
            border-radius: 8px;
        }

        .leaderboard-entry.top1 { 
            background: rgba(255, 215, 0, 0.2); 
            border: 1px solid var(--gold); 
        }

        .leaderboard-entry.top2 { 
            background: rgba(192, 192, 192, 0.2); 
            border: 1px solid #c0c0c0; 
        }

        .leaderboard-entry.top3 { 
            background: rgba(205, 127, 50, 0.2); 
            border: 1px solid #cd7f32; 
        }
    </style>
</head>
<body>
    <!-- Menú Principal -->
    <div class="screen menu-screen active" id="menuScreen">
        <h1 class="game-title">🏆 Mundial de Penales</h1>
        
        <div class="menu-options">
            <div class="card">
                <div class="card-title">🎮 Selecciona tu Equipo</div>
                <input type="text" id="playerName" placeholder="Tu nombre" maxlength="20">
                <div class="country-grid" id="countryGrid"></div>
                <button class="btn btn-primary" onclick="startGame()">Comenzar Mundial</button>
            </div>
            
            <div class="card">
                <div class="card-title">🏆 Ranking Global</div>
                <div id="leaderboardContainer">
                    <p style="text-align:center;color:var(--text-secondary);">Cargando...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Pantalla de Juego -->
    <div class="screen" id="gameScreen">
        <div class="game-header">
            <div class="team-info">
                <span class="team-flag" id="playerFlag">😊</span>
                <span class="team-name" id="playerTeamName">Jugador</span>
                <span class="team-score" id="playerScore">0</span>
            </div>
            <div class="match-info">
                <div class="match-phase" id="matchPhase">Fase 1</div>
                <div class="penalty-counter" id="penaltyCounter">Penal 1 de 5</div>
            </div>
            <div class="team-info">
                <span class="team-flag" id="opponentFlag">🧤</span>
                <span class="team-name" id="opponentTeamName">Arquero</span>
                <span class="team-score" id="opponentScore">0</span>
            </div>
        </div>
        <div class="game-canvas-container" id="canvasContainer">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <!-- Modal de Resultado -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="font-size:2rem;margin-bottom:15px;"></h2>
            <p id="resultDetails" style="font-size:1.2rem;margin-bottom:20px;"></p>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        // ==================== CONFIGURACIÓN DE FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ==================== DATOS DE PAÍSES ====================
        const countries = [
            { name: 'Argentina', flag: '🇦🇷' },
            { name: 'Francia', flag: '🇫🇷' },
            { name: 'Brasil', flag: '🇧🇷' },
            { name: 'Inglaterra', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
            { name: 'España', flag: '🇪🇸' },
            { name: 'Alemania', flag: '🇩🇪' },
            { name: 'Portugal', flag: '🇵🇹' },
            { name: 'Holanda', flag: '🇳🇱' },
            { name: 'Italia', flag: '🇮🇹' },
            { name: 'Bélgica', flag: '🇧🇪' },
            { name: 'Uruguay', flag: '🇺🇾' },
            { name: 'Croacia', flag: '🇭🇷' },
            { name: 'México', flag: '🇲🇽' },
            { name: 'Estados Unidos', flag: '🇺🇸' },
            { name: 'Japón', flag: '🇯🇵' },
            { name: 'Corea del Sur', flag: '🇰🇷' },
            { name: 'Colombia', flag: '🇨🇴' },
            { name: 'Senegal', flag: '🇸🇳' },
            { name: 'Marruecos', flag: '🇲🇦' },
            { name: 'Suiza', flag: '🇨🇭' },
            { name: 'Dinamarca', flag: '🇩🇰' },
            { name: 'Serbia', flag: '🇷🇸' },
            { name: 'Canadá', flag: '🇨🇦' },
            { name: 'Australia', flag: '🇦🇺' },
            { name: 'Ecuador', flag: '🇪🇨' },
            { name: 'Ghana', flag: '🇬🇭' },
            { name: 'Camerún', flag: '🇨🇲' },
            { name: 'Polonia', flag: '🇵🇱' },
            { name: 'Austria', flag: '🇦🇹' },
            { name: 'Nigeria', flag: '🇳🇬' },
            { name: 'Costa Rica', flag: '🇨🇷' },
            { name: 'Arabia Saudita', flag: '🇸🇦' }
        ];

        // ==================== CONFIGURACIÓN DEL JUEGO ====================
        const gameConfig = {
            goalHeight: 200,
            goalkeeperRadius: 30,
            goalkeeperSpeed: 12,
            penaltiesPerMatch: 5,
            zones: [
                { x: 0.15, y: 0.2, name: 'Ángulo superior izquierdo' },
                { x: 0.85, y: 0.2, name: 'Ángulo superior derecho' },
                { x: 0.15, y: 0.8, name: 'Ángulo inferior izquierdo' },
                { x: 0.85, y: 0.8, name: 'Ángulo inferior derecho' },
                { x: 0.5, y: 0.5, name: 'Centro del arco' }
            ],
            phases: [
                'Dieciseisavos de Final',
                'Octavos de Final',
                'Cuartos de Final',
                'Semifinal',
                'Final'
            ]
        };

        // ==================== ESTADO DEL JUEGO ====================
        const gameState = {
            canvas: null,
            context: null,
            width: 0,
            height: 0,
            active: false,
            player: {
                name: '',
                country: null,
                score: 0,
                totalGoals: 0,
                totalShots: 0
            },
            opponent: {
                score: 0
            },
            goalkeeper: {
                x: 0,
                y: 0,
                direction: 1,
                speed: gameConfig.goalkeeperSpeed
            },
            phaseIndex: 0,
            penaltyNumber: 0,
            targetZone: null,
            shotInProgress: false
        };

        // ==================== SISTEMA DE AUDIO ====================
        const audioSystem = {
            context: null,
            
            init() {
                if (!this.context) {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            
            playTone(frequency, duration, type = 'sine', volume = 0.3) {
                this.init();
                const oscillator = this.context.createOscillator();
                const gain = this.context.createGain();
                
                oscillator.connect(gain);
                gain.connect(this.context.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = type;
                
                gain.gain.setValueAtTime(volume, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + duration);
                
                oscillator.start();
                oscillator.stop(this.context.currentTime + duration);
            },
            
            playGoal() {
                [523, 659, 784, 1047].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 0.3), i * 100);
                });
            },
            
            playSave() {
                this.playTone(300, 0.3, 'square');
            },
            
            playVictory() {
                [523, 523, 523, 659, 784, 1047].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 0.4, 'triangle', 0.25), i * 150);
                });
            },
            
            playElimination() {
                [400, 300, 200, 100].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 0.4, 'sawtooth', 0.2), i * 200);
                });
            },
            
            playWhistle() {
                this.playTone(2000, 0.5);
            }
        };

        // ==================== FUNCIONES DE INTERFAZ ====================
        function initializeCountryGrid() {
            const grid = document.getElementById('countryGrid');
            
            countries.forEach(country => {
                const option = document.createElement('div');
                option.className = 'country-option';
                option.innerHTML = `
                    <span class="country-flag">${country.flag}</span>
                    <span class="country-name">${country.name}</span>
                `;
                option.onclick = () => selectCountry(country, option);
                grid.appendChild(option);
            });
        }

        function selectCountry(country, element) {
            gameState.player.country = country;
            
            // Actualizar selección visual
            document.querySelectorAll('.country-option').forEach(el => {
                el.classList.remove('selected');
            });
            element.classList.add('selected');
        }

        function loadLeaderboard() {
            const leaderboardRef = database.ref('leaderboard');
            
            leaderboardRef.orderByChild('score').limitToLast(10).on('value', snapshot => {
                const container = document.getElementById('leaderboardContainer');
                container.innerHTML = '';
                
                if (!snapshot.exists()) {
                    container.innerHTML = '<p style="text-align:center;">No hay jugadores todavía</p>';
                    return;
                }
                
                const players = [];
                snapshot.forEach(child => {
                    players.push(child.val());
                });
                
                players.reverse().forEach((player, index) => {
                    const entry = document.createElement('div');
                    entry.className = 'leaderboard-entry';
                    
                    if (index === 0) entry.classList.add('top1');
                    if (index === 1) entry.classList.add('top2');
                    if (index === 2) entry.classList.add('top3');
                    
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    const flag = player.country ? player.country.flag : '🏳️';
                    
                    entry.innerHTML = `
                        <span>${medal} ${flag} ${player.name}</span>
                        <span>${player.score} pts</span>
                    `;
                    
                    container.appendChild(entry);
                });
            });
        }

        function savePlayerStats() {
            if (!gameState.player.name || !gameState.player.country) return;
            
            const score = (gameState.player.totalGoals * 15) + (gameState.phaseIndex * 50);
            const safeName = gameState.player.name.replace(/[.#$\[\]]/g, '_');
            const playerRef = database.ref('leaderboard/' + safeName);
            
            playerRef.once('value', snapshot => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    playerRef.update({
                        score: data.score + score,
                        goals: data.goals + gameState.player.totalGoals,
                        shots: data.shots + gameState.player.totalShots,
                        gamesPlayed: (data.gamesPlayed || 0) + 1,
                        country: gameState.player.country,
                        bestPhase: Math.max(data.bestPhase || 0, gameState.phaseIndex)
                    });
                } else {
                    playerRef.set({
                        name: gameState.player.name,
                        score: score,
                        goals: gameState.player.totalGoals,
                        shots: gameState.player.totalShots,
                        gamesPlayed: 1,
                        country: gameState.player.country,
                        bestPhase: gameState.phaseIndex
                    });
                }
            });
        }

        // ==================== FUNCIONES DEL JUEGO ====================
        function startGame() {
            gameState.player.name = document.getElementById('playerName').value || 'Jugador Anónimo';
            
            if (!gameState.player.country) {
                alert('Por favor selecciona un país');
                return;
            }
            
            // Configurar pantalla
            document.getElementById('playerFlag').textContent = gameState.player.country.flag;
            document.getElementById('playerTeamName').textContent = gameState.player.country.name;
            
            // Resetear estado
            gameState.player.score = 0;
            gameState.player.totalGoals = 0;
            gameState.player.totalShots = 0;
            gameState.opponent.score = 0;
            gameState.phaseIndex = 0;
            gameState.penaltyNumber = 0;
            gameState.shotInProgress = false;
            
            // Cambiar pantalla
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            
            // Inicializar canvas
            initializeCanvas();
            initializeGoalkeeper();
            updateInterface();
            selectRandomTargetZone();
            
            gameState.active = true;
            audioSystem.playWhistle();
            gameLoop();
        }

        function initializeCanvas() {
            gameState.canvas = document.getElementById('canvas');
            gameState.context = gameState.canvas.getContext('2d');
            resizeCanvas();
        }

        function initializeGoalkeeper() {
            gameState.goalkeeper.x = gameState.width / 2;
            gameState.goalkeeper.y = gameConfig.goalHeight / 2;
            gameState.goalkeeper.direction = 1;
            gameState.goalkeeper.speed = gameConfig.goalkeeperSpeed;
        }

        function updateInterface() {
            document.getElementById('matchPhase').textContent = gameConfig.phases[gameState.phaseIndex];
            document.getElementById('penaltyCounter').textContent = `Penal ${gameState.penaltyNumber + 1} de ${gameConfig.penaltiesPerMatch}`;
            document.getElementById('playerScore').textContent = gameState.player.score;
            document.getElementById('opponentScore').textContent = gameState.opponent.score;
            
            // Seleccionar oponente aleatorio
            const opponent = getRandomOpponent();
            document.getElementById('opponentFlag').textContent = opponent.flag;
            document.getElementById('opponentTeamName').textContent = opponent.name;
        }

        function getRandomOpponent() {
            const availableCountries = countries.filter(c => c.name !== gameState.player.country.name);
            return availableCountries[Math.floor(Math.random() * availableCountries.length)];
        }

        function selectRandomTargetZone() {
            const zone = gameConfig.zones[Math.floor(Math.random() * gameConfig.zones.length)];
            gameState.targetZone = {
                x: gameState.width * zone.x,
                y: gameConfig.goalHeight * zone.y,
                name: zone.name
            };
            
            showTargetZone();
        }

        function showTargetZone() {
            // Eliminar zona anterior
            const oldZone = document.querySelector('.target-zone');
            if (oldZone) oldZone.remove();
            
            // Crear nueva zona
            const container = document.getElementById('canvasContainer');
            const zone = document.createElement('div');
            zone.className = 'target-zone';
            zone.style.left = gameState.targetZone.x - 30 + 'px';
            zone.style.top = gameState.targetZone.y - 30 + 'px';
            container.appendChild(zone);
        }

        function shootPenalty(clickX, clickY) {
            if (gameState.shotInProgress || !gameState.active || !gameState.targetZone) return;
            
            gameState.shotInProgress = true;
            gameState.player.totalShots++;
            
            // Calcular distancias
            const distanceToTarget = getDistance(clickX, clickY, gameState.targetZone.x, gameState.targetZone.y);
            const distanceToGoalkeeper = getDistance(clickX, clickY, gameState.goalkeeper.x, gameState.goalkeeper.y);
            
            // Determinar resultado
            let result;
            if (distanceToGoalkeeper < gameConfig.goalkeeperRadius + 15) {
                result = 'save';
            } else if (distanceToTarget < 50) {
                result = 'goal';
            } else {
                result = 'miss';
            }
            
            // Procesar resultado
            setTimeout(() => {
                processShotResult(result);
                gameState.shotInProgress = false;
            }, 500);
            
            // Limpiar zona objetivo
            const oldZone = document.querySelector('.target-zone');
            if (oldZone) oldZone.remove();
        }

        function getDistance(x1, y1, x2, y2) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function processShotResult(result) {
            if (result === 'goal') {
                audioSystem.playGoal();
                showAnimation('⚽');
                gameState.player.score++;
                gameState.player.totalGoals++;
            } else if (result === 'save') {
                audioSystem.playSave();
                showAnimation('🧤');
                gameState.opponent.score++;
            } else {
                showAnimation('❌');
            }
            
            updateInterface();
            gameState.penaltyNumber++;
            
            if (gameState.penaltyNumber >= gameConfig.penaltiesPerMatch) {
                evaluateMatchResult();
            } else {
                selectRandomTargetZone();
            }
        }

        function evaluateMatchResult() {
            if (gameState.player.score > gameState.opponent.score) {
                // Ganó el partido
                gameState.phaseIndex++;
                
                if (gameState.phaseIndex >= gameConfig.phases.length) {
                    endGame(true);
                } else {
                    // Avanzar a siguiente fase
                    gameState.player.score = 0;
                    gameState.opponent.score = 0;
                    gameState.penaltyNumber = 0;
                    gameState.goalkeeper.speed += 2;
                    
                    audioSystem.playVictory();
                    showAnimation('🏆');
                    
                    setTimeout(() => {
                        updateInterface();
                        selectRandomTargetZone();
                    }, 1000);
                }
            } else {
                // Perdió el partido
                endGame(false);
            }
        }

        function endGame(won) {
            gameState.active = false;
            
            if (won) {
                audioSystem.playVictory();
                showAnimation('🏆👑');
            } else {
                audioSystem.playElimination();
            }
            
            savePlayerStats();
            
            const accuracy = gameState.player.totalShots > 0 
                ? Math.round((gameState.player.totalGoals / gameState.player.totalShots) * 100) 
                : 0;
            
            const modal = document.getElementById('resultModal');
            const title = document.getElementById('resultTitle');
            const details = document.getElementById('resultDetails');
            
            if (won) {
                title.textContent = '🏆 ¡CAMPEÓN DEL MUNDO!';
                details.textContent = `${gameState.player.country.flag} ${gameState.player.country.name} ha ganado el mundial!`;
            } else {
                title.textContent = '😢 ELIMINADO';
                details.textContent = `Eliminado en ${gameConfig.phases[gameState.phaseIndex]}. Goles: ${gameState.player.totalGoals} (${accuracy}% efectividad)`;
            }
            
            modal.classList.add('active');
        }

        function showAnimation(emoji) {
            const animation = document.createElement('div');
            animation.className = 'goal-animation';
            animation.textContent = emoji;
            document.body.appendChild(animation);
            setTimeout(() => animation.remove(), 1500);
        }

        // ==================== BUCLE DEL JUEGO ====================
        function gameLoop() {
            if (!gameState.active) return;
            
            updateGoalkeeper();
            render();
            requestAnimationFrame(gameLoop);
        }

        function updateGoalkeeper() {
            gameState.goalkeeper.x += gameState.goalkeeper.direction * gameState.goalkeeper.speed;
            
            const minX = gameState.width * 0.2 + gameConfig.goalkeeperRadius;
            const maxX = gameState.width * 0.8 - gameConfig.goalkeeperRadius;
            
            if (gameState.goalkeeper.x <= minX) {
                gameState.goalkeeper.x = minX;
                gameState.goalkeeper.direction = 1;
            } else if (gameState.goalkeeper.x >= maxX) {
                gameState.goalkeeper.x = maxX;
                gameState.goalkeeper.direction = -1;
            }
        }

        function render() {
            const ctx = gameState.context;
            const { width: W, height: H } = gameState;
            
            ctx.clearRect(0, 0, W, H);
            
            // Fondo del campo
            const fieldGradient = ctx.createLinearGradient(0, 0, 0, H);
            fieldGradient.addColorStop(0, '#0a4a24');
            fieldGradient.addColorStop(1, '#0d5c2e');
            ctx.fillStyle = fieldGradient;
            ctx.fillRect(0, 0, W, H);
            
            // Línea central
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, H/2);
            ctx.lineTo(W, H/2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Área penal
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.strokeRect(W*0.1, 0, W*0.8, H*0.35);
            
            // Arco
            const goalGradient = ctx.createLinearGradient(0, 0, 0, gameConfig.goalHeight);
            goalGradient.addColorStop(0, '#f0f0f0');
            goalGradient.addColorStop(1, '#d0d0d0');
            ctx.fillStyle = goalGradient;
            ctx.fillRect(W*0.2, 0, W*0.6, gameConfig.goalHeight);
            
            // Red del arco
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 10; i++) {
                const x = W*0.2 + (W*0.6/9)*i;
                const y = (gameConfig.goalHeight/9)*i;
                
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, gameConfig.goalHeight);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(W*0.2, y);
                ctx.lineTo(W*0.8, y);
                ctx.stroke();
            }
            
            // Arquero
            const goalkeeperGradient = ctx.createRadialGradient(
                gameState.goalkeeper.x - 10, 
                gameState.goalkeeper.y - 10, 
                0,
                gameState.goalkeeper.x, 
                gameState.goalkeeper.y, 
                gameConfig.goalkeeperRadius
            );
            goalkeeperGradient.addColorStop(0, '#ffd700');
            goalkeeperGradient.addColorStop(1, '#ff6b00');
            
            ctx.fillStyle = goalkeeperGradient;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(
                gameState.goalkeeper.x, 
                gameState.goalkeeper.y, 
                gameConfig.goalkeeperRadius, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Texto de instrucción
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(
                `🎯 Zona: ${gameState.targetZone?.name || ''}`, 
                W/2, 
                H - 80
            );
            ctx.fillText(
                'Haz click en la zona dorada para marcar', 
                W/2, 
                H - 50
            );
        }

        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            gameState.width = container.clientWidth;
            gameState.height = container.clientHeight;
            gameState.canvas.width = gameState.width;
            gameState.canvas.height = gameState.height;
            
            if (gameState.goalkeeper.x === 0) {
                gameState.goalkeeper.x = gameState.width / 2;
                gameState.goalkeeper.y = gameConfig.goalHeight / 2;
            }
            
            if (gameState.targetZone) {
                showTargetZone();
            }
        }

        // ==================== CONTROLES ====================
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function handleClick(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                
                // Solo permitir clicks dentro del arco
                if (
                    y < gameConfig.goalHeight && 
                    x > gameState.width * 0.2 && 
                    x < gameState.width * 0.8
                ) {
                    shootPenalty(x, y);
                }
            }
            
            canvas.addEventListener('click', e => {
                handleClick(e.clientX, e.clientY);
            });
            
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                if (e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    handleClick(touch.clientX, touch.clientY);
                }
            }, { passive: false });
        }

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener('DOMContentLoaded', () => {
            initializeCountryGrid();
            setupControls();
            loadLeaderboard();
            
            window.addEventListener('resize', () => {
                if (gameState.active) resizeCanvas();
            });
            
            document.addEventListener('click', () => audioSystem.init(), { once: true });
        });
    </script>
</body>
</html>
