<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Ball Rush - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .ball-animation {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px;
        }

        .option-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            color: #0a0a1a;
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .input-group { margin: 10px 0; }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin: 10px 0;
        }

        .code-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .player-info.opponent { justify-content: flex-end; }

        .player-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
        }

        .player-avatar.you { border-color: var(--success); }
        .player-avatar.opponent { border-color: var(--danger); }

        .player-name { font-size: 0.8rem; font-weight: bold; }
        .player-score { font-size: 1.2rem; color: var(--gold); font-weight: bold; }

        .timer-display { text-align: center; padding: 0 15px; }
        .timer-text { font-size: 2rem; font-weight: bold; color: var(--gold); }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Joystick virtual para móvil */
        .joystick-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            z-index: 100;
            display: none;
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
        }

        .joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255, 107, 53, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px 20px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 90%;
            width: 350px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .game-title { font-size: 2rem; }
            .ball-animation { font-size: 3rem; }
            .code-text { font-size: 1.5rem; }
            .player-avatar { width: 30px; height: 30px; font-size: 1rem; }
            .timer-text { font-size: 1.5rem; }
            .joystick-container { display: block; }
        }
    </style>
</head>
<body>
    <div class="connection-screen" id="connectionScreen">
        <div class="ball-animation">⚽</div>
        <h1 class="game-title">Ball Rush</h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">¡Empuja la pelota hacia la portería!</p>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <div class="input-group">
                    <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                </div>
                <button class="btn btn-primary" onclick="createGame()">Crear Sala</button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <p style="color: var(--text-secondary); font-size: 0.8rem;">Código:</p>
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="color: var(--text-secondary); text-align: center;">Esperando oponente...</p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <div class="input-group">
                    <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                </div>
                <div class="input-group">
                    <input type="text" id="gameCode" placeholder="Código" maxlength="6" 
                           oninput="this.value = this.value.toUpperCase()">
                </div>
                <button class="btn btn-secondary" onclick="joinGame()">Unirse</button>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar you">😊</div>
                <div>
                    <div class="player-name" id="yourName">Tú</div>
                    <div class="player-score" id="yourScore">0</div>
                </div>
            </div>
            
            <div class="timer-display">
                <div class="timer-text" id="timerText">60</div>
            </div>
            
            <div class="player-info opponent">
                <div style="text-align: right;">
                    <div class="player-name" id="opponentName">Oponente</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
                <div class="player-avatar opponent">😎</div>
            </div>
        </div>
        
        <div class="game-canvas-container">
            <canvas class="game-canvas" id="canvas"></canvas>
        </div>
    </div>

    <!-- Joystick virtual -->
    <div class="joystick-container" id="joystickContainer">
        <div class="joystick-base" id="joystickBase">
            <div class="joystick-stick" id="joystickStick"></div>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="font-size: 1.8rem; margin-bottom: 15px;"></h2>
            <div id="resultDetails" style="margin-bottom: 20px;"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        // ============ CONFIGURACIÓN DE FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ============ SISTEMA DE SONIDOS ============
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioContext = null;
        
        function playSound(type) {
            try {
                if (!audioContext) audioContext = new AudioContext();
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                
                switch(type) {
                    case 'kick':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(200, audioContext.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(80, audioContext.currentTime + 0.08);
                        gain.gain.setValueAtTime(0.4, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.08);
                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.08);
                        break;
                    case 'goal':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523, audioContext.currentTime);
                        osc.frequency.setValueAtTime(659, audioContext.currentTime + 0.1);
                        osc.frequency.setValueAtTime(784, audioContext.currentTime + 0.2);
                        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.3);
                        break;
                    case 'wall':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(150, audioContext.currentTime);
                        gain.gain.setValueAtTime(0.15, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.05);
                        break;
                    case 'win':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523, audioContext.currentTime);
                        osc.frequency.setValueAtTime(659, audioContext.currentTime + 0.15);
                        osc.frequency.setValueAtTime(784, audioContext.currentTime + 0.3);
                        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.45);
                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.45);
                        break;
                    case 'lose':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(400, audioContext.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.4);
                        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.4);
                        break;
                }
            } catch (e) {}
        }
        
        // ============ CONFIGURACIÓN DEL JUEGO ============
        const GAME_DURATION = 60;
        const BALL_RADIUS = 15;
        const PLAYER_RADIUS = 25;
        const GOAL_HEIGHT = 40;
        const KICK_FORCE = 10;
        const FRICTION = 0.98;
        const MAX_BALL_SPEED = 12;
        
        let gameCode = null;
        let isHost = false;
        let gameRef = null;
        let gameStarted = false;
        let canvas, ctx;
        let gameWidth, gameHeight;
        let myPlayerKey = null;
        
        const players = {
            you: { x: 0, y: 0, score: 0, name: 'Tú' },
            opponent: { x: 0, y: 0, score: 0, name: 'Oponente' }
        };
        
        const ball = { x: 0, y: 0, vx: 0, vy: 0, lastKicker: null };
        let timeLeft = GAME_DURATION;
        let joystickActive = false;
        let joystickX = 0;
        let joystickY = 0;
        
        // ============ CONEXIÓN ============
        function createGame() {
            const name = document.getElementById('playerName').value || 'Jugador 1';
            players.you.name = name;
            isHost = true;
            myPlayerKey = 'host';
            gameCode = generateCode();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            
            gameRef = database.ref('games/' + gameCode);
            
            gameRef.set({
                host: { name: name, x: 0.5, y: 0.8, score: 0, connected: true },
                opponent: { name: '', x: 0.5, y: 0.2, score: 0, connected: false },
                ball: { x: 0.5, y: 0.5, vx: 0, vy: 0, lastKicker: null },
                started: false,
                timeLeft: GAME_DURATION
            });
            
            gameRef.child('opponent/connected').on('value', (snapshot) => {
                if (snapshot.val() === true && !gameStarted) {
                    gameRef.child('opponent/name').once('value', (nameSnapshot) => {
                        players.opponent.name = nameSnapshot.val() || 'Oponente';
                        startGame();
                    });
                }
            });
            
            gameRef.child('opponent').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && gameStarted) {
                    players.opponent.x = (data.x || 0.5) * gameWidth;
                    players.opponent.y = (data.y || 0.2) * gameHeight;
                    players.opponent.score = data.score || 0;
                    updateUI();
                }
            });
            
            gameRef.child('ball').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && gameStarted && data.lastKicker !== myPlayerKey) {
                    ball.x = (data.x || 0.5) * gameWidth;
                    ball.y = (data.y || 0.5) * gameHeight;
                    ball.vx = data.vx || 0;
                    ball.vy = data.vy || 0;
                    ball.lastKicker = data.lastKicker;
                }
            });
        }
        
        function joinGame() {
            const name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const code = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!code || code.length !== 6) {
                showNotification('Error', 'Ingresa un código válido', 'error');
                return;
            }
            
            players.you.name = name;
            isHost = false;
            myPlayerKey = 'opponent';
            gameCode = code;
            
            gameRef = database.ref('games/' + code);
            
            gameRef.once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    showNotification('Error', 'No se encontró la partida', 'error');
                    return;
                }
                
                gameRef.child('opponent').update({
                    name: name,
                    connected: true
                });
                
                gameRef.child('host').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        players.opponent.name = data.name;
                        players.opponent.x = (data.x || 0.5) * gameWidth;
                        players.opponent.y = (data.y || 0.8) * gameHeight;
                        players.opponent.score = data.score || 0;
                        updateUI();
                    }
                });
                
                gameRef.child('ball').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && gameStarted && data.lastKicker !== myPlayerKey) {
                        ball.x = (data.x || 0.5) * gameWidth;
                        ball.y = (data.y || 0.5) * gameHeight;
                        ball.vx = data.vx || 0;
                        ball.vy = data.vy || 0;
                        ball.lastKicker = data.lastKicker;
                    }
                });
                
                gameRef.child('started').on('value', (snapshot) => {
                    if (snapshot.val() === true && !gameStarted) {
                        startGame();
                    }
                });
                
                gameRef.child('timeLeft').on('value', (snapshot) => {
                    const time = snapshot.val();
                    if (time !== null && gameStarted) {
                        timeLeft = time;
                        document.getElementById('timerText').textContent = time;
                    }
                });
            });
        }
        
        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }
        
        // ============ JUEGO ============
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            
            if (isHost) {
                players.you.x = gameWidth / 2;
                players.you.y = gameHeight * 0.8;
                ball.x = gameWidth / 2;
                ball.y = gameHeight / 2;
                
                gameRef.update({
                    started: true,
                    timeLeft: GAME_DURATION,
                    ball: { x: 0.5, y: 0.5, vx: 0, vy: 0, lastKicker: null }
                });
                
                const timerInterval = setInterval(() => {
                    if (!gameStarted) {
                        clearInterval(timerInterval);
                        return;
                    }
                    timeLeft--;
                    document.getElementById('timerText').textContent = timeLeft;
                    gameRef.child('timeLeft').set(timeLeft);
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        endGame(false);
                    }
                }, 1000);
            } else {
                players.you.x = gameWidth / 2;
                players.you.y = gameHeight * 0.2;
            }
            
            gameStarted = true;
            timeLeft = GAME_DURATION;
            updateUI();
            gameLoop();
        }
        
        function checkBallCollision() {
            const dx = players.you.x - ball.x;
            const dy = players.you.y - ball.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < PLAYER_RADIUS + BALL_RADIUS) {
                const angle = Math.atan2(dy, dx);
                ball.vx = Math.cos(angle) * KICK_FORCE;
                ball.vy = Math.sin(angle) * KICK_FORCE;
                
                // Separar la pelota
                const overlap = PLAYER_RADIUS + BALL_RADIUS - distance;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                
                ball.lastKicker = myPlayerKey;
                playSound('kick');
                
                // Enviar a Firebase inmediatamente
                if (gameRef) {
                    gameRef.child('ball').set({
                        x: ball.x / gameWidth,
                        y: ball.y / gameHeight,
                        vx: ball.vx,
                        vy: ball.vy,
                        lastKicker: ball.lastKicker
                    });
                }
            }
        }
        
        function updateBallHost() {
            // Aplicar fricción
            ball.vx *= FRICTION;
            ball.vy *= FRICTION;
            
            // Limitar velocidad
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            if (speed > MAX_BALL_SPEED) {
                ball.vx = (ball.vx / speed) * MAX_BALL_SPEED;
                ball.vy = (ball.vy / speed) * MAX_BALL_SPEED;
            }
            if (speed < 0.1) {
                ball.vx = 0;
                ball.vy = 0;
            }
            
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // Rebotes
            if (ball.x < BALL_RADIUS) {
                ball.x = BALL_RADIUS;
                ball.vx = Math.abs(ball.vx) * 0.8;
                playSound('wall');
            }
            if (ball.x > gameWidth - BALL_RADIUS) {
                ball.x = gameWidth - BALL_RADIUS;
                ball.vx = -Math.abs(ball.vx) * 0.8;
                playSound('wall');
            }
            
            // Goles
            if (ball.y < BALL_RADIUS) {
                if (ball.lastKicker === 'host') {
                    players.you.score++;
                    gameRef.child('host/score').set(players.you.score);
                    playSound('goal');
                }
                updateUI();
                resetBall();
                return;
            }
            
            if (ball.y > gameHeight - BALL_RADIUS) {
                if (ball.lastKicker === 'opponent') {
                    players.opponent.score++;
                    gameRef.child('opponent/score').set(players.opponent.score);
                    playSound('goal');
                }
                updateUI();
                resetBall();
                return;
            }
            
            // Enviar posición a Firebase
            gameRef.child('ball').update({
                x: ball.x / gameWidth,
                y: ball.y / gameHeight,
                vx: ball.vx,
                vy: ball.vy,
                lastKicker: ball.lastKicker
            });
        }
        
        function resetBall() {
            ball.x = gameWidth / 2;
            ball.y = gameHeight / 2;
            ball.vx = 0;
            ball.vy = 0;
            ball.lastKicker = null;
            
            if (gameRef && isHost) {
                gameRef.child('ball').set({
                    x: 0.5,
                    y: 0.5,
                    vx: 0,
                    vy: 0,
                    lastKicker: null
                });
            }
        }
        
        function gameLoop() {
            if (!gameStarted) return;
            
            // Enviar posición del jugador (normalizada 0-1)
            if (gameRef && myPlayerKey) {
                gameRef.child(myPlayerKey).update({
                    x: players.you.x / gameWidth,
                    y: players.you.y / gameHeight
                });
            }
            
            // Verificar colisión
            checkBallCollision();
            
            // Si soy host, actualizar física
            if (isHost) {
                updateBallHost();
            }
            
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, gameWidth, gameHeight);
            
            // Fondo
            ctx.fillStyle = '#1a1a3e';
            ctx.fillRect(0, 0, gameWidth, gameHeight);
            
            // Línea central
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, gameHeight / 2);
            ctx.lineTo(gameWidth, gameHeight / 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Círculo central
            ctx.strokeStyle = '#2a2a4e';
            ctx.beginPath();
            ctx.arc(gameWidth / 2, gameHeight / 2, 60, 0, Math.PI * 2);
            ctx.stroke();
            
            // Porterías
            ctx.fillStyle = 'rgba(255, 68, 68, 0.5)';
            ctx.fillRect(0, 0, gameWidth, GOAL_HEIGHT);
            
            ctx.fillStyle = 'rgba(0, 255, 136, 0.5)';
            ctx.fillRect(0, gameHeight - GOAL_HEIGHT, gameWidth, GOAL_HEIGHT);
            
            // Pelota
            const gradient = ctx.createRadialGradient(
                ball.x - 5, ball.y - 5, 0,
                ball.x, ball.y, BALL_RADIUS
            );
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#ffd700');
            
            ctx.fillStyle = gradient;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Jugador local
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(players.you.x, players.you.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Oponente
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(players.opponent.x, players.opponent.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Nombres
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(players.you.name, players.you.x, players.you.y - PLAYER_RADIUS - 10);
            ctx.fillText(players.opponent.name, players.opponent.x, players.opponent.y - PLAYER_RADIUS - 10);
        }
        
        function updateUI() {
            document.getElementById('yourName').textContent = players.you.name;
            document.getElementById('opponentName').textContent = players.opponent.name;
            document.getElementById('yourScore').textContent = players.you.score;
            document.getElementById('opponentScore').textContent = players.opponent.score;
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            gameWidth = container.clientWidth;
            gameHeight = container.clientHeight;
            canvas.width = gameWidth;
            canvas.height = gameHeight;
        }
        
        function endGame(disconnected = false) {
            gameStarted = false;
            
            if (disconnected) {
                document.getElementById('resultTitle').textContent = '👋 Oponente desconectado';
                document.getElementById('resultDetails').innerHTML = 'La partida ha terminado';
                playSound('lose');
            } else {
                const winner = players.you.score > players.opponent.score ? 
                    players.you.name : 
                    players.opponent.score > players.you.score ? 
                    players.opponent.name : 'Empate';
                
                document.getElementById('resultTitle').textContent = 
                    winner === 'Empate' ? '🤝 ¡Empate!' : 
                    winner === players.you.name ? '🏆 ¡Victoria!' : '😢 ¡Derrota!';
                
                document.getElementById('resultDetails').innerHTML = `
                    ${players.you.name}: ${players.you.score} goles<br>
                    ${players.opponent.name}: ${players.opponent.score} goles
                `;
                
                if (winner === players.you.name) playSound('win');
                else if (winner !== 'Empate') playSound('lose');
            }
            
            document.getElementById('resultModal').classList.add('active');
            
            if (gameRef && isHost) {
                gameRef.remove();
            }
        }
        
        function showNotification(title, message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.borderColor = type === 'error' ? '#ff4444' : '#00ff88';
            notification.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        // ============ CONTROLES ============
        function setupControls() {
            const canvas = document.getElementById('canvas');
            const joystickBase = document.getElementById('joystickBase');
            const joystickStick = document.getElementById('joystickStick');
            
            // Mouse
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                updatePlayerPosition(e.clientX - rect.left, e.clientY - rect.top);
            });
            
            // Touch directo
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                updatePlayerPosition(touch.clientX - rect.left, touch.clientY - rect.top);
            }, { passive: false });
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                updatePlayerPosition(touch.clientX - rect.left, touch.clientY - rect.top);
            }, { passive: false });
            
            // Joystick para móvil
            if (window.innerWidth <= 768) {
                joystickBase.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    joystickActive = true;
                    updateJoystick(e);
                });
                
                joystickBase.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (joystickActive) updateJoystick(e);
                });
                
                joystickBase.addEventListener('touchend', (e) => {
                    joystickActive = false;
                    joystickStick.style.transform = 'translate(-50%, -50%)';
                    joystickX = 0;
                    joystickY = 0;
                });
            }
        }
        
        function updateJoystick(e) {
            const touch = e.touches[0];
            const base = document.getElementById('joystickBase');
            const stick = document.getElementById('joystickStick');
            const rect = base.getBoundingClientRect();
            
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            
            const maxDist = rect.width / 2 - 25;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            
            stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            
            joystickX = dx / maxDist;
            joystickY = dy / maxDist;
            
            // Mover jugador con joystick
            const speed = 5;
            let newX = players.you.x + joystickX * speed;
            let newY = players.you.y + joystickY * speed;
            
            updatePlayerPosition(newX, newY);
        }
        
        function updatePlayerPosition(x, y) {
            // Restringir a la mitad de la cancha
            x = Math.max(PLAYER_RADIUS, Math.min(gameWidth - PLAYER_RADIUS, x));
            
            if (isHost) {
                y = Math.max(gameHeight / 2 + PLAYER_RADIUS, Math.min(gameHeight - GOAL_HEIGHT - PLAYER_RADIUS, y));
            } else {
                y = Math.max(GOAL_HEIGHT + PLAYER_RADIUS, Math.min(gameHeight / 2 - PLAYER_RADIUS, y));
            }
            
            players.you.x = x;
            players.you.y = y;
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            window.addEventListener('resize', () => {
                if (gameStarted) resizeCanvas();
            });
        });
    </script>
</body>
</html>
