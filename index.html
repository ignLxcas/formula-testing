<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Ball Rush - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .ball-animation {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px;
        }

        .option-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(45deg, #ff6b35, #f7c948); color: #0a0a1a; }
        .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 2px solid var(--border); }

        .input-group { margin: 10px 0; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin: 10px 0;
        }

        .code-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
        }

        .player-info { display: flex; align-items: center; gap: 8px; flex: 1; }
        .player-info.opponent { justify-content: flex-end; }

        .player-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
        }

        .player-name { font-size: 0.8rem; font-weight: bold; }
        .player-score { font-size: 1.5rem; color: var(--gold); font-weight: bold; }

        .timer-display { text-align: center; padding: 0 15px; }
        .timer-text { font-size: 2rem; font-weight: bold; color: var(--gold); }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 90%;
            width: 350px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="connection-screen" id="connectionScreen">
        <div class="ball-animation">⚽</div>
        <h1 class="game-title">Ball Rush</h1>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15" class="input-group" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--bg-primary);color:var(--text-primary);text-align:center;">
                <button class="btn btn-primary" onclick="createGame()">Crear Sala</button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="text-align:center;color:var(--text-secondary);">Esperando oponente...</p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--bg-primary);color:var(--text-primary);text-align:center;margin-bottom:10px;">
                <input type="text" id="gameCode" placeholder="Código" maxlength="6" oninput="this.value=this.value.toUpperCase()" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--bg-primary);color:var(--text-primary);text-align:center;margin-bottom:10px;">
                <button class="btn btn-secondary" onclick="joinGame()">Unirse</button>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar">😊</div>
                <div>
                    <div class="player-name" id="yourName">Tú</div>
                    <div class="player-score" id="yourScore">0</div>
                </div>
            </div>
            <div class="timer-display"><div class="timer-text" id="timerText">60</div></div>
            <div class="player-info opponent">
                <div style="text-align:right;">
                    <div class="player-name" id="opponentName">Oponente</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
                <div class="player-avatar">😎</div>
            </div>
        </div>
        <div class="game-canvas-container"><canvas class="game-canvas" id="canvas"></canvas></div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="font-size:1.8rem;margin-bottom:15px;"></h2>
            <div id="resultDetails" style="margin-bottom:20px;"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Configuración
        const GAME_TIME = 60;
        const BALL_R = 15;
        const PLAYER_R = 30;
        const GOAL_H = 50;
        
        let canvas, ctx, W, H;
        let gameRef, gameCode, myKey, isHost;
        let gameActive = false;
        
        // Estado local
        const my = { x: 0, y: 0, score: 0, name: '' };
        const opp = { x: 0, y: 0, score: 0, name: '' };
        const ball = { x: 0, y: 0, vx: 0, vy: 0 };
        
        function createGame() {
            const name = document.getElementById('playerName').value || 'Jugador 1';
            my.name = name;
            isHost = true;
            myKey = 'host';
            gameCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            document.getElementById('yourName').textContent = name;
            
            gameRef = db.ref('games/' + gameCode);
            gameRef.set({
                host: { name, x: 0.5, y: 0.75, score: 0 },
                opponent: { name: '', x: 0.5, y: 0.25, score: 0, connected: false },
                ball: { x: 0.5, y: 0.5, vx: 0, vy: 0 },
                active: true
            });
            
            // Escuchar cambios del oponente
            gameRef.child('opponent').on('value', snap => {
                const d = snap.val();
                if (d && d.connected) {
                    opp.name = d.name || 'Oponente';
                    opp.x = d.x * W;
                    opp.y = d.y * H;
                    opp.score = d.score || 0;
                    document.getElementById('opponentName').textContent = opp.name;
                    document.getElementById('opponentScore').textContent = opp.score;
                    if (!gameActive) startGame();
                }
            });
            
            // Escuchar pelota
            gameRef.child('ball').on('value', snap => {
                const d = snap.val();
                if (d && gameActive) {
                    ball.x = d.x * W;
                    ball.y = d.y * H;
                    ball.vx = d.vx || 0;
                    ball.vy = d.vy || 0;
                }
            });
        }
        
        function joinGame() {
            const name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const code = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!code) { alert('Ingresa el código'); return; }
            
            my.name = name;
            isHost = false;
            myKey = 'opponent';
            gameCode = code;
            
            document.getElementById('yourName').textContent = name;
            
            gameRef = db.ref('games/' + code);
            
            gameRef.once('value', snap => {
                if (!snap.exists()) { alert('Partida no encontrada'); return; }
                
                gameRef.child('opponent').update({
                    name, x: 0.5, y: 0.25, score: 0, connected: true
                });
                
                // Escuchar host
                gameRef.child('host').on('value', snap => {
                    const d = snap.val();
                    if (d) {
                        opp.name = d.name || 'Oponente';
                        opp.x = d.x * W;
                        opp.y = d.y * H;
                        opp.score = d.score || 0;
                        document.getElementById('opponentName').textContent = opp.name;
                        document.getElementById('opponentScore').textContent = opp.score;
                    }
                });
                
                // Escuchar pelota
                gameRef.child('ball').on('value', snap => {
                    const d = snap.val();
                    if (d && gameActive) {
                        ball.x = d.x * W;
                        ball.y = d.y * H;
                        ball.vx = d.vx || 0;
                        ball.vy = d.vy || 0;
                    }
                });
                
                // Escuchar inicio
                gameRef.child('active').on('value', snap => {
                    if (snap.val() === true && !gameActive) startGame();
                });
            });
        }
        
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            
            // Posiciones iniciales
            ball.x = W / 2;
            ball.y = H / 2;
            
            if (isHost) {
                my.x = W / 2;
                my.y = H * 0.75;
                opp.x = W / 2;
                opp.y = H * 0.25;
                
                gameRef.update({ active: true });
                
                // Timer
                let time = GAME_TIME;
                const timer = setInterval(() => {
                    if (!gameActive) { clearInterval(timer); return; }
                    time--;
                    document.getElementById('timerText').textContent = time;
                    if (time <= 0) {
                        clearInterval(timer);
                        endGame();
                    }
                }, 1000);
                
                // Física (solo host)
                setInterval(() => {
                    if (!gameActive) return;
                    
                    // Fricción
                    ball.vx *= 0.97;
                    ball.vy *= 0.97;
                    
                    // Mover
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    
                    // Paredes
                    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx) * 0.7; }
                    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx) * 0.7; }
                    
                    // Goles
                    if (ball.y < BALL_R) {
                        // Gol para host
                        my.score++;
                        document.getElementById('yourScore').textContent = my.score;
                        gameRef.child('host/score').set(my.score);
                        resetBall();
                    }
                    if (ball.y > H - BALL_R) {
                        // Gol para oponente
                        opp.score++;
                        document.getElementById('opponentScore').textContent = opp.score;
                        gameRef.child('opponent/score').set(opp.score);
                        resetBall();
                    }
                    
                    // Enviar pelota
                    gameRef.child('ball').update({
                        x: ball.x / W,
                        y: ball.y / H,
                        vx: ball.vx,
                        vy: ball.vy
                    });
                }, 30);
            } else {
                my.x = W / 2;
                my.y = H * 0.25;
                opp.x = W / 2;
                opp.y = H * 0.75;
            }
            
            gameActive = true;
            gameLoop();
        }
        
        function resetBall() {
            ball.x = W / 2;
            ball.y = H / 2;
            ball.vx = 0;
            ball.vy = 0;
            gameRef.child('ball').set({ x: 0.5, y: 0.5, vx: 0, vy: 0 });
        }
        
        function checkCollision() {
            const dx = my.x - ball.x;
            const dy = my.y - ball.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < PLAYER_R + BALL_R) {
                const angle = Math.atan2(dy, dx);
                const force = 8;
                ball.vx = Math.cos(angle) * force;
                ball.vy = Math.sin(angle) * force;
                
                // Separar
                const overlap = PLAYER_R + BALL_R - dist;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                
                // Enviar inmediatamente
                gameRef.child('ball').set({
                    x: ball.x / W,
                    y: ball.y / H,
                    vx: ball.vx,
                    vy: ball.vy
                });
            }
        }
        
        function gameLoop() {
            if (!gameActive) return;
            
            // Enviar mi posición
            gameRef.child(myKey).update({ x: my.x / W, y: my.y / H });
            
            // Colisión
            checkCollision();
            
            // Render
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, W, H);
            
            // Fondo
            ctx.fillStyle = '#1a1a3e';
            ctx.fillRect(0, 0, W, H);
            
            // Línea central
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, H/2);
            ctx.lineTo(W, H/2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Círculo central
            ctx.beginPath();
            ctx.arc(W/2, H/2, 60, 0, Math.PI*2);
            ctx.stroke();
            
            // Porterías
            ctx.fillStyle = 'rgba(255,68,68,0.5)';
            ctx.fillRect(0, 0, W, GOAL_H);
            ctx.fillStyle = 'rgba(0,255,136,0.5)';
            ctx.fillRect(0, H-GOAL_H, W, GOAL_H);
            
            // Pelota
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
            ctx.fill();
            
            // Mi jugador
            ctx.fillStyle = '#00ff88';
            ctx.beginPath();
            ctx.arc(my.x, my.y, PLAYER_R, 0, Math.PI*2);
            ctx.fill();
            
            // Oponente
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(opp.x, opp.y, PLAYER_R, 0, Math.PI*2);
            ctx.fill();
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            W = container.clientWidth;
            H = container.clientHeight;
            canvas.width = W;
            canvas.height = H;
        }
        
        function endGame() {
            gameActive = false;
            const winner = my.score > opp.score ? 'Tú' : opp.score > my.score ? 'Oponente' : 'Empate';
            document.getElementById('resultTitle').textContent = winner === 'Empate' ? '🤝 Empate' : winner === 'Tú' ? '🏆 ¡Victoria!' : '😢 Derrota';
            document.getElementById('resultDetails').innerHTML = `Tú: ${my.score} - Oponente: ${opp.score}`;
            document.getElementById('resultModal').classList.add('active');
            if (isHost) gameRef.remove();
        }
        
        // Controles
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function move(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;
                
                x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, x));
                
                if (isHost) {
                    y = Math.max(H/2, Math.min(H - GOAL_H - PLAYER_R, y));
                } else {
                    y = Math.max(GOAL_H + PLAYER_R, Math.min(H/2, y));
                }
                
                my.x = x;
                my.y = y;
            }
            
            canvas.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            canvas.addEventListener('mousedown', e => move(e.clientX, e.clientY));
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = e.touches[0];
                move(t.clientX, t.clientY);
            }, { passive: false });
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.touches[0];
                move(t.clientX, t.clientY);
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            window.addEventListener('resize', () => {
                if (gameActive) resizeCanvas();
            });
        });
    </script>
</body>
</html>
