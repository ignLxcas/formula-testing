<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Ball Rush - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .ball-animation {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px;
        }

        .option-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            color: #0a0a1a;
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .input-group { margin: 10px 0; }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin: 10px 0;
        }

        .code-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .player-info.opponent { justify-content: flex-end; }

        .player-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
        }

        .player-avatar.you { border-color: var(--success); }
        .player-avatar.opponent { border-color: var(--danger); }

        .player-name { font-size: 0.8rem; font-weight: bold; }
        .player-score { font-size: 1.2rem; color: var(--gold); font-weight: bold; }

        .timer-display { text-align: center; padding: 0 15px; }
        .timer-text { font-size: 2rem; font-weight: bold; color: var(--gold); }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px 20px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 90%;
            width: 350px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="connection-screen" id="connectionScreen">
        <div class="ball-animation">⚽</div>
        <h1 class="game-title">Ball Rush</h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">¡Empuja la pelota hacia la portería!</p>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <div class="input-group">
                    <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                </div>
                <button class="btn btn-primary" onclick="createGame()">Crear Sala</button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <p style="color: var(--text-secondary); font-size: 0.8rem;">Código:</p>
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="color: var(--text-secondary); text-align: center;">Esperando oponente...</p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <div class="input-group">
                    <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                </div>
                <div class="input-group">
                    <input type="text" id="gameCode" placeholder="Código" maxlength="6" 
                           oninput="this.value = this.value.toUpperCase()">
                </div>
                <button class="btn btn-secondary" onclick="joinGame()">Unirse</button>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar you">😊</div>
                <div>
                    <div class="player-name" id="yourName">Tú</div>
                    <div class="player-score" id="yourScore">0</div>
                </div>
            </div>
            
            <div class="timer-display">
                <div class="timer-text" id="timerText">60</div>
            </div>
            
            <div class="player-info opponent">
                <div style="text-align: right;">
                    <div class="player-name" id="opponentName">Oponente</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
                <div class="player-avatar opponent">😎</div>
            </div>
        </div>
        
        <div class="game-canvas-container">
            <canvas class="game-canvas" id="canvas"></canvas>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="font-size: 1.8rem; margin-bottom: 15px;"></h2>
            <div id="resultDetails" style="margin-bottom: 20px;"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        // ============ CONFIGURACIÓN DE FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ============ CONFIGURACIÓN DEL JUEGO ============
        const GAME_DURATION = 60;
        const BALL_RADIUS = 15;
        const PLAYER_RADIUS = 25;
        const GOAL_HEIGHT = 40;
        const KICK_FORCE = 10;
        
        let gameCode = null;
        let isHost = false;
        let gameRef = null;
        let gameStarted = false;
        let canvas, ctx;
        let gameWidth, gameHeight;
        let myPlayerKey = null;
        let myScore = 0;
        let opponentScore = 0;
        
        const ball = { x: 0, y: 0, vx: 0, vy: 0 };
        const myPlayer = { x: 0, y: 0 };
        const opponentPlayer = { x: 0, y: 0 };
        let timeLeft = GAME_DURATION;
        
        // ============ CONEXIÓN ============
        function createGame() {
            const name = document.getElementById('playerName').value || 'Jugador 1';
            isHost = true;
            myPlayerKey = 'host';
            gameCode = generateCode();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            document.getElementById('yourName').textContent = name;
            
            gameRef = database.ref('games/' + gameCode);
            
            gameRef.set({
                host: { name: name, x: 0.5, y: 0.8, score: 0, connected: true },
                opponent: { name: '', x: 0.5, y: 0.2, score: 0, connected: false },
                ball: { x: 0.5, y: 0.5, vx: 0, vy: 0 },
                started: false,
                timeLeft: GAME_DURATION
            });
            
            console.log('Sala creada:', gameCode);
            
            // Escuchar oponente
            gameRef.child('opponent').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.connected) {
                    document.getElementById('opponentName').textContent = data.name || 'Oponente';
                    if (data.x !== undefined) {
                        opponentPlayer.x = data.x * gameWidth;
                        opponentPlayer.y = data.y * gameHeight;
                    }
                    if (data.score !== undefined) {
                        opponentScore = data.score;
                        document.getElementById('opponentScore').textContent = opponentScore;
                    }
                    if (!gameStarted) {
                        startGame();
                    }
                }
            });
            
            // Escuchar pelota
            gameRef.child('ball').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    ball.x = data.x * gameWidth;
                    ball.y = data.y * gameHeight;
                    ball.vx = data.vx || 0;
                    ball.vy = data.vy || 0;
                }
            });
        }
        
        function joinGame() {
            const name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const code = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!code || code.length !== 6) {
                alert('Ingresa un código válido de 6 caracteres');
                return;
            }
            
            isHost = false;
            myPlayerKey = 'opponent';
            gameCode = code;
            
            document.getElementById('yourName').textContent = name;
            
            gameRef = database.ref('games/' + code);
            
            gameRef.once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    alert('No se encontró la partida');
                    return;
                }
                
                // Unirse
                gameRef.child('opponent').update({
                    name: name,
                    x: 0.5,
                    y: 0.2,
                    score: 0,
                    connected: true
                });
                
                console.log('Unido a sala:', code);
                
                // Escuchar host
                gameRef.child('host').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('opponentName').textContent = data.name || 'Oponente';
                        if (data.x !== undefined) {
                            opponentPlayer.x = data.x * gameWidth;
                            opponentPlayer.y = data.y * gameHeight;
                        }
                        if (data.score !== undefined) {
                            opponentScore = data.score;
                            document.getElementById('opponentScore').textContent = opponentScore;
                        }
                    }
                });
                
                // Escuchar pelota
                gameRef.child('ball').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        ball.x = data.x * gameWidth;
                        ball.y = data.y * gameHeight;
                        ball.vx = data.vx || 0;
                        ball.vy = data.vy || 0;
                    }
                });
                
                // Escuchar inicio
                gameRef.child('started').on('value', (snapshot) => {
                    if (snapshot.val() === true && !gameStarted) {
                        startGame();
                    }
                });
            });
        }
        
        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }
        
        // ============ JUEGO ============
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            
            // Posiciones iniciales
            ball.x = gameWidth / 2;
            ball.y = gameHeight / 2;
            
            if (isHost) {
                myPlayer.x = gameWidth / 2;
                myPlayer.y = gameHeight * 0.8;
                opponentPlayer.x = gameWidth / 2;
                opponentPlayer.y = gameHeight * 0.2;
                
                gameRef.update({
                    started: true,
                    timeLeft: GAME_DURATION,
                    ball: { x: 0.5, y: 0.5, vx: 0, vy: 0 }
                });
                
                // Timer
                const timer = setInterval(() => {
                    if (!gameStarted) {
                        clearInterval(timer);
                        return;
                    }
                    timeLeft--;
                    document.getElementById('timerText').textContent = timeLeft;
                    gameRef.child('timeLeft').set(timeLeft);
                    
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        endGame();
                    }
                }, 1000);
                
                // Física de la pelota
                setInterval(() => {
                    if (!gameStarted) return;
                    updateBallPhysics();
                    
                    // Enviar posición de la pelota
                    gameRef.child('ball').update({
                        x: ball.x / gameWidth,
                        y: ball.y / gameHeight,
                        vx: ball.vx,
                        vy: ball.vy
                    });
                }, 16);
            } else {
                myPlayer.x = gameWidth / 2;
                myPlayer.y = gameHeight * 0.2;
                opponentPlayer.x = gameWidth / 2;
                opponentPlayer.y = gameHeight * 0.8;
            }
            
            gameStarted = true;
            timeLeft = GAME_DURATION;
            
            // Loop del juego
            gameLoop();
        }
        
        function updateBallPhysics() {
            // Fricción
            ball.vx *= 0.98;
            ball.vy *= 0.98;
            
            // Mover
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // Rebotes laterales
            if (ball.x < BALL_RADIUS) {
                ball.x = BALL_RADIUS;
                ball.vx = Math.abs(ball.vx) * 0.8;
            }
            if (ball.x > gameWidth - BALL_RADIUS) {
                ball.x = gameWidth - BALL_RADIUS;
                ball.vx = -Math.abs(ball.vx) * 0.8;
            }
            
            // Gol arriba (para host)
            if (ball.y < BALL_RADIUS) {
                myScore++;
                document.getElementById('yourScore').textContent = myScore;
                gameRef.child('host/score').set(myScore);
                resetBall();
            }
            
            // Gol abajo (para oponente)
            if (ball.y > gameHeight - BALL_RADIUS) {
                opponentScore++;
                document.getElementById('opponentScore').textContent = opponentScore;
                gameRef.child('opponent/score').set(opponentScore);
                resetBall();
            }
        }
        
        function resetBall() {
            ball.x = gameWidth / 2;
            ball.y = gameHeight / 2;
            ball.vx = 0;
            ball.vy = 0;
            
            gameRef.child('ball').set({
                x: 0.5,
                y: 0.5,
                vx: 0,
                vy: 0
            });
        }
        
        function checkBallCollision() {
            const dx = myPlayer.x - ball.x;
            const dy = myPlayer.y - ball.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < PLAYER_RADIUS + BALL_RADIUS) {
                const angle = Math.atan2(dy, dx);
                ball.vx = Math.cos(angle) * KICK_FORCE;
                ball.vy = Math.sin(angle) * KICK_FORCE;
                
                // Separar
                const overlap = PLAYER_RADIUS + BALL_RADIUS - distance;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                
                // Enviar inmediatamente
                gameRef.child('ball').set({
                    x: ball.x / gameWidth,
                    y: ball.y / gameHeight,
                    vx: ball.vx,
                    vy: ball.vy
                });
            }
        }
        
        function gameLoop() {
            if (!gameStarted) return;
            
            // Enviar posición del jugador
            gameRef.child(myPlayerKey).update({
                x: myPlayer.x / gameWidth,
                y: myPlayer.y / gameHeight
            });
            
            // Verificar colisión
            checkBallCollision();
            
            // Renderizar
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, gameWidth, gameHeight);
            
            // Fondo
            ctx.fillStyle = '#1a1a3e';
            ctx.fillRect(0, 0, gameWidth, gameHeight);
            
            // Línea central
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, gameHeight / 2);
            ctx.lineTo(gameWidth, gameHeight / 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Círculo central
            ctx.strokeStyle = '#2a2a4e';
            ctx.beginPath();
            ctx.arc(gameWidth / 2, gameHeight / 2, 60, 0, Math.PI * 2);
            ctx.stroke();
            
            // Porterías
            ctx.fillStyle = 'rgba(255, 68, 68, 0.5)';
            ctx.fillRect(0, 0, gameWidth, GOAL_HEIGHT);
            
            ctx.fillStyle = 'rgba(0, 255, 136, 0.5)';
            ctx.fillRect(0, gameHeight - GOAL_HEIGHT, gameWidth, GOAL_HEIGHT);
            
            // Pelota
            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Mi jugador
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(myPlayer.x, myPlayer.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Oponente
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(opponentPlayer.x, opponentPlayer.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            gameWidth = container.clientWidth;
            gameHeight = container.clientHeight;
            canvas.width = gameWidth;
            canvas.height = gameHeight;
        }
        
        function endGame() {
            gameStarted = false;
            
            const winner = myScore > opponentScore ? 'Tú' : 
                          opponentScore > myScore ? 'Oponente' : 'Empate';
            
            document.getElementById('resultTitle').textContent = 
                winner === 'Empate' ? '🤝 ¡Empate!' : 
                winner === 'Tú' ? '🏆 ¡Victoria!' : '😢 ¡Derrota!';
            
            document.getElementById('resultDetails').innerHTML = `
                Tú: ${myScore} goles<br>
                Oponente: ${opponentScore} goles
            `;
            
            document.getElementById('resultModal').classList.add('active');
            
            if (isHost) {
                gameRef.remove();
            }
        }
        
        // ============ CONTROLES SIMPLES ============
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function handleMove(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;
                
                // Restringir
                x = Math.max(PLAYER_RADIUS, Math.min(gameWidth - PLAYER_RADIUS, x));
                
                if (isHost) {
                    y = Math.max(gameHeight / 2, Math.min(gameHeight - GOAL_HEIGHT, y));
                } else {
                    y = Math.max(GOAL_HEIGHT, Math.min(gameHeight / 2, y));
                }
                
                myPlayer.x = x;
                myPlayer.y = y;
            }
            
            // Mouse
            canvas.addEventListener('mousemove', (e) => {
                handleMove(e.clientX, e.clientY);
            });
            
            canvas.addEventListener('mousedown', (e) => {
                handleMove(e.clientX, e.clientY);
            });
            
            // Touch - arrastrar el dedo
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }, { passive: false });
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            window.addEventListener('resize', () => {
                if (gameStarted) resizeCanvas();
            });
        });
    </script>
</body>
</html>
