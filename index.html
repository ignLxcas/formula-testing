<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Ball Rush - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #1a1a3e;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --accent2: #f7c948;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --info: #4488ff;
            --purple: #9944ff;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
            --glow: rgba(255, 107, 53, 0.5);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============ CONEXIÓN ============ */
        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .ball-animation {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1.5s infinite;
            filter: drop-shadow(0 0 30px var(--glow));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(90deg); }
            50% { transform: translateY(0) rotate(180deg); }
            75% { transform: translateY(-15px) rotate(270deg); }
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            text-shadow: 0 0 30px var(--glow);
        }

        .game-subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
            text-align: center;
            font-size: 1.1rem;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .option-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.2);
        }

        .option-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--accent), var(--accent2));
            color: #0a0a1a;
            box-shadow: 0 5px 30px var(--glow);
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
        }

        .input-group {
            margin: 15px 0;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--glow);
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
        }

        .code-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* ============ JUEGO ============ */
        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .game-screen.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .player-info.opponent {
            justify-content: flex-end;
        }

        .player-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: var(--bg-primary);
            border: 3px solid var(--border);
            position: relative;
        }

        .player-avatar.you {
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .player-avatar.opponent {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .player-details {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .player-score {
            font-size: 1.2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .timer-display {
            text-align: center;
            padding: 0 20px;
            position: relative;
        }

        .timer-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .timer-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Notificaciones */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 20px 30px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(10px);
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .notification.success { border-color: var(--success); }
        .notification.error { border-color: var(--danger); }
        .notification.info { border-color: var(--info); }

        .notification h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .notification p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            max-width: 90%;
            width: 400px;
            text-align: center;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 480px) {
            .game-title { font-size: 2rem; }
            .ball-animation { font-size: 4rem; }
            .code-text { font-size: 2rem; letter-spacing: 3px; }
            .player-avatar { width: 35px; height: 35px; font-size: 1.2rem; }
            .timer-text { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <!-- Conexión -->
    <div class="connection-screen" id="connectionScreen">
        <div class="ball-animation">⚽</div>
        <h1 class="game-title">Ball Rush</h1>
        <p class="game-subtitle">¡Empuja la pelota hacia tu portería!</p>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <div class="input-group">
                    <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                </div>
                <button class="btn btn-primary" onclick="createGame()">
                    Crear Sala
                </button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <p style="color: var(--text-secondary); margin-bottom: 10px;">Comparte este código:</p>
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="color: var(--text-secondary); text-align: center;">
                        Esperando oponente...
                    </p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <div class="input-group">
                    <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                </div>
                <div class="input-group">
                    <input type="text" id="gameCode" placeholder="Código de 6 dígitos" maxlength="6" 
                           oninput="this.value = this.value.toUpperCase()">
                </div>
                <button class="btn btn-secondary" onclick="joinGame()">
                    Unirse
                </button>
            </div>
        </div>
    </div>

    <!-- Juego -->
    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar you">😊</div>
                <div class="player-details">
                    <div class="player-name" id="yourName">Tú</div>
                    <div class="player-score" id="yourScore">0</div>
                </div>
            </div>
            
            <div class="timer-display">
                <div class="timer-text" id="timerText">60</div>
                <div class="timer-label">Segundos</div>
            </div>
            
            <div class="player-info opponent">
                <div class="player-details">
                    <div class="player-name" id="opponentName">Oponente</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
                <div class="player-avatar opponent">😎</div>
            </div>
        </div>
        
        <div class="game-canvas-container">
            <canvas class="game-canvas" id="canvas"></canvas>
        </div>
    </div>

    <!-- Modal Resultado -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="font-size: 2rem; margin-bottom: 20px;"></h2>
            <div id="resultDetails" style="margin-bottom: 30px;"></div>
            <button class="btn btn-primary" onclick="location.reload()">
                Jugar de Nuevo
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <script>
        // ============ CONFIGURACIÓN ============
        const GAME_DURATION = 60;
        const BALL_RADIUS = 20;
        const PLAYER_SIZE = 40;
        const GOAL_WIDTH = 150;
        const GOAL_HEIGHT = 30;
        const BALL_SPEED = 0.9;
        const FRICTION = 0.98;
        const PUSH_FORCE = 0.3;

        let peer = null;
        let connection = null;
        let isHost = false;
        let gameStarted = false;
        let gameLoopId = null;
        let timerInterval = null;
        let canvas, ctx;
        let gameWidth, gameHeight;

        const players = {
            you: { x: 0, y: 0, score: 0, name: 'Tú', color: '#00ff88' },
            opponent: { x: 0, y: 0, score: 0, name: 'Oponente', color: '#ff4444' }
        };

        const ball = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            radius: BALL_RADIUS
        };

        let timeLeft = GAME_DURATION;
        let particles = [];

        // ============ CONEXIÓN ============
        function createGame() {
            const name = document.getElementById('playerName').value || 'Jugador 1';
            players.you.name = name;
            isHost = true;
            
            const gameCode = generateCode();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            
            initializePeer(gameCode);
        }

        function joinGame() {
            const name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const gameCode = document.getElementById('gameCode').value.trim();
            
            if (!gameCode || gameCode.length !== 6) {
                showNotification('Código inválido', 'Ingresa un código de 6 dígitos', 'error');
                return;
            }
            
            players.you.name = name;
            isHost = false;
            
            initializePeer(gameCode);
        }

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function initializePeer(gameCode) {
            const peerId = `ball-${gameCode}-${isHost ? 'host' : 'player'}`;
            
            peer = new Peer(peerId);
            
            peer.on('open', () => {
                if (!isHost) {
                    connectToHost(gameCode);
                }
            });
            
            peer.on('connection', (conn) => {
                connection = conn;
                setupConnection();
                showNotification('¡Oponente conectado!', '¡Que comience el juego!', 'success');
                startGame();
            });
            
            peer.on('error', (error) => {
                console.error('Error:', error);
                showNotification('Error de conexión', error.type, 'error');
            });
        }

        function connectToHost(gameCode) {
            const hostId = `ball-${gameCode}-host`;
            connection = peer.connect(hostId, { reliable: true });
            setupConnection();
        }

        function setupConnection() {
            connection.on('open', () => {
                if (!isHost) {
                    startGame();
                }
            });
            
            connection.on('data', handleData);
            
            connection.on('close', () => {
                showNotification('Oponente desconectado', 'Fin de la partida', 'error');
                endGame(true);
            });
        }

        function handleData(data) {
            switch(data.type) {
                case 'position':
                    players.opponent.x = data.x;
                    players.opponent.y = data.y;
                    break;
                    
                case 'ball':
                    ball.x = data.x;
                    ball.y = data.y;
                    ball.vx = data.vx;
                    ball.vy = data.vy;
                    break;
                    
                case 'score':
                    players.opponent.score = data.score;
                    updateUI();
                    break;
                    
                case 'particles':
                    spawnParticles(data.x, data.y, data.color);
                    break;
                    
                case 'gameStart':
                    gameStarted = true;
                    break;
                    
                case 'gameEnd':
                    endGame(false, data.winner);
                    break;
            }
        }

        function sendData(data) {
            if (connection && connection.open) {
                connection.send(data);
            }
        }

        // ============ JUEGO ============
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            
            // Posiciones iniciales
            players.you.x = gameWidth / 2;
            players.you.y = gameHeight - 50;
            players.opponent.x = gameWidth / 2;
            players.opponent.y = 50;
            
            ball.x = gameWidth / 2;
            ball.y = gameHeight / 2;
            ball.vx = 0;
            ball.vy = 0;
            
            gameStarted = true;
            timeLeft = GAME_DURATION;
            
            if (isHost) {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerText').textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        endGame(false);
                    }
                }, 1000);
            }
            
            sendData({ type: 'gameStart' });
            gameLoop();
        }

        function updateBall() {
            // Aplicar fricción
            ball.vx *= FRICTION;
            ball.vy *= FRICTION;
            
            // Actualizar posición
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // Rebote en paredes
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx = Math.abs(ball.vx) * 0.8;
                spawnParticles(ball.x, ball.y, '#ffd700');
            }
            if (ball.x + ball.radius > gameWidth) {
                ball.x = gameWidth - ball.radius;
                ball.vx = -Math.abs(ball.vx) * 0.8;
                spawnParticles(ball.x, ball.y, '#ffd700');
            }
            
            // Verificar goles
            if (ball.y + ball.radius > gameHeight) {
                // Gol para el jugador de abajo
                players.you.score++;
                updateUI();
                sendData({ type: 'score', score: players.you.score });
                resetBall();
                spawnParticles(gameWidth / 2, gameHeight / 2, '#00ff88');
            }
            
            if (ball.y - ball.radius < 0) {
                // Gol para el jugador de arriba
                players.opponent.score++;
                updateUI();
                sendData({ type: 'score', score: players.opponent.score });
                resetBall();
                spawnParticles(gameWidth / 2, gameHeight / 2, '#ff4444');
            }
            
            // Enviar posición de la pelota
            if (isHost) {
                sendData({
                    type: 'ball',
                    x: ball.x,
                    y: ball.y,
                    vx: ball.vx,
                    vy: ball.vy
                });
            }
        }

        function resetBall() {
            ball.x = gameWidth / 2;
            ball.y = gameHeight / 2;
            ball.vx = 0;
            ball.vy = 0;
        }

        function checkBallCollision() {
            // Colisión con jugador local
            const dx = players.you.x - ball.x;
            const dy = players.you.y - ball.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < PLAYER_SIZE / 2 + BALL_RADIUS) {
                // Empujar la pelota
                const angle = Math.atan2(dy, dx);
                ball.vx += Math.cos(angle) * PUSH_FORCE;
                ball.vy += Math.sin(angle) * PUSH_FORCE;
                
                // Separar la pelota del jugador
                const overlap = PLAYER_SIZE / 2 + BALL_RADIUS - distance;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                
                spawnParticles(ball.x, ball.y, '#00ff88');
            }
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function updateParticles() {
            particles.forEach(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.03;
                particle.vy += 0.2; // Gravedad
            });
            
            particles = particles.filter(p => p.life > 0);
        }

        function gameLoop() {
            if (!gameStarted) return;
            
            // Enviar posición
            sendData({
                type: 'position',
                x: players.you.x,
                y: players.you.y
            });
            
            checkBallCollision();
            
            if (isHost) {
                updateBall();
            }
            
            updateParticles();
            render();
            
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function render() {
            ctx.clearRect(0, 0, gameWidth, gameHeight);
            
            // Fondo
            const gradient = ctx.createRadialGradient(
                gameWidth / 2, gameHeight / 2, 0,
                gameWidth / 2, gameHeight / 2, gameWidth / 2
            );
            gradient.addColorStop(0, '#1a1a3e');
            gradient.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, gameWidth, gameHeight);
            
            // Línea central
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, gameHeight / 2);
            ctx.lineTo(gameWidth, gameHeight / 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Porterías
            ctx.fillStyle = 'rgba(255, 68, 68, 0.3)';
            ctx.fillRect(gameWidth / 2 - GOAL_WIDTH / 2, 0, GOAL_WIDTH, GOAL_HEIGHT);
            
            ctx.fillStyle = 'rgba(0, 255, 136, 0.3)';
            ctx.fillRect(gameWidth / 2 - GOAL_WIDTH / 2, gameHeight - GOAL_HEIGHT, GOAL_WIDTH, GOAL_HEIGHT);
            
            // Partículas
            particles.forEach(particle => {
                ctx.fillStyle = particle.color;
                ctx.globalAlpha = particle.life;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
            });
            ctx.globalAlpha = 1;
            
            // Pelota
            const ballGradient = ctx.createRadialGradient(
                ball.x - 5, ball.y - 5, 0,
                ball.x, ball.y, BALL_RADIUS
            );
            ballGradient.addColorStop(0, '#ffffff');
            ballGradient.addColorStop(0.5, '#ffd700');
            ballGradient.addColorStop(1, '#ff6b35');
            
            ctx.fillStyle = ballGradient;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Jugador local
            ctx.fillStyle = players.you.color;
            ctx.shadowColor = players.you.color;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(players.you.x, players.you.y, PLAYER_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Oponente
            ctx.fillStyle = players.opponent.color;
            ctx.shadowColor = players.opponent.color;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(players.opponent.x, players.opponent.y, PLAYER_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function updateUI() {
            document.getElementById('yourName').textContent = players.you.name;
            document.getElementById('opponentName').textContent = players.opponent.name;
            document.getElementById('yourScore').textContent = players.you.score;
            document.getElementById('opponentScore').textContent = players.opponent.score;
        }

        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            gameWidth = container.clientWidth;
            gameHeight = container.clientHeight;
            
            canvas.width = gameWidth;
            canvas.height = gameHeight;
        }

        function endGame(disconnected = false, winner = null) {
            gameStarted = false;
            
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (timerInterval) clearInterval(timerInterval);
            
            if (disconnected) {
                showResult('👋 Oponente desconectado', 'La partida ha terminado');
            } else {
                const winnerName = winner || 
                    (players.you.score > players.opponent.score ? players.you.name : 
                     players.opponent.score > players.you.score ? players.opponent.name : 'Empate');
                
                const resultTitle = winnerName === 'Empate' ? '🤝 ¡Empate!' : 
                    winnerName === players.you.name ? '🏆 ¡Victoria!' : '😢 ¡Derrota!';
                
                const resultDetails = `
                    ${players.you.name}: ${players.you.score} goles
                    <br>
                    ${players.opponent.name}: ${players.opponent.score} goles
                `;
                
                showResult(resultTitle, resultDetails);
            }
        }

        function showResult(title, details) {
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultDetails').innerHTML = details;
            document.getElementById('resultModal').classList.add('active');
        }

        function showNotification(title, message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <h3>${title}</h3>
                <p>${message}</p>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // ============ CONTROLES ============
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                players.you.x = e.clientX - rect.left;
                players.you.y = e.clientY - rect.top;
            });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                players.you.x = touch.clientX - rect.left;
                players.you.y = touch.clientY - rect.top;
            });
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                players.you.x = touch.clientX - rect.left;
                players.you.y = touch.clientY - rect.top;
            });
        }

        // ============ INICIALIZACIÓN ============
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            
            window.addEventListener('resize', () => {
                if (gameStarted) {
                    resizeCanvas();
                }
            });
        });
    </script>
</body>
</html>
