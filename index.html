<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Mundial de Penales - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #1a1a3e;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --accent2: #f7c948;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .world-cup-banner {
            font-size: 2rem;
            margin: 10px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 420px;
            margin-top: 30px;
        }

        .option-card {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .option-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(45deg, #ff6b35, #f7c948); color: #0a0a1a; }
        .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 2px solid var(--border); }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
        }

        .code-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 5px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-score {
            font-size: 2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .phase-indicator {
            font-size: 1.2rem;
            color: var(--accent2);
            font-weight: bold;
            text-align: center;
        }

        .penalty-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a3e);
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 90%;
        }

        .goal-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            z-index: 1000;
            animation: goalCelebration 1.5s ease-out;
            pointer-events: none;
        }

        @keyframes goalCelebration {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }
    </style>
</head>
<body>
    <div class="connection-screen" id="connectionScreen">
        <h1 class="game-title">⚽ Mundial de Penales</h1>
        <div class="world-cup-banner">🏆🌍🏆</div>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                <button class="btn btn-primary" onclick="createGame()">Crear Sala</button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="text-align:center;color:var(--text-secondary);">Esperando oponente...</p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                <input type="text" id="gameCode" placeholder="CÓDIGO" maxlength="6" oninput="this.value=this.value.toUpperCase()">
                <button class="btn btn-secondary" onclick="joinGame()">Unirse</button>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <span style="font-size:1.5rem;">😊</span>
                <div id="yourName" style="font-size:0.8rem;">Tú</div>
                <div class="player-score" id="yourScore">0</div>
            </div>
            <div style="text-align:center;">
                <div class="phase-indicator" id="phaseIndicator">FASE DE GRUPOS</div>
                <div class="penalty-counter" id="penaltyCounter">Penal 1 de 5</div>
                <div class="timer-text" id="timerText">60</div>
            </div>
            <div class="player-info">
                <span style="font-size:1.5rem;">😎</span>
                <div id="opponentName" style="font-size:0.8rem;">Oponente</div>
                <div class="player-score" id="opponentScore">0</div>
            </div>
        </div>
        <div class="game-canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="margin-bottom:15px;font-size:2rem;"></h2>
            <div id="resultDetails" style="margin-bottom:25px;font-size:1.2rem;"></div>
            <div id="phaseResult" style="margin-bottom:20px;font-size:1rem;color:var(--accent2);"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Constantes del juego
        const BALL_R = 15;
        const PLAYER_R = 30;
        const GOAL_H = 60;
        const COLLISION_DIST = BALL_R + PLAYER_R;
        const KICK_SPEED = 15;
        const COOLDOWN = 500;
        const PENALTIES_PER_PHASE = 5;
        
        // Variables de estado
        let canvas, ctx, W, H;
        let gameRef, gameCode, myKey, isHost;
        let gameActive = false;
        let lastKickTime = 0;
        let currentPhase = 1;
        let penaltyNumber = 0;
        let totalPhases = 5;
        let goalkeeperPosition = 'center';
        
        // Objetos del juego
        const my = { x: 0, y: 0, score: 0, name: '', penaltiesScored: 0 };
        const opp = { x: 0, y: 0, score: 0, name: '', penaltiesScored: 0 };
        const ball = { x: 0, y: 0, vx: 0, vy: 0, isActive: false };
        const goalkeeper = { x: 0, y: 0, targetX: 0 };
        
        // Sistema de audio
        const AudioSystem = {
            context: null,
            init() {
                if (!this.context) {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playGoal() {
                this.init();
                // Sonido de gol - tono ascendente alegre
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, this.context.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.1 + 0.3);
                    osc.start(this.context.currentTime + i * 0.1);
                    osc.stop(this.context.currentTime + i * 0.1 + 0.3);
                });
            },
            playSave() {
                this.init();
                // Sonido de atajada - tono grave descendente
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                osc.connect(gain);
                gain.connect(this.context.destination);
                osc.frequency.setValueAtTime(300, this.context.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.context.currentTime + 0.3);
                osc.type = 'square';
                gain.gain.setValueAtTime(0.3, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.3);
                osc.start();
                osc.stop(this.context.currentTime + 0.3);
            },
            playVictory() {
                this.init();
                // Sonido de victoria - melodía triunfal
                const notes = [523, 523, 523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.context.createOscillator();
                    const gain = this.context.createGain();
                    osc.connect(gain);
                    gain.connect(this.context.destination);
                    osc.frequency.value = freq;
                    osc.type = 'triangle';
                    gain.gain.setValueAtTime(0.25, this.context.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + i * 0.15 + 0.4);
                    osc.start(this.context.currentTime + i * 0.15);
                    osc.stop(this.context.currentTime + i * 0.15 + 0.4);
                });
            },
            playWhistle() {
                this.init();
                // Sonido de silbato
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                osc.connect(gain);
                gain.connect(this.context.destination);
                osc.frequency.value = 2000;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.2, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.5);
                osc.start();
                osc.stop(this.context.currentTime + 0.5);
            }
        };
        
        function createGame() {
            my.name = document.getElementById('playerName').value || 'Jugador 1';
            isHost = true;
            myKey = 'host';
            gameCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            document.getElementById('yourName').textContent = my.name;
            
            gameRef = db.ref('games/' + gameCode);
            gameRef.set({
                host: { name: my.name, x: 0.5, y: 0.75, score: 0, penaltiesScored: 0 },
                opponent: { name: '', x: 0.5, y: 0.25, score: 0, penaltiesScored: 0, connected: false },
                ball: { x: 0.5, y: 0.8, vx: 0, vy: 0, isActive: false },
                goalkeeper: { x: 0.5, y: 0.1 },
                active: true,
                phase: 1,
                penaltyNumber: 0,
                currentPenaltyTaker: 'host'
            });
            
            // Escuchar datos del oponente
            gameRef.child('opponent').on('value', snap => {
                const d = snap.val();
                if (d) {
                    if (d.name) {
                        opp.name = d.name;
                        document.getElementById('opponentName').textContent = d.name;
                    }
                    if (d.x !== undefined && d.x !== null) opp.x = d.x * W;
                    if (d.y !== undefined && d.y !== null) opp.y = d.y * H;
                    if (d.score !== undefined && d.score !== null) {
                        opp.score = d.score;
                        document.getElementById('opponentScore').textContent = d.score;
                    }
                    if (d.connected && !gameActive) startGame();
                }
            });
            
            // Escuchar datos de la pelota
            gameRef.child('ball').on('value', snap => {
                const d = snap.val();
                if (d && gameActive) {
                    ball.x = d.x * W;
                    ball.y = d.y * H;
                    ball.vx = d.vx || 0;
                    ball.vy = d.vy || 0;
                    ball.isActive = d.isActive || false;
                }
            });
            
            // Escuchar datos del arquero
            gameRef.child('goalkeeper').on('value', snap => {
                const d = snap.val();
                if (d && gameActive) {
                    goalkeeper.x = d.x * W;
                    goalkeeper.y = d.y * H;
                }
            });
            
            // Escuchar cambios de fase
            gameRef.child('phase').on('value', snap => {
                const val = snap.val();
                if (val) {
                    currentPhase = val;
                    updatePhaseDisplay();
                }
            });
            
            // Escuchar número de penal
            gameRef.child('penaltyNumber').on('value', snap => {
                const val = snap.val();
                if (val !== null && val !== undefined) {
                    penaltyNumber = val;
                    document.getElementById('penaltyCounter').textContent = `Penal ${penaltyNumber + 1} de ${PENALTIES_PER_PHASE}`;
                }
            });
        }
        
        function joinGame() {
            my.name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const code = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!code) { alert('Ingresa el código'); return; }
            
            isHost = false;
            myKey = 'opponent';
            gameCode = code;
            document.getElementById('yourName').textContent = my.name;
            
            gameRef = db.ref('games/' + code);
            
            gameRef.once('value', snap => {
                if (!snap.exists()) { alert('Partida no encontrada'); return; }
                
                gameRef.child('opponent').update({
                    name: my.name, x: 0.5, y: 0.25, score: 0, penaltiesScored: 0, connected: true
                });
                
                // Escuchar datos del host
                gameRef.child('host').on('value', snap => {
                    const d = snap.val();
                    if (d) {
                        if (d.name) {
                            opp.name = d.name;
                            document.getElementById('opponentName').textContent = d.name;
                        }
                        if (d.x !== undefined && d.x !== null) opp.x = d.x * W;
                        if (d.y !== undefined && d.y !== null) opp.y = d.y * H;
                        if (d.score !== undefined && d.score !== null) {
                            opp.score = d.score;
                            document.getElementById('opponentScore').textContent = d.score;
                        }
                    }
                });
                
                // Escuchar datos de la pelota
                gameRef.child('ball').on('value', snap => {
                    const d = snap.val();
                    if (d && gameActive) {
                        ball.x = d.x * W;
                        ball.y = d.y * H;
                        ball.vx = d.vx || 0;
                        ball.vy = d.vy || 0;
                        ball.isActive = d.isActive || false;
                    }
                });
                
                // Escuchar datos del arquero
                gameRef.child('goalkeeper').on('value', snap => {
                    const d = snap.val();
                    if (d && gameActive) {
                        goalkeeper.x = d.x * W;
                        goalkeeper.y = d.y * H;
                    }
                });
                
                // Escuchar cambios de fase
                gameRef.child('phase').on('value', snap => {
                    const val = snap.val();
                    if (val) {
                        currentPhase = val;
                        updatePhaseDisplay();
                    }
                });
                
                // Escuchar número de penal
                gameRef.child('penaltyNumber').on('value', snap => {
                    const val = snap.val();
                    if (val !== null && val !== undefined) {
                        penaltyNumber = val;
                        document.getElementById('penaltyCounter').textContent = `Penal ${penaltyNumber + 1} de ${PENALTIES_PER_PHASE}`;
                    }
                });
            });
        }
        
        function updatePhaseDisplay() {
            const phases = ['FASE DE GRUPOS', 'OCTAVOS DE FINAL', 'CUARTOS DE FINAL', 'SEMIFINAL', 'FINAL'];
            document.getElementById('phaseIndicator').textContent = phases[currentPhase - 1] || 'FASE DE GRUPOS';
        }
        
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            
            // Posiciones iniciales
            ball.x = W / 2;
            ball.y = H * 0.8;
            ball.isActive = false;
            
            if (isHost) {
                my.x = W / 2;
                my.y = H * 0.75;
                goalkeeper.x = W / 2;
                goalkeeper.y = H * 0.1;
                
                gameRef.update({ 
                    active: true, 
                    phase: 1,
                    penaltyNumber: 0,
                    ball: { x: 0.5, y: 0.8, vx: 0, vy: 0, isActive: false },
                    goalkeeper: { x: 0.5, y: 0.1 }
                });
                
                AudioSystem.playWhistle();
            } else {
                my.x = W / 2;
                my.y = H * 0.25;
            }
            
            gameActive = true;
            updatePhaseDisplay();
            gameLoop();
        }
        
        function shootPenalty(targetX, targetY) {
            if (!ball.isActive && gameActive) {
                ball.isActive = true;
                ball.x = my.x;
                ball.y = my.y;
                
                // Calcular dirección del disparo
                const dx = targetX - ball.x;
                const dy = targetY - ball.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                ball.vx = (dx / dist) * KICK_SPEED;
                ball.vy = (dy / dist) * KICK_SPEED;
                
                // Enviar a Firebase
                gameRef.child('ball').set({
                    x: ball.x / W,
                    y: ball.y / H,
                    vx: ball.vx,
                    vy: ball.vy,
                    isActive: true
                });
                
                // Mover arquero aleatoriamente
                moveGoalkeeper();
            }
        }
        
        function moveGoalkeeper() {
            // El arquero se mueve aleatoriamente
            const positions = ['left', 'center', 'right'];
            const newPosition = positions[Math.floor(Math.random() * 3)];
            
            let targetX;
            switch(newPosition) {
                case 'left': targetX = W * 0.25; break;
                case 'right': targetX = W * 0.75; break;
                default: targetX = W * 0.5; break;
            }
            
            goalkeeper.targetX = targetX;
            
            // Enviar posición del arquero
            gameRef.child('goalkeeper').update({
                x: targetX / W,
                y: goalkeeper.y / H
            });
        }
        
        function checkGoal() {
            if (!ball.isActive) return;
            
            // Verificar si la pelota entró al arco
            if (ball.y < GOAL_H && ball.vy < 0) {
                // Verificar si el arquero la atajó
                const dx = ball.x - goalkeeper.x;
                const dy = ball.y - goalkeeper.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 50) {
                    // ¡Atajada!
                    AudioSystem.playSave();
                    showAnimation('🧤');
                    
                    // Incrementar contador de penales
                    penaltyNumber++;
                    if (penaltyNumber >= PENALTIES_PER_PHASE) {
                        nextPhase();
                    } else {
                        gameRef.child('penaltyNumber').set(penaltyNumber);
                    }
                } else {
                    // ¡GOL!
                    AudioSystem.playGoal();
                    showAnimation('⚽');
                    
                    my.score++;
                    my.penaltiesScored++;
                    document.getElementById('yourScore').textContent = my.score;
                    gameRef.child(myKey + '/score').set(my.score);
                    
                    // Incrementar contador de penales
                    penaltyNumber++;
                    if (penaltyNumber >= PENALTIES_PER_PHASE) {
                        nextPhase();
                    } else {
                        gameRef.child('penaltyNumber').set(penaltyNumber);
                    }
                }
                
                // Resetear pelota
                resetBall();
            }
        }
        
        function nextPhase() {
            currentPhase++;
            penaltyNumber = 0;
            
            if (currentPhase > totalPhases) {
                endGame();
                return;
            }
            
            AudioSystem.playWhistle();
            gameRef.update({
                phase: currentPhase,
                penaltyNumber: 0
            });
            
            updatePhaseDisplay();
            document.getElementById('penaltyCounter').textContent = 'Penal 1 de 5';
        }
        
        function resetBall() {
            ball.x = W / 2;
            ball.y = H * 0.8;
            ball.vx = 0;
            ball.vy = 0;
            ball.isActive = false;
            
            gameRef.child('ball').set({
                x: 0.5,
                y: 0.8,
                vx: 0,
                vy: 0,
                isActive: false
            });
        }
        
        function showAnimation(emoji) {
            const anim = document.createElement('div');
            anim.className = 'goal-animation';
            anim.textContent = emoji;
            document.body.appendChild(anim);
            setTimeout(() => anim.remove(), 1500);
        }
        
        function gameLoop() {
            if (!gameActive) return;
            
            // Enviar posición
            gameRef.child(myKey + '/x').set(my.x / W);
            gameRef.child(myKey + '/y').set(my.y / H);
            
            // Actualizar física de la pelota si está activa
            if (ball.isActive) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                // Rebote en paredes laterales
                if (ball.x < BALL_R || ball.x > W - BALL_R) {
                    ball.vx = -ball.vx;
                }
                
                // Verificar gol o atajada
                checkGoal();
                
                // Enviar posición de la pelota
                gameRef.child('ball').update({
                    x: ball.x / W,
                    y: ball.y / H,
                    vx: ball.vx,
                    vy: ball.vy
                });
            }
            
            // Mover arquero suavemente
            if (goalkeeper.targetX) {
                const dx = goalkeeper.targetX - goalkeeper.x;
                if (Math.abs(dx) > 2) {
                    goalkeeper.x += dx * 0.1;
                }
            }
            
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, W, H);
            
            // Fondo
            const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
            bgGrad.addColorStop(0, '#1a1a3e');
            bgGrad.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            // Campo
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, H/2);
            ctx.lineTo(W, H/2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Área penal
            ctx.strokeStyle = '#4a4a6e';
            ctx.strokeRect(W*0.1, 0, W*0.8, H*0.3);
            ctx.strokeRect(W*0.2, 0, W*0.6, H*0.15);
            
            // Arco
            ctx.fillStyle = 'rgba(255,68,68,0.8)';
            ctx.fillRect(W*0.2, 0, W*0.6, GOAL_H);
            
            // Arquero
            ctx.fillStyle = '#ffaa00';
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(goalkeeper.x, goalkeeper.y, 35, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Pelota
            if (ball.isActive || ball.y > H*0.5) {
                const ballGrad = ctx.createRadialGradient(ball.x-3, ball.y-3, 0, ball.x, ball.y, BALL_R);
                ballGrad.addColorStop(0, '#ffffff');
                ballGrad.addColorStop(1, '#ffd700');
                ctx.fillStyle = ballGrad;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            // Jugador
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(my.x, my.y, PLAYER_R, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            W = container.clientWidth;
            H = container.clientHeight;
            canvas.width = W;
            canvas.height = H;
            
            if (ball.x === 0 && ball.y === 0) {
                ball.x = W / 2;
                ball.y = H * 0.8;
            }
        }
        
        function endGame() {
            gameActive = false;
            
            if (my.score > opp.score) {
                AudioSystem.playVictory();
            }
            
            const phases = ['Fase de Grupos', 'Octavos', 'Cuartos', 'Semifinal', 'Final'];
            const winner = my.score > opp.score ? 'Tú' : opp.score > my.score ? 'Oponente' : 'Empate';
            
            document.getElementById('resultTitle').textContent = 
                winner === 'Empate' ? '🤝 Empate' : 
                winner === 'Tú' ? '🏆 ¡Campeón!' : '😢 Derrota';
            
            document.getElementById('resultDetails').innerHTML = 
                `Tú: ${my.score} goles - Oponente: ${opp.score} goles`;
            
            document.getElementById('phaseResult').textContent = 
                currentPhase > totalPhases ? '¡Finalizado!' : 
                `Eliminado en ${phases[currentPhase - 1]}`;
            
            document.getElementById('resultModal').classList.add('active');
            
            if (isHost) {
                gameRef.update({ active: false });
            }
        }
        
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function move(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;
                
                x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, x));
                y = Math.max(H*0.6, Math.min(H - PLAYER_R, y));
                
                my.x = x;
                my.y = y;
            }
            
            function shoot(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const targetX = clientX - rect.left;
                const targetY = clientY - rect.top;
                shootPenalty(targetX, targetY);
            }
            
            // Mouse
            canvas.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            canvas.addEventListener('click', e => shoot(e.clientX, e.clientY));
            
            // Touch
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const touch = e.touches[0];
                move(touch.clientX, touch.clientY);
            }, { passive: false });
            
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.touches[0];
                move(touch.clientX, touch.clientY);
            }, { passive: false });
            
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                if (e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    shoot(touch.clientX, touch.clientY);
                }
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            window.addEventListener('resize', () => {
                if (gameActive) resizeCanvas();
            });
            
            // Inicializar sistema de audio al primer click
            document.addEventListener('click', () => AudioSystem.init(), { once: true });
        });
    </script>
</body>
</html>
