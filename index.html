<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Ball Rush - Multijugador</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-card: #16213e;
            --accent: #ff6b35;
            --gold: #ffd700;
            --success: #00ff88;
            --danger: #ff4444;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --border: #2a2a4e;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .connection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .ball-animation {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .connection-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px;
        }

        .option-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--accent);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b35, #f7c948);
            color: #0a0a1a;
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .input-group { margin: 10px 0; }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .code-display {
            background: var(--bg-primary);
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin: 10px 0;
        }

        .code-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .game-screen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .player-info.opponent { justify-content: flex-end; }

        .player-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
        }

        .player-avatar.you { border-color: var(--success); }
        .player-avatar.opponent { border-color: var(--danger); }

        .player-name { font-size: 0.8rem; font-weight: bold; }
        .player-score { font-size: 1.2rem; color: var(--gold); font-weight: bold; }

        .timer-display { text-align: center; padding: 0 15px; }
        .timer-text { font-size: 2rem; font-weight: bold; color: var(--gold); }

        .game-canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px 20px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 90%;
            width: 350px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .game-title { font-size: 2rem; }
            .ball-animation { font-size: 3rem; }
            .code-text { font-size: 1.5rem; }
            .player-avatar { width: 30px; height: 30px; font-size: 1rem; }
            .timer-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="connection-screen" id="connectionScreen">
        <div class="ball-animation">⚽</div>
        <h1 class="game-title">Ball Rush</h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">¡Empuja la pelota hacia la portería!</p>
        
        <div class="connection-options">
            <div class="option-card">
                <div class="option-title">🎮 Crear Partida</div>
                <div class="input-group">
                    <input type="text" id="playerName" placeholder="Tu nombre" maxlength="15">
                </div>
                <button class="btn btn-primary" onclick="createGame()">Crear Sala</button>
                <div id="createdCode" style="display: none;">
                    <div class="code-display">
                        <p style="color: var(--text-secondary); font-size: 0.8rem;">Código:</p>
                        <div class="code-text" id="gameCodeText"></div>
                    </div>
                    <p style="color: var(--text-secondary); text-align: center;">Esperando oponente...</p>
                </div>
            </div>
            
            <div class="option-card">
                <div class="option-title">🔗 Unirse</div>
                <div class="input-group">
                    <input type="text" id="playerNameJoin" placeholder="Tu nombre" maxlength="15">
                </div>
                <div class="input-group">
                    <input type="text" id="gameCode" placeholder="Código" maxlength="6" 
                           oninput="this.value = this.value.toUpperCase()">
                </div>
                <button class="btn btn-secondary" onclick="joinGame()">Unirse</button>
            </div>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar you">😊</div>
                <div>
                    <div class="player-name" id="yourName">Tú</div>
                    <div class="player-score" id="yourScore">0</div>
                </div>
            </div>
            
            <div class="timer-display">
                <div class="timer-text" id="timerText">60</div>
            </div>
            
            <div class="player-info opponent">
                <div style="text-align: right;">
                    <div class="player-name" id="opponentName">Oponente</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
                <div class="player-avatar opponent">😎</div>
            </div>
        </div>
        
        <div class="game-canvas-container">
            <canvas class="game-canvas" id="canvas"></canvas>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="font-size: 1.8rem; margin-bottom: 15px;"></h2>
            <div id="resultDetails" style="margin-bottom: 20px;"></div>
            <button class="btn btn-primary" onclick="location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        // ============ CONFIGURACIÓN DE FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyC2z25XXN_rRSCjeDLK8nGIkq7pm5pt0ps",
            authDomain: "prueba-be093.firebaseapp.com",
            databaseURL: "https://prueba-be093-default-rtdb.firebaseio.com",
            projectId: "prueba-be093",
            storageBucket: "prueba-be093.firebasestorage.app",
            messagingSenderId: "292144008043",
            appId: "1:292144008043:web:b29b23b80b115204909a2e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ============ SISTEMA DE SONIDOS ============
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioContext = null;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new AudioContext();
            }
        }
        
        function playSound(type) {
            try {
                initAudio();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                switch(type) {
                    case 'kick':
                        oscillator.frequency.setValueAtTime(150, audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.1);
                        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.1);
                        break;
                        
                    case 'goal':
                        oscillator.frequency.setValueAtTime(523, audioContext.currentTime);
                        oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.1);
                        oscillator.frequency.setValueAtTime(784, audioContext.currentTime + 0.2);
                        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.3);
                        break;
                        
                    case 'wall':
                        oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.05);
                        gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.05);
                        break;
                        
                    case 'win':
                        oscillator.frequency.setValueAtTime(523, audioContext.currentTime);
                        oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.15);
                        oscillator.frequency.setValueAtTime(784, audioContext.currentTime + 0.3);
                        oscillator.frequency.setValueAtTime(1047, audioContext.currentTime + 0.45);
                        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.6);
                        break;
                        
                    case 'lose':
                        oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.4);
                        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.4);
                        break;
                }
            } catch (error) {
                console.log('Error reproduciendo sonido:', error);
            }
        }
        
        // ============ CONFIGURACIÓN DEL JUEGO ============
        const GAME_DURATION = 60;
        const BALL_RADIUS = 15;
        const PLAYER_RADIUS = 25;
        const GOAL_HEIGHT = 40;
        
        let gameCode = null;
        let isHost = false;
        let gameRef = null;
        let gameStarted = false;
        let canvas, ctx;
        let gameWidth, gameHeight;
        let myPlayerKey = null;
        let opponentPlayerKey = null;
        
        const players = {
            you: { x: 0, y: 0, score: 0, name: 'Tú' },
            opponent: { x: 0, y: 0, score: 0, name: 'Oponente' }
        };
        
        const ball = { x: 0, y: 0, vx: 0, vy: 0 };
        let timeLeft = GAME_DURATION;
        
        // ============ CONEXIÓN ============
        function createGame() {
            const name = document.getElementById('playerName').value || 'Jugador 1';
            players.you.name = name;
            isHost = true;
            myPlayerKey = 'host';
            opponentPlayerKey = 'opponent';
            gameCode = generateCode();
            
            document.getElementById('createdCode').style.display = 'block';
            document.getElementById('gameCodeText').textContent = gameCode;
            
            gameRef = database.ref('games/' + gameCode);
            
            gameRef.set({
                host: {
                    name: name,
                    x: 400,
                    y: 400,
                    score: 0,
                    connected: true
                },
                opponent: {
                    name: '',
                    x: 400,
                    y: 100,
                    score: 0,
                    connected: false
                },
                ball: {
                    x: 400,
                    y: 300,
                    vx: 0,
                    vy: 0,
                    lastKicker: null
                },
                started: false,
                timeLeft: GAME_DURATION,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            });
            
            gameRef.child('opponent/connected').on('value', (snapshot) => {
                if (snapshot.val() === true && !gameStarted) {
                    gameRef.child('opponent/name').once('value', (nameSnapshot) => {
                        players.opponent.name = nameSnapshot.val() || 'Oponente';
                        startGame();
                    });
                }
            });
            
            gameRef.child('opponent').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && gameStarted) {
                    players.opponent.x = data.x || 400;
                    players.opponent.y = data.y || 100;
                    players.opponent.score = data.score || 0;
                    updateUI();
                }
            });
            
            gameRef.child('ball').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && gameStarted) {
                    ball.x = data.x;
                    ball.y = data.y;
                    ball.vx = data.vx;
                    ball.vy = data.vy;
                }
            });
        }
        
        function joinGame() {
            const name = document.getElementById('playerNameJoin').value || 'Jugador 2';
            const code = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!code || code.length !== 6) {
                showNotification('Error', 'Ingresa un código válido', 'error');
                return;
            }
            
            players.you.name = name;
            isHost = false;
            myPlayerKey = 'opponent';
            opponentPlayerKey = 'host';
            gameCode = code;
            
            gameRef = database.ref('games/' + code);
            
            gameRef.once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    showNotification('Error', 'No se encontró la partida', 'error');
                    return;
                }
                
                gameRef.child('opponent').update({
                    name: name,
                    connected: true
                });
                
                gameRef.child('host').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        players.opponent.name = data.name;
                        players.opponent.x = data.x || 400;
                        players.opponent.y = data.y || 400;
                        players.opponent.score = data.score || 0;
                        updateUI();
                    }
                });
                
                gameRef.child('ball').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && gameStarted) {
                        ball.x = data.x;
                        ball.y = data.y;
                        ball.vx = data.vx;
                        ball.vy = data.vy;
                    }
                });
                
                gameRef.child('started').on('value', (snapshot) => {
                    if (snapshot.val() === true && !gameStarted) {
                        startGame();
                    }
                });
                
                gameRef.child('timeLeft').on('value', (snapshot) => {
                    const time = snapshot.val();
                    if (time !== null && gameStarted) {
                        timeLeft = time;
                        document.getElementById('timerText').textContent = time;
                    }
                });
            });
        }
        
        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }
        
        // ============ JUEGO ============
        function startGame() {
            document.getElementById('connectionScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            
            if (isHost) {
                players.you.x = gameWidth / 2;
                players.you.y = gameHeight - GOAL_HEIGHT - PLAYER_RADIUS;
                ball.x = gameWidth / 2;
                ball.y = gameHeight / 2;
                ball.vx = 0;
                ball.vy = 0;
                
                gameRef.update({
                    started: true,
                    timeLeft: GAME_DURATION,
                    ball: {
                        x: ball.x,
                        y: ball.y,
                        vx: 0,
                        vy: 0,
                        lastKicker: null
                    }
                });
                
                const timerInterval = setInterval(() => {
                    if (!gameStarted) {
                        clearInterval(timerInterval);
                        return;
                    }
                    
                    timeLeft--;
                    document.getElementById('timerText').textContent = timeLeft;
                    gameRef.child('timeLeft').set(timeLeft);
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        endGame(false);
                    }
                }, 1000);
                
                const ballInterval = setInterval(() => {
                    if (!gameStarted) {
                        clearInterval(ballInterval);
                        return;
                    }
                    updateBall();
                    gameRef.child('ball').set({
                        x: ball.x,
                        y: ball.y,
                        vx: ball.vx,
                        vy: ball.vy,
                        lastKicker: ball.lastKicker
                    });
                }, 16);
            } else {
                players.you.x = gameWidth / 2;
                players.you.y = GOAL_HEIGHT + PLAYER_RADIUS;
            }
            
            gameStarted = true;
            timeLeft = GAME_DURATION;
            updateUI();
            gameLoop();
        }
        
        function updateBall() {
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // Fricción
            ball.vx *= 0.99;
            ball.vy *= 0.99;
            
            // Rebote en paredes laterales
            if (ball.x < BALL_RADIUS) {
                ball.x = BALL_RADIUS;
                ball.vx = Math.abs(ball.vx) * 0.8;
                playSound('wall');
            }
            if (ball.x > gameWidth - BALL_RADIUS) {
                ball.x = gameWidth - BALL_RADIUS;
                ball.vx = -Math.abs(ball.vx) * 0.8;
                playSound('wall');
            }
            
            // Gol para el host (abajo)
            if (ball.y > gameHeight - BALL_RADIUS) {
                if (ball.lastKicker === 'opponent') {
                    players.opponent.score++;
                    gameRef.child('opponent/score').set(players.opponent.score);
                    playSound('goal');
                }
                updateUI();
                resetBall();
            }
            
            // Gol para el oponente (arriba)
            if (ball.y < BALL_RADIUS) {
                if (ball.lastKicker === 'host') {
                    players.you.score++;
                    gameRef.child('host/score').set(players.you.score);
                    playSound('goal');
                }
                updateUI();
                resetBall();
            }
            
            // Colisión con jugador local
            checkPlayerCollision();
        }
        
        function checkPlayerCollision() {
            const dx = players.you.x - ball.x;
            const dy = players.you.y - ball.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < PLAYER_RADIUS + BALL_RADIUS) {
                const angle = Math.atan2(dy, dx);
                const force = 7;
                ball.vx = Math.cos(angle) * force;
                ball.vy = Math.sin(angle) * force;
                ball.lastKicker = myPlayerKey;
                playSound('kick');
                
                // Enviar actualización inmediata
                if (gameRef) {
                    gameRef.child('ball').set({
                        x: ball.x,
                        y: ball.y,
                        vx: ball.vx,
                        vy: ball.vy,
                        lastKicker: ball.lastKicker
                    });
                }
            }
        }
        
        function resetBall() {
            ball.x = gameWidth / 2;
            ball.y = gameHeight / 2;
            ball.vx = 0;
            ball.vy = 0;
            ball.lastKicker = null;
            
            if (gameRef && isHost) {
                gameRef.child('ball').set({
                    x: ball.x,
                    y: ball.y,
                    vx: 0,
                    vy: 0,
                    lastKicker: null
                });
            }
        }
        
        function gameLoop() {
            if (!gameStarted) return;
            
            if (gameRef && myPlayerKey) {
                gameRef.child(myPlayerKey).update({
                    x: players.you.x,
                    y: players.you.y
                });
            }
            
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.clearRect(0, 0, gameWidth, gameHeight);
            
            // Fondo
            ctx.fillStyle = '#1a1a3e';
            ctx.fillRect(0, 0, gameWidth, gameHeight);
            
            // Línea central
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, gameHeight / 2);
            ctx.lineTo(gameWidth, gameHeight / 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Círculo central
            ctx.strokeStyle = '#2a2a4e';
            ctx.beginPath();
            ctx.arc(gameWidth / 2, gameHeight / 2, 60, 0, Math.PI * 2);
            ctx.stroke();
            
            // Porterías
            ctx.fillStyle = 'rgba(255, 68, 68, 0.5)';
            ctx.fillRect(0, 0, gameWidth, GOAL_HEIGHT);
            
            ctx.fillStyle = 'rgba(0, 255, 136, 0.5)';
            ctx.fillRect(0, gameHeight - GOAL_HEIGHT, gameWidth, GOAL_HEIGHT);
            
            // Área restringida para jugadores (mitad de cancha)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.fillRect(0, isHost ? gameHeight / 2 : 0, gameWidth, gameHeight / 2);
            
            // Pelota
            const gradient = ctx.createRadialGradient(
                ball.x - 5, ball.y - 5, 0,
                ball.x, ball.y, BALL_RADIUS
            );
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#ffd700');
            
            ctx.fillStyle = gradient;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Jugador local
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(players.you.x, players.you.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Oponente
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(players.opponent.x, players.opponent.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Nombres
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(players.you.name, players.you.x, players.you.y - PLAYER_RADIUS - 10);
            ctx.fillText(players.opponent.name, players.opponent.x, players.opponent.y - PLAYER_RADIUS - 10);
        }
        
        function updateUI() {
            document.getElementById('yourName').textContent = players.you.name;
            document.getElementById('opponentName').textContent = players.opponent.name;
            document.getElementById('yourScore').textContent = players.you.score;
            document.getElementById('opponentScore').textContent = players.opponent.score;
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-canvas-container');
            gameWidth = container.clientWidth;
            gameHeight = container.clientHeight;
            canvas.width = gameWidth;
            canvas.height = gameHeight;
        }
        
        function endGame(disconnected = false) {
            gameStarted = false;
            
            if (disconnected) {
                document.getElementById('resultTitle').textContent = '👋 Oponente desconectado';
                document.getElementById('resultDetails').innerHTML = 'La partida ha terminado';
                playSound('lose');
            } else {
                const winner = players.you.score > players.opponent.score ? 
                    players.you.name : 
                    players.opponent.score > players.you.score ? 
                    players.opponent.name : 'Empate';
                
                document.getElementById('resultTitle').textContent = 
                    winner === 'Empate' ? '🤝 ¡Empate!' : 
                    winner === players.you.name ? '🏆 ¡Victoria!' : '😢 ¡Derrota!';
                
                document.getElementById('resultDetails').innerHTML = `
                    ${players.you.name}: ${players.you.score} goles<br>
                    ${players.opponent.name}: ${players.opponent.score} goles
                `;
                
                if (winner === players.you.name) {
                    playSound('win');
                } else if (winner !== 'Empate') {
                    playSound('lose');
                }
            }
            
            document.getElementById('resultModal').classList.add('active');
            
            if (gameRef && isHost) {
                gameRef.remove();
            }
        }
        
        function showNotification(title, message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.borderColor = type === 'error' ? '#ff4444' : '#00ff88';
            notification.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        function setupControls() {
            const canvas = document.getElementById('canvas');
            
            function updatePosition(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;
                
                // Restringir a la mitad de la cancha
                x = Math.max(PLAYER_RADIUS, Math.min(gameWidth - PLAYER_RADIUS, x));
                
                if (isHost) {
                    // Host solo en la mitad inferior
                    y = Math.max(gameHeight / 2 + PLAYER_RADIUS, Math.min(gameHeight - PLAYER_RADIUS, y));
                } else {
                    // Oponente solo en la mitad superior
                    y = Math.max(PLAYER_RADIUS, Math.min(gameHeight / 2 - PLAYER_RADIUS, y));
                }
                
                players.you.x = x;
                players.you.y = y;
            }
            
            canvas.addEventListener('mousemove', (e) => updatePosition(e.clientX, e.clientY));
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                updatePosition(touch.clientX, touch.clientY);
            }, { passive: false });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                updatePosition(touch.clientX, touch.clientY);
            }, { passive: false });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            window.addEventListener('resize', () => {
                if (gameStarted) resizeCanvas();
            });
        });
    </script>
</body>
</html>
